<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — שיטות וכלי ניהול מתקדמים</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9cc0f0; --clsBg:#1c3350;
    --sumTx:#c9b3ee; --sumBg:#2e2340;
    --chipBg:#2f2f2a; --onAccent:#0b1f1c;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9cc0f0; --clsBg:#1c3350;
  --sumTx:#c9b3ee; --sumBg:#2e2340;
  --chipBg:#2f2f2a; --onAccent:#0b1f1c;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בצבע נייטרלי. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#0f5a54;--muted:#444;--okTx:#0a5c22;--border:#bbb;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
}
</style>
</head>

<script>
var BANK=[
/* ===================== שיעור 1 — מבוא לניהול (1) ===================== */
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"לפי ההגדרה שנבחרה בשקף 'Definition of Management', ניהול (Management) הוא:",o:["תהליך המקבל החלטות מבוססות נתונים כדי למקסם את רווחי הארגון ואת ערכו לבעלי המניות","התהליך הכולל תכנון, ארגון, הובלה ובקרה של מאמצים אנושיים להשגת יעדים מוצהרים בארגון","הפעולה של הקצאת משאבים כספיים וחומריים בין מחלקות הארגון לפי סדר עדיפויות קבוע מראש","היכולת להשפיע על עובדים ולהניע אותם לפעולה באמצעות תגמולים, הכרה ודוגמה אישית"],c:1,e:"שקף 4: 'the process involving planning, organizing, leading, and controlling human efforts to achieve stated objectives in an organization'. השקף מדגיש שאין הגדרה מדויקת אחת, והגדרות אחרות נוגעות בקבלת החלטות, אנשים, ייצור ויעילות. השפעה על עובדים (אפשרות ד') היא רק פונקציית ההובלה."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"בשיעור הראשון כל סטודנט תיאר 'מנהל טוב', ועלו תכונות כמו אמפתיה, שקיפות, מיצוי משאבים וירידה לשטח. כיצד סיכמה המרצה את הדיון?",o:["כל מה שנאמר נכלל בארבע פונקציות הניהול: תכנון, ארגון, הובלה ובקרה — אין הגדרה מדויקת אחת","התכונות שעלו הן של מנהיג ולא של מנהל, ולכן אינן חלק מהגדרת הניהול עצמה ויילמדו בנפרד","יש הגדרה אחת מוסכמת לניהול בספרות המקצועית, והיא מבוססת בעיקר על קבלת החלטות ועל יעילות","רוב התכונות נוגעות לדרג הבכיר בלבד, ולכן הן רלוונטיות למנהל הכללי ולא למנהל הפונקציונלי"],c:0,e:"המרצה [61:22-62:16]: 'אין הגדרה אחת שהיא מדויקת... כל מה שאמרתם נכלל בתוך ארבע הפונקציות — תכנון, ארגון, מנהיגות ובקרה'. היא הוסיפה שאינטליגנציה רגשית היא חלק מפונקציית המנהיגות, ושארבע הפונקציות תקפות לכל מנהל ולכל ארגון."},
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"איזו מהפעולות הבאות שייכת לפונקציית הארגון (Organizing) ולא לפונקציית התכנון (Planning), לפי הגדרות השקפים?",o:["זיהוי המשאבים הדרושים והתחייבות להקצאתם לטובת השגת היעדים","הגדרת המשימות שיש לבצע, ותיאור האופן והמועד שבהם יבוצעו","שיוך המשימות המתוכננות ליחידים ולקבוצות, ומנגנון לביצוען","קביעת יעדי הארגון, הכיוונים הכלליים שלו והאמצעים להגיע אליהם"],c:2,e:"שקף 8 (Organizing): היכן יתקבלו החלטות, הקמת מחלקות והגדרות תפקיד, ושיוך המשימות המתוכננות ליחידים ולקבוצות עם מנגנון ליישום. שלוש האפשרויות האחרות לקוחות משקף 7 (Planning) — כולל 'Identifying and committing resources', שנוטים לשייך בטעות לארגון."},
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"מנהלת מוקד שירות מקבלת בסוף כל שבוע דוח על זמני ההמתנה, משווה אותו ליעד שנקבע בתוכנית העבודה ומחליטה על שינויים במשמרות כשיש חריגה. לפי שקפי הקורס, איזו פונקציה ניהולית היא מבצעת?",o:["תכנון (Planning) — כי השינויים במשמרות הם הגדרה מחודשת של יעדים ואמצעים","ארגון (Organizing) — כי היא משנה את שיוך העובדים למשמרות ולמשימות","הובלה (Leading) — כי היא מכוונת את פעילות העובדים לשיפור התפוקה","בקרה (Controlling) — מדידה, השוואה למתוכנן ופעולה מתקנת"],c:3,e:"שקף 10: הבקרה כוללת איסוף מידע שמודד ביצועים, השוואת הביצוע בפועל לביצוע המתוכנן, וקביעת פעולות מתקנות. השינוי במשמרות הוא הפעולה המתקנת שבסוף תהליך הבקרה — ולא תכנון או ארגון מחדש."},
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"לפי השקף 'Leading', מהי פונקציית ההובלה (Leading)?",o:["השפעה על פעילות חברי הארגון והכוונתה לכיוון הרצוי, במטרה לשפר את התפוקה","קביעת כיוון אסטרטגי לארגון ותרגומו ליעדים מדידים לכל מחלקה ולכל עובד","הגדרת מבנה הסמכויות בארגון וקביעה מי מדווח למי בשרשרת הפיקוד","מעקב אחר ביצועי העובדים והשוואתם לסטנדרטים שנקבעו מראש לכל תפקיד"],c:0,e:"שקף 9: 'Influencing and guiding the activities of organization members in the sought directions, targeting improved productivity', וגם עידוד אחרים לבצע את המשימות ולהשיג את יעדי הארגון. קביעת כיוון ויעדים היא תכנון, מבנה סמכויות הוא ארגון, והשוואה לסטנדרטים היא בקרה."},
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"לפי השקף 'The Manager's Responsibilities', המנהל מתכנן, מארגן, מכוון ומבקר את הקצאתם של אילו סוגי משאבים?",o:["משאבי אנוש, משאבים חומריים, כספיים ומשאבי מידע","משאבי אנוש, זמן, מוניטין וקשרים עם בעלי עניין","הון, קרקע, עבודה ויזמות — גורמי הייצור הקלאסיים","תקציב, ציוד, מבנים ומערכות טכנולוגיות בארגון"],c:0,e:"שקף 5: 'allocation of human, material, financial, and information resources, in pursuit of fulfilling the organization's goals'. בכיתה המרצה הרחיבה: גם העובדים וגם התרבות הארגונית הם משאב."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"'מה הם משאבים? רק כסף? רק טכנולוגיה?' — המרצה 'גילתה סוד' על משאב שמנהלים נוטים לשכוח. מהו המשאב, ומה ההסבר שנתנה?",o:["הזמן — כי ניהול זמן נכון מאפשר להשיג יותר תפוקות באותם משאבים","המידע — כי דשבורדים ומסכי ענק חוסכים למנהל את הירידה לשטח","התרבות הארגונית — בתרבות פתוחה עובדים לא יפחדו לומר 'טעינו'","הלקוחות — כי המשוב שלהם הוא מקור המידע החשוב ביותר לבקרה בארגון"],c:2,e:"המרצה [51:42-52:31]: 'עובדים הם משאב... תרבות ארגונית היא משאב — אם התרבות היא של פתיחות ושקיפות, יש לך עובדים מסורים שלא יפחדו לבוא ולהגיד טעינו, כשלנו'. והאתגר: 'להגיע למקסימום תפוקה במינימום משאבים'. דשבורדים, לדבריה, אינם תחליף לירידה לשטח."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"כשרמ״חים ורמ״דים מציגים למרצה תוכניות עבודה, היא נוהגת לשאול 'רגע, מתי ביקרתם את זה?'. איזה עיקרון היא ביקשה להמחיש?",o:["הבקרה קודמת לתכנון: אין לתכנן לפני שבוקרו כל התהליכים הקיימים ביחידה","תוכנית טובה אינה משתנה במהלך השנה, ולכן הבקרה נעשית רק בסיום התקופה","תכנון ובקרה הן פונקציות נפרדות, שכל אחת מהן באחריות דרג ניהול אחר","תכנון ובקרה הם מעגל: התכנון פותח אותו, והבקרה סוגרת אותו לשיפור בהמשך"],c:3,e:"המרצה [64:14-64:50]: 'אם לא יהיה תכנון, לא נוכל לבקר. התכנון והבקרה הם בעצם מעגל — התכנון מתחיל, אבל הבקרה סוגרת את המעגל כדי להיות יותר טובים בהמשך'. בשיעור 3 זה חוזר: אחת ממטרות התכנון היא קביעת סטנדרטים לבקרה (Setting standards for controlling)."},
{l:1,t:"יעדים, תכנון ו-MBO",s:"זום",q:"מפקד יחידה מציג תוכנית עבודה מרשימה עם יעדים ולוחות זמנים ברורים, אך לא הוקצו בה כוח האדם והתקציב הנדרשים לביצוע. לפי המרצה, מה הבעיה העיקרית בתוכנית?",o:["תכנון טוב נגזר מהמשאבים — בלי משאבים לא יעמדו במשימה","התוכנית אינה כוללת תרחישים, ולכן אינה מתאימה לסביבה צבאית משתנה ומורכבת כל כך","תוכנית עבודה צריכה להיקבע בידי ההנהלה הבכירה בלבד ולא בידי מפקד היחידה","יש להגדיר קודם את מערך הבקרה ואת מדדי ה-KPI, ורק אחר כך את יעדי היחידה"],c:0,e:"המרצה [64:55-65:26]: 'אם אני מתכננת והכל יפה, אבל לא ייעדתי את המשאבים הרלוונטיים לביצוע — לא אעמוד במשימה. תכנון טוב נגזר ממשאבים', והיעד: 'במינימום אמצעים להגיע למקסימום תפוקות'. תרחישים חשובים — אך לא הם החסר שתואר כאן."},
{l:1,t:"יעדים, תכנון ו-MBO",s:"זום",q:"מנהל מכירות מציב לעובדת חדשה יעד כפול מזה של הוותיקים ביותר, 'כדי לדחוף אותה קדימה'. לפי המרצה, מה המשמעות של יעד כזה?",o:["הוא יגביר את המוטיבציה שלה, כי יעד רחוק במיוחד משפר תמיד את הביצועים בפועל","הוא מכשיל אותה מראש: יעד לא בר השגה, ויש להתאים את האדם למשימה","הוא לגיטימי כל עוד היעד מדיד ומוגבל בזמן, גם אם אינו ריאלי לעובדת חדשה","הוא מתאים לדרג הזוטר, שבו ניהול עצמי מחליף את הצורך ביעדים ברי השגה"],c:1,e:"המרצה [66:19-67:51]: 'אי אפשר להציב יעדים שאינם ברי השגה — אם היעד גבוה מדי, אתה מראש מכשיל את העובד שלך: לך תוריד לי מהירח. צריך להתאים את הבן אדם למשימה'. בשיעור 3 זה חוזר במודל SMART: Attainable and realistic."},
{l:1,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"לפי המרצה, מהו 'הדבר החשוב ביותר בצבא' בתחום התכנון — שרלוונטי באותה מידה לכל חברה אזרחית?",o:["ניהול לפי יעדים (MBO) — הצבת יעדים משותפים לכל דרג ומעקב אחריהם","ניתוח SWOT — מיפוי החוזקות והחולשות מול ההזדמנויות והאיומים","תרחישים — היערכות למה שעלול לקרות: לקוחות, טכנולוגיה, ביקוש","תכנון אופרטיבי — פירוק היעדים למשימות קצרות של שלושים יום לכל צוות"],c:2,e:"המרצה [65:26-66:02]: 'נלמד את הדבר החשוב ביותר בצבא — תרחישים... זה לא רק בצבא, זה בכל חברה אזרחית: מה יעשו הלקוחות? איזו טכנולוגיה תצא? למה פתאום יהיה יותר ביקוש? יבוא הקוביד וישנה את התנאים'. תכנון תרחישים (Scenario planning) נלמד לעומק בשיעור 4."},
{l:1,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"מנהל אגף מתעקש שכל החלטה, גם שולית, תעבור דרכו לאישור. לפי מה שהמרצה אמרה כבר בשיעור הראשון, מה יוצרים מנהלים ריכוזיים כאלה?",o:["סינרגיה ותיאום בין המחלקות, כי כל המידע מתנקז לאדם אחד","אנטגוניזם אצל העובדים וצוואר בקבוק בקבלת ההחלטות בארגון","ארגון שטוח יותר, עם פחות דרגי ביניים ופחות בירוקרטיה","ביזור בפועל, כי העובדים לומדים לקבל החלטות בלי המנהל"],c:1,e:"המרצה [69:01]: 'נדבר על ריכוזיות מול ביזוריות... מנהלים ריכוזיים — מה הם יוצרים? אנטגוניזם וצוואר בקבוק'. ארגון שטוח, עם תגובתיות מהירה ופחות בירוקרטיה, הוזכר כמגמה נפרדת. הנושא נלמד לעומק בשיעורים 5-6."},
{l:1,t:"מבנים ארגוניים",s:"זום",q:"באגף מסוים מתברר ששני ענפים עושים במקביל את אותה עבודה, ובמקרה אחר משימה 'נפלה בין הכיסאות' כי כל ענף חשב שהשני מטפל בה. לפי המרצה, בפרק של איזו פונקציה ניהולית מטפלים בבעיות כאלה?",o:["תכנון (Planning) — כי הבעיה נובעת מיעדים שלא הוגדרו היטב מראש","בקרה (Controlling) — כי איש לא השווה את הביצוע למתוכנן בזמן","הובלה (Leading) — כי המנהלים לא הניעו את העובדים לשתף פעולה ביניהם","ארגון (Organizing) — מבנה וחלוקת תפקידים שמונעים כפל עבודה ונפילות"],c:3,e:"המרצה [68:07-69:47]: בפרק הארגון 'נדבר על סוגים שונים של מבנים ארגוניים... כדי שלא יהיה כפל תפקידים או כפל ביצוע על ידי שתי מחלקות ובזבוז משאבים, וכדי שלא ייפלו דברים בין הכיסאות' — סנכרון, תיאום, יעילות ואפקטיביות."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"יש הטוענים שבעידן הבינה המלאכותית תפקיד המנהל יהיה פשוט יותר. מה הייתה עמדת המרצה?",o:["ה-AI יחליף בעיקר את פונקציית הבקרה, ולכן המנהל יתמקד רק בתכנון ובארגון","ה-AI יקבל החלטות תפעוליות במקום מנהלי הקו הראשון, ולכן תפקידם יצטמצם","ה-AI תומך בהחלטה אך אינו מקבל אותה; ההנעה והתגמול — של המנהל","ה-AI יאפשר למנהל להניע ולתגמל את העובדים באופן אוטומטי לפי נתוני הביצוע שלהם"],c:2,e:"המרצה [73:43-74:40]: 'ה-AI ידע לעשות לך ניהול מלאי ובקרה, אבל להניע, לדעת לתגמל, והרבה פעמים גם לתעדף — ה-AI לא יהיה תחליף'; 'זה תמיכה בקבלת החלטה ולא קבלת ההחלטה — ה-AI מאחורינו, לא לפנינו'."},
{l:1,t:"מבוא: מהו ניהול",s:"מצגת",q:"לפי השקף 'Management and Organization', כל הבאים נכונים לגבי ארגון (Organization), למעט:",o:["ארגון הוא קבוצה מתואמת של אנשים הפועלים יחד להשגת מטרות מוגדרות","מטרות הארגון אינן ניתנות בדרך כלל להשגה על ידי יחידים הפועלים לבד","לארגון יש מבנה, ותפקיד ההנהלה הוא להכווין אותו להשגת המטרות","ארגון יעיל פועל ללא מבנה קבוע, כדי שכל עובד יתאים את עצמו למטרות"],c:3,e:"שקף 11: ארגון הוא 'a coordinated group of people who function to achieve specific goals'; המטרות בדרך כלל אינן ניתנות להשגה על ידי יחידים לבד; 'An organization has a structure'; ותפקיד הניהול להכווין אותו למטרות. המרצה: 'הארגון הוא הסינרגיה' — ולכן צריך מבנה ארגוני."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"בדיון על כשירות עבודת הצוות (Teamwork) שאלה המרצה 'אתם יודעים למה team נקרא team?'. מה הייתה התשובה, ואיזה רעיון היא ביטאה?",o:["Together Everyone Achieves More — סינרגיה של 'אחד ועוד אחד שווה שלוש'","Trust, Empathy, Accountability, Motivation — ארבעת תנאי היסוד לצוות מתפקד","Time, Effort, Assignment, Monitoring — ארבעת השלבים של ניהול משימה בצוות","Talent, Engagement, Alignment, Mission — מה שמנהל צריך לחפש בכל עובד"],c:0,e:"המרצה [80:17-80:43]: 'Together Everyone Achieves More — איך מנצלים את היכולות של כל אחד ומגיעים לסינרגיה של אחד ועוד אחד שווה שלוש'. שאר ראשי התיבות אינם מהקורס."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי ההבחנה שבשקף 'Functional Managers and General Managers', מה מבדיל בין שני סוגי המנהלים?",o:["הפונקציונלי מנהל עובדים שאינם מנהלים; הכללי מנהל רק מנהלים אחרים בדרג הביניים והבכיר","הפונקציונלי נמצא תמיד בדרג הזוטר; הכללי הוא תמיד המנכ״ל או חבר ההנהלה הבכירה","הפונקציונלי עוסק בתכנון ובבקרה; הכללי עוסק בעיקר בהובלה ובהנעה של העובדים","הפונקציונלי אחראי על פעילות ארגונית אחת; הכללי — על יחידה מורכבת (חברה, חטיבה)"],c:3,e:"שקף 12: מנהל פונקציונלי — 'responsible for just one organizational activity (marketing, sales, finance, HR, production)'; מנהל כללי — 'responsible for the operations of complex units (a company, a division)'. המרצה הדגישה שמנהל כללי אינו רק המנכ״ל — גם מנהל אגף או מחלקה שתחתיו אנשי מקצוע."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, מי מהבאים עשוי להיחשב 'מנהל כללי' (General manager)?",o:["רק המנכ״ל, שכן רק הוא אחראי על כלל פעילויות הארגון","מנהל אגף או מחלקה שתחתיו אנשי מקצוע מתחומים שונים","כל מנהל ותיק, ללא קשר למספר התחומים שבאחריותו","מנהל השיווק, כי השיווק נוגע בכל מחלקות הארגון"],c:1,e:"המרצה [76:22-77:52]: 'General manager זה לא רק המנכ״ל — גם מנהל מחלקה, מנהל אגף, מנהל תחום או מנהל סדנה, שבסוף מתחתיו יש אנשי מקצוע'. ותק לבדו אינו הופך מנהל לכללי, ומנהל שיווק הוא מנהל פונקציונלי (שקף 12)."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"סמנכ״לית תפעול חדשה מרגישה שעליה להכיר לעומק כל תחום שתחתיה — רכש, שיווק ופיתוח — כדי לנהל כראוי. לפי המרצה, מה נכון?",o:["היא צודקת: מנהלת כללית צריכה להיות מומחית התוכן הבכירה בכל תחום שתחתיה","עליה להתמקד בתחום שממנו הגיעה, ואת שאר התחומים להשאיר לדרג הביניים","אין סיכוי שתדע יותר מכל המנהלים הפונקציונליים; תפקידה לתכלל, לסנכרן ולתעדף","עליה להחליף בהדרגה את המנהלים הפונקציונליים במנהלים כלליים בעלי ראייה רחבה"],c:2,e:"המרצה [77:00]: 'אתה יכול להיות מעולה כמנהל כללי גם אם אתה יודע פחות מהמנהלים הטכניים — אין שום סיכוי שאתה יודע יותר טוב מכל המנהלים הפונקציונליים'. המנהל הבכיר 'רואה הכל ממעוף הציפור, יודע לתכלל, לסנכרן, לתעדף', ומנהל אותם כשהוא סומך עליהם."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי השקף 'Functional Managers Vs. General Managers', אילו כשירויות (Competencies) נדרשות מהמנהל הכללי בנוסף לאלה של המנהל הפונקציונלי?",o:["תקשורת ועבודת צוות (Communication, Teamwork)","ניהול עצמי ותכנון ואדמיניסטרציה (Self-management, Planning)","כשירות אסטרטגית ואף רב-תרבותית (Strategic, Multicultural)","מומחיות טכנית ומקצועית בתחום ההתמחות (Technical expertise)"],c:2,e:"שקף 13: המנהל הכללי צריך 'strategic (and even multicultural) competencies' — כשירות אסטרטגית ואף רב-תרבותית. שתי האפשרויות האחרות מתארות את כשירויות הבסיס של המנהל הפונקציונלי, ומומחיות טכנית היא תחום האחריות שלו."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי שקף 13, מה מאפיין את תחומי האחריות (Areas of responsibility) של מנהל כללי?",o:["מפקח על עבודת המנהלים הפונקציונליים ואחראי על כלל פעילויות היחידה","מתמקד בתחומי מומחיות טכניים ומשמש 'בר סמכא' בתחום אחד בארגון","אחראי על ביצוע העבודה עצמה ועל הייצור הישיר של המוצרים והשירותים","אחראי רק על קשרי החוץ של הארגון, ואינו מעורב בפעילות השוטפת שלו"],c:0,e:"שקף 13: 'General managers oversee work of functional managers and are responsible for all the activities of the unit', ואילו 'Functional managers focus on technical areas of expertise'. ייצור ישיר של מוצרים ושירותים הוא עבודת הלא-מנהלים ומנהלי הקו הראשון."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"בסיכום הדיון 'מיהו מנהל טוב' ציינה המרצה כשירות אחת שאף סטודנט לא הזכיר במפורש, אף שכולם 'דיברו מסביב לה'. מהי?",o:["תקשורת (Communication)","ניהול עצמי (Self-management)","עבודת צוות (Teamwork)","כשירות רב-תרבותית (Multicultural)"],c:0,e:"המרצה [80:01]: 'כדי לנהל טוב — אף אחד מכם לא הזכיר את המילה הזו, אמרתם מסביב — Communication, לדעת לתקשר בצורה טובה'. אחריה מנתה את התכנון והארגון, עבודת הצוות והניהול העצמי."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"המרצה הדגימה כשירות מסוימת כך: 'אף אחד לא אומר לכם תלמדו עכשיו למבחן', וקישרה אותה ל'שגר ושכח'. על איזו כשירות מדובר, ובאיזה דרג היא חשובה במיוחד לדבריה?",o:["ניהול עצמי (Self-management) — חשוב במיוחד בדרג הזוטר","תכנון ואדמיניסטרציה (Planning) — חשוב במיוחד בדרג הבכיר","כשירות אסטרטגית (Strategic) — חשובה במיוחד למנהל הכללי","עבודת צוות (Teamwork) — חשובה במיוחד למנהלי הביניים"],c:0,e:"המרצה [80:43-81:26]: 'והכי חשוב — self-management. מכירים שגר ושכח? אף אחד לא אומר לכם תלמדו עכשיו למבחן... ניהול טוב, במיוחד בדרג הזוטר, זה ניהול עצמי — סופר חשוב'."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"מנהלת צוות בחברת תוכנה מנהלת עובדים משוודיה, מגרמניה, מספרד ומארה״ב. לפי המרצה, מדוע כשירות רב-תרבותית (Multicultural) חשובה היום יותר מבעבר?",o:["כי רק מנהלים בכירים נפגשים עם תרבויות אחרות, ולכן זו כשירות של הדרג העליון","כי החברות גלובליות, ועסקאות נופלות על פערי תקשורת והבנה בין תרבויות ומדינות","כי חוקי העבודה מחייבים היום גיוון תרבותי מסוים בכל צוות בחברות בינלאומיות","כי הכשירות הרב-תרבותית באה במקום התקשורת הבין-אישית בצוותים גלובליים"],c:1,e:"המרצה [81:32-82:39]: 'היום החברות גלובליות ובינלאומיות... ראינו עסקאות בין יפנים וישראלים נופלות על פערים בתקשורת או בהבנת התרבות — לא רק תרבות ארגונית אלא בין מדינות'. והיא הדגישה שזה נכון לבכירים 'ואגב גם לזוטרים'."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי פירמידת דרגי הניהול (Levels of Management) שבשקף 14, מהו הסדר מבסיס הפירמידה ועד לקודקודה?",o:["מנהלי קו ראשון, לא-מנהלים, מנהלי ביניים, מנהלים בכירים","לא-מנהלים, מנהלי ביניים, מנהלי קו ראשון, מנהלים בכירים","לא-מנהלים, מנהלי קו ראשון, מנהלי ביניים, מנהלים בכירים","מנהלי קו ראשון, מנהלי ביניים, מנהלים בכירים, דירקטוריון"],c:2,e:"שקף 14: Non-managers בבסיס, מעליהם First-line managers, אחריהם Middle managers ובקודקוד Top managers. המרצה: בספרות מופיעות ארבע רמות, והקורס מתמקד בשלוש רמות הניהול."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"המרצה שאלה 'למה זה נראה כמו פירמידה?' על פירמידת דרגי הניהול. איזו מהתשובות הבאות תואמת את הסבריה?",o:["ככל שעולים — הסמכות יורדת והאחריות עולה, ולכן פחות אנשים מעוניינים בתפקיד","הפירמידה מתארת את זרימת המידע בארגון, שעוברת מלמעלה למטה בלבד","הבסיס רחב כי הלא-מנהלים הם הפחות חשובים, ולכן אין צורך להשקיע בהכשרתם","ככל שעולים — הדרישות עולות, המיון קפדני יותר, והתקנים והתפקידים מצטמצמים"],c:3,e:"המרצה [86:01-87:52]: הבסיס הרחב הם מי שעושים את העבודה — 'הבסיס הוא החשוב ביותר'; וככל שעולים 'הדרישות עולות, המיון נעשה יותר קפדני, התפקידים מאתגרים יותר, והתקנים והתפקידים הולכים ומצטמצמים'. היא הדגישה גם שהמידע זורם בשני הכיוונים."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, מדוע בסיס הפירמידה — הלא-מנהלים (Non-managers) — הוא 'החשוב ביותר', אף שהקורס אינו עוסק בו?",o:["כי הם מרכיבים את רוב כוח האדם, ולכן עלות השכר שלהם היא הגבוהה ביותר בארגון","כי הם עושים את העבודה ופוגשים את הלקוח; עובד שפועל נגד ה-DNA פוגע בכולם","כי מהם צומחים המנהלים הכלליים של העתיד, שנבחרים תמיד מתוך עובדי הקו הראשון","כי הם מקבלים את רוב ההחלטות התפעוליות, ולכן הם מחליפים בפועל את מנהלי הקו הראשון"],c:1,e:"המרצה [86:01-87:01]: 'יכולה להיות לך החברה עם המוצר הטוב ביותר... בסוף, אם העובדת אנטיפתית, לא יודעת לתקשר... יעשה דברים מנוגדים ל-DNA של הארגון'. 'הבסיס הוא החשוב ביותר. לא נעסוק בהם בקורס, אבל שלוש רמות הניהול צריכות להכשיר אותם בצורה הטובה ביותר'."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, מהו אחד האינטרסים החשובים ביותר של מנהל ביניים (Middle manager)?",o:["להעביר את הנחיות ההנהלה לדרג הזוטר כלשונן, בלי לסנן ובלי לפרש אותן","לגונן על עובדיו מפני ההנהלה, גם במחיר עימות מתמשך עם הדרג הבכיר","לדעת לתווך בשני הכיוונים — למטה וגם למעלה — ולא להיות 'בין הפטיש לסדן'","לרכז אצלו את קבלת ההחלטות כדי להוריד עומס מההנהלה הבכירה של הארגון"],c:2,e:"המרצה [95:53-97:04]: 'המילה היא לתווך — לתווך את האינטרסים של ההנהלה לדרג הזוטר, ולדעת גם להעביר דברים שעולים מלמטה להנהלה הבכירה, כי דברים שרואים משם לא רואים מכאן... לא להיות בין הפטיש לסדן'. סטודנטים כינו אותם 'עמוד השדרה'."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"קצין מתבקש לשרטט את פירמידת הניהול ומתלבט אם לשרטט אותה ליחידה שלו או לצה״ל כולו. לפי המרצה, מה נכון?",o:["פירמידה משורטטת רק לארגון כולו, כי רק שם מופיעות כל ארבע הרמות","בארגונים גדולים יש תמיד שלוש רמות ניהול בדיוק, ולכן אין צורך בפירמידה ליחידה","בצבא אין פירמידה אחת אלא מבנה שטוח של יחידות מקבילות בעלות מעמד שווה","אפשר לשרטט אותה פר ארגון וגם פר מחלקה, ובארגון גדול לכל רמה יש תתי-רמות"],c:3,e:"המרצה [87:52-89:13]: 'אני יכולה לתאר אותה פר ארגון ואני יכולה גם לתאר אותה פר מחלקה... בכל יחידה, בכל חטיבה, בכל מחלקה יש את הפירמידה'. ובארגונים גדולים כמו צה״ל, אלתא ורפאל 'לכל רמה יש גם תתי-רמות' (סג״ם, סגן, סרן עד רס״ן)."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"בתרגיל הכיתה נותחה יחידה צבאית: מחסנאי, מפקד המחסן, המפקד הממונה ומפקד היחידה ש'בנה את האסטרטגיה'. לפי הניתוח בכיתה, באיזה דרג נמצא מפקד המחסן?",o:["עובד שאינו מנהל (Non-manager)","מנהל קו ראשון (First-line manager)","מנהל ביניים (Middle manager)","מנהל בכיר בהנהלה העליונה (Top manager)"],c:1,e:"בתרגיל [94:01-95:04]: המחסנאי — 'העובד הכי פשוט' (לא-מנהל); מעליו מפקד המחסן — First-line manager; מעליו המפקד הממונה — מנהל ביניים; ומפקד היחידה, 'מי שבנה את האסטרטגיה' — בכיר. המרצה העירה שהסיווג תלוי אם מסתכלים פר יחידה או פר ארגון."},
{l:1,t:"דרגי ניהול ומיומנויות",s:"זום",q:"בתיאור פירמידת הניהול ציינה המרצה שבמחקר האקדמי ההנהלה הבכירה נקראת לעיתים קרובות TMT. מה פירוש הקיצור?",o:["Top Management Teams — צוותי ההנהלה הבכירה","Total Management Tasks — כלל משימות הניהול בארגון","Tactical Management Tier — הדרג הטקטי שמעל מנהלי הביניים","Team Motivation Techniques — שיטות ההנעה של ההנהלה"],c:0,e:"המרצה [85:01]: 'ההנהלה הבכירה נקראת top managers; בשפה המקצועית, במחקרים שעוסקים בתחום, זה נקרא הרבה פעמים TMT — Top Management Teams': מנכ״ל, CTO, סמנכ״לי שירות, תמיכה, מכירות ורכש."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"ראש מחלקה בבית חולים עומד מול הצוות ואומר 'אני כשלתי בניתוח הזה'. איזה מושג, שהמרצה חקרה בעבודת הדוקטורט שלה, מדגים המקרה?",o:["אינטליגנציה רגשית (Emotional intelligence)","ניהול עצמי (Self-management)","ביטחון פסיכולוגי (Psychological safety)","הרמוניה מלאכותית (Artificial harmony)"],c:2,e:"המרצה [57:01]: 'יש מושג שחקרתי בדוקטורט לפני כמעט עשרים שנה שנקרא ביטחון פסיכולוגי — כשמנהל מחלקה בתל השומר טועה, הוא בא מול הצוות שלו ואומר: אני כשלתי'. הדיון עסק בגיבוי העובדים ובהודאה בטעויות."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"לפי המרצה, איזו מגמה בולטת בספרות הניהול בשנים האחרונות?",o:["From managers to coaches — המנהל כחונך וכיועץ, לא רק כמנחית הנחיות","From leaders to managers — חזרה לניהול שמבוסס על נהלים ועל בקרה צמודה","From teams to individuals — מעבר מעבודת צוות לעבודה עצמאית של מומחים","From coaches to controllers — הגברת הפיקוח על העובדים בעזרת מדדי ביצוע"],c:0,e:"המרצה [46:04]: 'בשנים האחרונות רואים מגמה: from managers to coaches — זה לא רק ה-distance כמו שאתם מכירים בצבא, אלא גם החונך, היועץ, מי שנמצא יד ימינך — ולא רק מי שמנחית את ההנחיות'."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"רשת מלונות שולחת אנשים שמתארחים כאורחים רגילים ומדווחים על איכות השירות. לאיזו פונקציה ניהולית שייכת שיטת 'הלקוח הסמוי', שהמרצה הביאה כדוגמה?",o:["תכנון (Planning) — כי הדיווחים משמשים לקביעת יעדי השירות לשנה הבאה","ארגון (Organizing) — כי המלון מגדיר מחדש את התפקידים לפי הדיווחים","הובלה (Leading) — כי העובדים מונעים לשפר את השירות כשהם יודעים שבודקים","בקרה (Controlling) — מדידת הביצוע בפועל והשוואתו לסטנדרט השירות"],c:3,e:"המרצה [72:00]: 'קונטרולינג זה בקרה — שיטות ודרכי בקרה, שליטה ו-KPI... הלקוח הסמוי — מגיעים בתור אורחים, הם עושים בקרה'. היא הוסיפה שבקרה אינה רק מספרים — יש גם אמצעי בקרה שאינם מדידים."},
{l:1,t:"מבוא: מהו ניהול",s:"זום",q:"'מנהל טוב לא משדר בגובה 20 אלף רגל'. מה ביקשה המרצה ללמד במשפט הזה?",o:["מנהל טוב נשען על דשבורדים ומסכי ענק, כדי לראות את כל התמונה מלמעלה","מנהל טוב מאציל את הקשר עם השטח למנהלי הביניים, ומתמקד באסטרטגיה","מנהל טוב יורד לשטח ושומע את העובדים, והמידע אצלו זורם בשני הכיוונים","מנהל טוב מדבר בגובה העיניים רק עם הדרג שמתחתיו ולא עם עובדי הקצה"],c:2,e:"המרצה [52:50-53:52]: 'בכל חברה יש לך דשבורד ומסכי ענק... לא. רד לשטח — ברצפת הייצור, במפעל, במרלו״ג... ניהול טוב לא זורם רק למטה, גם למעלה — מנהל טוב יודע לקבל את המידע מלמטה ולשנות ולהכווין בהתאם לפידבק, כי דברים שרואים משם לא רואים מכאן'."},
];

/* ===================== שיעור 2 — מבוא לניהול (2) ===================== */
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"מנהל אזור ברשת אופנה אחראי על שמונה מנהלי חנויות, קובע יעדים לאזור בהתאם ליעדי ההנהלה הבכירה ומתאם עם מחלקות אחרות כדי לקבל משאבים. לפי שקף 'Levels of Management', לאיזה דרג ניהול הוא שייך?",o:["מנהל קו ראשון (First-line) — כי הוא בקשר ישיר עם החנויות ועם השטח","מנהל ביניים (Middle manager) — אחראי על מנהלי קו ראשון ומתאם משאבים","מנהל בכיר (Top manager) — כי הוא קובע יעדים לאזור שלם של הרשת","מנהל פונקציונלי (Functional) — כי הוא אחראי על פעילות ארגונית אחת"],c:1,e:"שקף 5: מנהלי הביניים 'In charge of first-line managers', 'Responsible for setting objectives that are in line with the top management's goals' ו-'Need to coordinate with others for resources'. בשקף 7 (זארה) Regional Manager מופיע כמנהל ביניים. המרצה הוסיפה: הם לוקחים את התקציבים מההנהלה ומפרקים אותם למחלקות לפי הצרכים."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"איזה מהצירופים הבאים של דרג ניהול ותחום אחריות נכון לפי שקפים 5-6?",o:["קו ראשון — החלטה אילו מוצרים לייצר ואיך לשווק אותם ללקוחות","ביניים — אחריות ישירה לייצור המוצרים ולמתן השירותים עצמם","בכירים — פיתוח האסטרטגיה ותקשורת עם בעלי העניין המרכזיים","ביניים — פיקוח על הכיוון הכללי של הארגון כולו ועל עתידו"],c:2,e:"שקף 6: Top managers 'oversee the overall direction of an organization', 'Develop the organization's strategy' ו-'Communicate with key stakeholders'. כלומר: פיתוח האסטרטגיה ותקשורת עם בעלי העניין המרכזיים — תפקיד הבכירים. שאר הצירופים שגויים (שקף 5): בחירת המוצרים והשיווק — דרג הביניים; הייצור בפועל — הקו הראשון; והכיוון הכללי — הבכירים, לא הביניים."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"מנהלת צוות אחיות בבית חולים מתכללת עשרות אחיות, ורוב הידע שלה נוגע לביצוע עירוי, להזמנת ציוד ולנהלי טיפול. מה מדגים המקרה לגבי מנהלי קו ראשון, לפי שקף 5 וההסבר בכיתה?",o:["הם מתמקדים בעיקר בחשיבה אסטרטגית ובתכלול בין המחלקות השונות","המיומנות העיקרית שלהם היא ניהול עצמי, כי הם אינם מקבלים הנחיות","הם נשענים בעיקר על קשרים ורשתות כדי להשיג משאבים ותקציבים לצוות","מומחיות טכנית-מקצועית היא בעלת חשיבות גבוהה במיוחד בדרג שלהם"],c:3,e:"שקף 5: אצל First-line managers 'Technical expertise is of high importance', והעובדים שמדווחים להם הם שעושים בפועל את עבודת הארגון. המרצה [26:00-27:00] הביאה את מנהלת צוות האחיות, שרוב הידע שלה טכני ('טכני ומקצועי זה אותו דבר')."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי הדוגמה של רשת זארה (Zara) בשקף 7, איזה מהתפקידים הבאים שייך לדרג מנהלי הביניים (Middle Managers)?",o:["מנהל חנות (Store Manager)","מפקח קומה (Floor supervisor)","מתכנן סחורה (Merchandise Planner)","סמנכ״ל סחורה (Chief Merchandising Officer)"],c:2,e:"שקף 7 (Zara): קו ראשון — Store Manager, Team Leader, Floor supervisor; ביניים — Regional Manager, Supply Chain Coordinator, Merchandise Planner; בכירים — CEO, CFO, CTO, Chief Merchandising Officer."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי הדוגמה של מיקרוסופט (Microsoft) בשקף 8, איזה מהתפקידים הבאים שייך לדרג מנהלי הקו הראשון (First Line Managers)?",o:["מנהל הנדסה בכיר (Senior Engineering Manager)","מנהל הנדסה (Engineering Manager)","מנהל מוצר (Product Manager)","מנהלת אנשים ראשית (Chief People Officer)"],c:1,e:"שקף 8 (Microsoft): קו ראשון — Team Leader, Engineering Manager, Support Supervisor, Project Coordinator; ביניים — Senior Engineering Manager, Product Manager, Sales Director, Operations Manager; בכירים — CEO, CFO, CTO, Chief People Officer. שימו לב: Engineering Manager בקו הראשון, אך Senior Engineering Manager — בביניים."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"ראש צוות תוכניתנים מבצע בדיקות תוכנה, מתחזק את המערכת ומפעיל את כלי הפיתוח טוב מכל עובדיו. לפי רוברט קאץ (Robert Katz), באיזו מיומנות מדובר?",o:["מיומנות טכנית (Technical) — שליטה בשיטות, בטכניקות ובציוד של תחום מסוים","מיומנות קונספטואלית (Conceptual) — ראיית המערכת כולה והקשרים בין חלקיה","מיומנות אנושית (Human) — עבודה עם אנשים ובאמצעותם כחבר בקבוצה","כשירות תכנון ואדמיניסטרציה — הקצאת משאבים ועמידה בלוחות זמנים"],c:0,e:"שקף 9: Technical skills — 'Mastery of methods, techniques, and equipment involved in specific functions such as engineering, manufacturing, or finance'. המרצה [33:10]: 'לדעת להפעיל את המחשוב, את המכונות, את התוכנה, את המערכת — כל אחד בתחום שלו'."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי רוברט קאץ, מהן מיומנויות קונספטואליות (Conceptual skills)?",o:["היכולת לעבוד עם אנשים ובאמצעותם: להניע, לתאם, לתקשר ולפתור קונפליקטים","שליטה בשיטות, בטכניקות ובציוד של תחום מקצועי כמו הנדסה, ייצור או כספים","היכולת לנהל את עצמך, להציב לעצמך יעדים ולעקוב אחר התקדמותך","יכולת קוגניטיבית לראות את הארגון כמערכת שלמה ואת הקשרים בין חלקיה"],c:3,e:"שקף 9: Conceptual skills — 'Cognitive ability to see organization as a whole system and the relationships among its parts: thinking strategically, taking broad long-term view, and identifying, evaluating and solving complex problems'. המרצה [34:04-35:00]: תכלול, תיעדוף פרויקטים, איזה קונפליקט לפתור, איך להקצות תקציבים."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"מנהלת אגף מצטיינת במיוחד בהנעת עובדים, בתיאום בין צוותים, בתקשורת ובפתרון קונפליקטים. לפי הגדרות רוברט קאץ, באיזו מיומנות היא מצטיינת?",o:["מיומנות קונספטואלית — כי פתרון קונפליקטים מחייב ראייה מערכתית של הארגון","מיומנות אנושית (Human skills) — עבודה עם אנשים ובאמצעותם","מיומנות טכנית — כי תיאום בין צוותים הוא חלק ממומחיות התחום","כשירות פעולה אסטרטגית (Strategic action) — ראיית התמונה הרחבה"],c:1,e:"שקף 9: Human skills — 'Manager's ability to work with and through other people and to work effectively as a group member: motivating, facilitating, coordinating, leading, communicating, and resolving conflicts'. פתרון קונפליקטים מופיע במפורש תחת המיומנות האנושית, לא הקונספטואלית."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי מודל קאץ, כפי שהוצג בשקף 10 והוסבר בכיתה, מה קורה למשקלן של שלוש המיומנויות ככל שעולים בדרגי הניהול?",o:["הטכניות פוחתות, הקונספטואליות גדלות, והאנושיות חשובות באותה מידה בכל הדרגים","הטכניות פוחתות, האנושיות גדלות, והקונספטואליות נשארות קבועות בכל הדרגים","כל שלוש המיומנויות גדלות, אך הקונספטואליות גדלות בקצב המהיר ביותר מביניהן","הטכניות והאנושיות פוחתות יחד, והקונספטואלית הופכת למיומנות היחידה בפסגה"],c:0,e:"המרצה [38:00-39:00]: 'ככל שאתה עולה בסולם הדרגות, הכישורים הטכניים פחות באים לידי ביטוי... ככה הכישורים הקונספטואליים עולים', והרצועה האמצעית — המיומנויות האנושיות — 'זהה לכל האורך'."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"בהסבר על מודל קאץ ציינה המרצה את 'הדבר החשוב ביותר שאמר רוברט קאץ — ואף אחד לא שם לב'. מהו?",o:["המנהל הבכיר אינו זקוק כלל למיומנויות טכניות, ולכן אין לקדם אליו מומחי תוכן","המיומנויות הקונספטואליות נרכשות רק בתפקידים בכירים ואי אפשר לפתח אותן מוקדם","המיומנויות האנושיות חשובות באותה מידה בכל הדרגים — שני עובדים או עשרים אלף","המיומנויות הטכניות חשובות יותר מהאנושיות בכל הדרגים, ולכן הן הבסיס לכל קידום"],c:2,e:"המרצה [39:00]: 'שימו לב לדבר חשוב ביותר שאמר רוברט קאץ ואף אחד לא שם לב — הרצועה באמצע, Human skills, זהה לכל האורך... עשרים אלף עובדים ושני עובדים — זה אותו דבר, כולם אנשים'. היא הוסיפה שחשיבותן רק הולכת וגדלה."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"רופאה בכירה שמונתה למנכ״לית בית חולים כבר אינה מנתחת, ורוב זמנה מוקדש לתקציבים ולתיעדוף בין מחלקות — למשל אונקולוגיה מול ילדים. מה מדגים המקרה לפי מודל קאץ?",o:["המיומנויות הטכניות שרכשה אינן רלוונטיות עוד, ואין לה צורך בהבנת התחום הרפואי","ככל שעולים בדרגים, הטכניות תופסות פחות זמן והקונספטואליות — יותר","היא עברה ממיומנויות אנושיות למיומנויות טכניות-ניהוליות של ניהול כספים","היא ויתרה על המיומנויות הקונספטואליות לטובת מיומנויות אנושיות מול הצוות"],c:1,e:"המרצה [38:00]: 'אם אני היום מנכ״לית איכילוב ורופאה בכירה, אני כבר לא עוסקת בניתוחים... היום אני עוסקת בתקציבים ותכלול — האם לתת לאונקולוגית או לילדים תקציב'. סטודנטים הוסיפו שהרקע המקצועי עדיין עוזר לה לזהות נקודות חולשה — אך הוא תופס פחות מזמנה."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"מנהל זוטר ושאפתן מקבל בהערכה ציון גבוה על מיומנויותיו הטכניות אך נמוך על מיומנויות העבודה עם אנשים (שקף 'Exercise'). לפי הדיון בכיתה, מה נכון?",o:["אפשר לשפר מיומנויות אנושיות בקורסים ובפיתוח — אך לא מאפס, והאישיות משפיעה","מיומנויות אנושיות הן תכונה מולדת שאי אפשר לשפר, ולכן עליו לשנות מסלול","מיומנויות אנושיות אינן נדרשות בדרג הזוטר, ולכן אין צורך לטפל בכך כרגע","די בהצטיינות טכנית, כי 90% מהקידומים נעשים ממילא לפי כישורים מקצועיים"],c:0,e:"המרצה [50:03]: 'כל מנהל יכול לשפר את הכישורים... יש היום קורסים, מפתחים, משפרים — אבל זה לא מ-0', ו'יש אנשים שאומרים: כזה אני, אתה לא תשנה אותי'. נכון ש-90% מהקידומים הם לפי המקצועי — אך לפי קאץ המיומנויות האנושיות נדרשות בכל הדרגים, וזה 'הרבה פעמים לא נכון'."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המחקרים שהציגה המרצה, על בסיס מה מבוצעים כ-90% מהקידומים בארגונים — ומה, לפי מחקר של מקינזי, משפיע בסוף על העובדים?",o:["הקידומים — לפי ותק בארגון; ההשפעה על העובדים — של גובה השכר ושל התנאים הנלווים","הקידומים — לפי כישורים חברתיים; ההשפעה על העובדים — של הידע המקצועי","הקידומים — לפי תוצאות עסקיות; ההשפעה על העובדים — של הקשרים והרשתות","הקידומים — לפי כישורים מקצועיים; ההשפעה על העובדים — של הכישורים החברתיים"],c:3,e:"המרצה [46:01]: 'מחקרים מראים ש-90% מהקידומים הם קידומים שמבוצעים על בסיס מקצועי... מקינזי מצאה שמה שמשפיע בסוף על העובדים זה כישורים חברתיים — אבל לפי מה אתה מקדם? לפי כישורים מקצועיים'. זהו המתח שהיא הדגישה."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"רמ״ח צריך לבחור בין שני מועמדים לתפקיד רמ״ד: האחד מבריק ומצטיין מקצועית, והשני פחות מבריק אך יודע להקשיב, לעבוד בצוות ולהודות בטעויות. מה הייתה עמדת המרצה?",o:["תמיד המקצועי, כי בלי ידע טכני עמוק אי אפשר לנהל מומחי תוכן","תמיד איש האנשים, כי מיומנויות רכות חשובות יותר בכל תפקיד ניהולי","אין שחור-לבן: הבחירה תלויה באופי התפקיד — פיתוח טכנולוגי או כוח אדם","המקצועי, ולצידו סגן בעל מיומנויות אנושיות שישלים את מה שחסר לו בתחום"],c:2,e:"המרצה [44:04-46:01]: 'אופי התפקיד שאליו הם מתמודדים הוא קריטי בבחירה' — למחלקת פיתוח והנדסה ראש ענף שמבין בטכנולוגיה, לכוח אדם — בן אדם שמבין באנשים, ולסניף בנק עם לקוחות מבוגרים — מי שהשירותיות אצלו גבוהה. 'אין שום שחור-לבן... אי אפשר להיות גם עשיר, גם חם וגם יפה'."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, ממה נובעת במידה רבה שחיקת עובדים (Burnout) — נושא שלדבריה 'לא מספיק עוסקים בו', גם בצבא?",o:["מחוסר בכישורים ניהוליים-חברתיים: 'אתה לא מנהל מכונות, אתה מנהל אנשים'","מעומס טכנולוגי ומריבוי ערוצי התקשורת שהעובדים נדרשים לעקוב אחריהם","מתגמול כספי נמוך מדי ביחס לשוק, שאינו מאפשר לעובד לשמור על מוטיבציה","מהיעדר מדדי ביצוע (KPI) ברורים, שבלעדיהם העובד אינו יודע מה מצופה ממנו"],c:0,e:"המרצה [49:13]: 'שחיקת עובדים נובעת בין היתר מחוסר בכישורים ניהוליים טובים, חברתיים. אתה יכול להיות המנהל הכי טוב... אבל אתה לא מנהל מכונות, אתה מנהל אנשים — והעובדים האלה יישחקו'. בהמשך קשרה לשחיקה גם את המיקרו-מנג'מנט."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"לפי השקף 'The General Manager's Job', כל הבאים הם מתפקידי המנהל הכללי, למעט:",o:["קביעת כיוון אסטרטגי והצבת יעדים וסטנדרטים של ביצוע","גיוס והקצאה של משאבים, ובחירה ופיתוח של אנשים","שמירה על הבנה של הפעילות השוטפת ובניית סביבת עבודה חיובית","האצלת הפעילות השוטפת לדרג הביניים והתנתקות מוחלטת ממנה"],c:3,e:"שקף 14 מונה: Establishing strategic direction; Setting goals and managing standards of performance; Marshalling and allocating resources; Selecting and developing people; Maintaining an understanding of day-to-day operations; Building a positive working environment. כלומר, המנהל הכללי דווקא נדרש להבין את הפעילות השוטפת."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"השקף 'General Management's Agenda' (קוטר, Kotter) מציג את סדר היום של מנהל כללי. לפי ההסבר בכיתה, מה נכון לגביו?",o:["מנהל כללי עוסק בטווח הקצר בלבד, כי את העתיד הרחוק ממילא אי אפשר לחזות בוודאות","קצר (עד שנה), בינוני (עד 5 שנים) וארוך, עם תוכניות מגירה","הטווח הארוך מוגדר עד שנתיים, והבינוני — עד חצי שנה בלבד קדימה","הוא כולל רק נושאים פונקציונליים, ולא תכנון ופיתוח של הארגון"],c:1,e:"המרצה [55:01-56:00]: לסדר היום יש נושאים פונקציונליים ותכנון ופיתוח, ו'טווח קצר זה עד שנה, טווח בינוני עד חמש שנים', ולטווח הארוך (2030, 2037) — חיזוי. 'בהנהלות בכירות כבר יודעים למשל שב-2032 ייפתח סניף של זארה בשיקגו — יש תוכניות מגירה'."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"מצגת",q:"איזו מהבאות אינה אחת משש הכשירויות הניהוליות המרכזיות (Core Managerial Competencies) שהוצגו בשיעור?",o:["כשירות תקשורת (Communication competency)","כשירות קונספטואלית (Conceptual competency)","כשירות פעולה אסטרטגית (Strategic action competency)","כשירות רב-תרבותית (Multicultural competency)"],c:1,e:"שקף 16 מונה שש כשירויות: Communication, Planning and administration, Teamwork, Strategic action, Multicultural, Self-management. 'קונספטואלית' היא אחת משלוש המיומנויות של קאץ (טכנית, אנושית, קונספטואלית) — מודל אחר מאותו שיעור."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"מנהלת מתלבטת כיצד להודיע לעובדים על הפרטת המחלקה: לשלוח דוח פורמלי לכולם או לקיים פגישה פנים אל פנים. לפי הדיון על כשירות התקשורת, מה העיקרון המנחה?",o:["להעדיף תמיד תקשורת כתובה ופורמלית, כדי שיהיה תיעוד מחייב לכל הנאמר","להעביר את ההודעה דרך מנהלי הביניים בלבד, כדי לשמור על שרשרת הפיקוד","להשתמש בכל הערוצים בו-זמנית, כדי שאיש מהעובדים לא יפספס את ההודעה","להתאים את ערוץ התקשורת למסר, לקהל היעד ולסיטואציה, ולסנכרן בין הערוצים"],c:3,e:"המרצה [59:00-62:00]: כשירות התקשורת היא 'הראשונה והקשה ביותר' בגלל ריבוי הערוצים; צריך 'להתאים את סוג התקשורת למסר, לקהל היעד, לסיטואציה' — למשל אם לשלוח דוח פורמלי או לשבת פנים אל פנים — ולדעת לסנכרן בין הערוצים השונים."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, מה כוללת כשירות התכנון והאדמיניסטרציה (Planning and administration), מעבר לעמידה ביעדים?",o:["ניהול הלוגיסטיקה והרכש בלבד, שכן אלה הם עיקר העבודה האדמיניסטרטיבית בכל ארגון","כתיבת נהלים מפורטים לכל פעולה בארגון, כדי למנוע טעויות וחריגות","מיצוי הפוטנציאל האנושי ומקסימום הישגים במינימום משאבים","האצלת התכנון כולו לדרג הזוטר, שמכיר את השטח טוב יותר מההנהלה"],c:2,e:"המרצה [62:00-63:04]: 'יכולת תכנון זה לא רק עמידה ביעדים, זה גם מיצוי הפוטנציאל האנושי, זה גם איך אני במינימום משאבים מגיעה למקסימום הישגים... משאב זה לא רק מכשיר, לא רק טכנולוגיה, לא רק כסף — זה המשאב האנושי'. סטודנט הוסיף: גם הזמן הוא משאב."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"המרצה בחרה במשחק השחמט כדי להמחיש אחת משש הכשירויות. באיזו כשירות מדובר, ומה ההסבר?",o:["עבודת צוות — לכל כלי יש תפקיד, והניצחון תלוי בשיתוף הפעולה ביניהם על הלוח","פעולה אסטרטגית — לראות צעדים קדימה ולחזות תרחישים","ניהול עצמי — כל שחקן מנהל לבדו את הזמן שלו מול שעון המשחק","תכנון ואדמיניסטרציה — הקצאה נכונה של הכלים כבר בתחילת המשחק"],c:1,e:"המרצה [65:01-66:12]: 'למה שח? שבעה ושמונה צעדים קדימה... ראייה אסטרטגית היא ראייה שלוקחת אותך חמישה צעדים קדימה וחוזה' — אלה התרחישים, 'ולהכין תוכניות מגירה לכל אחד מהתרחישים'. שעון השחמט עלה בדיון רק כהערת אגב."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"מנכ״ל בחברת הייטק מאפשר לאם חרדית לשבעה ילדים לעבוד בשעות שנוחות לה, ולמנהלים אחרים לעבוד מהבוקר עד הלילה — כל עוד מגיעים לתוצר. לפי המרצה, מה מדגימה הגישה, ומה ההפך ממנה?",o:["ריכוזיות, שמאפשרת למנכ״ל לשלוט בשעות העבודה; ההפך — ביזוריות","ניהול עצמי ומתן מרחב לעובדים; ההפך — מיקרו-מנג'מנט, שגורם לשחיקה","גיוון תעסוקתי (Diversity); ההפך — אחידות בשעות העבודה של כולם","בקרת התנהגות צמודה; ההפך — ויתור מלא על מדידת התפוקות של העובדים"],c:1,e:"המרצה [70:04-72:02]: 'מנהל טוב לא עושה מיקרו-מנג'מנט — הוא נמצא, הוא בקיא, אבל הוא נותן לך את הדרך, את הכלים, את השיטות: תן לי להחליט מתי, כמה, איך'. והיכולת לנהל את עצמך ולתת מרווח למנהלים שתחתיך — 'זה ממזער שחיקה'. דוגמת אחיה, מנכ״ל בהייטק, באה להמחיש את הניהול העצמי."},
{l:2,t:"דרגי ניהול ומיומנויות",s:"זום",q:"לפי המרצה, מה נדרש במסגרת הכשירות הרב-תרבותית (Multicultural competency)?",o:["שליטה טובה בשפה האנגלית, שהיא שפת העסקים הגלובלית המשותפת","העברת ה-DNA הארגוני כמות שהוא לכל מדינה, בלי התאמות מקומיות","העדפת עובדים מתרבויות דומות, כדי למנוע קונפליקטים בתוך הצוות","היכרות עם התרבות, השפה, המנהגים, הערכים והאמונות של השותפים"],c:3,e:"המרצה [67:00]: 'עסקאות נופלות כי הישראלי בא ואומר לסיני: אנחנו קצת מתעכבים... 90% מהחברות הן גלובליות, ואתה צריך להכיר תרבות, שפה, מנהגים, ערכים, אמונות'. בצבא, לדבריה, זה פחות אקוטי."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"מצגת",q:"איזה מהבאים אינו אחד מששת אתגרי הניהול בכלכלה החדשה (The New Economy: Managerial Challenges) שהוצגו בשיעור?",o:["כישרונות (Talent)","גיוון (Diversity)","קיימות (Sustainability)","קריירות ורשתות (Careers and networks)"],c:2,e:"שקף 24 מונה שישה אתגרים: Talent, Technology, Globalization, Ethics, Diversity, Careers and networks. קיימות אינה אחד מהם."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"בשיעור הוצגה טבלה של Payscale שהשוותה חברות עם הוותק הקצר ביותר לחברות עם הוותק הארוך ביותר. לפי ההסבר, מה מאפיין את החברות שבהן הוותק הקצר ביותר?",o:["חברות מסורתיות עם שכר נמוך, שבהן העובדים מבוגרים ומחפשים יציבות","חברות ממשלתיות שבהן הקידום איטי והשכר נקבע לפי דרגה וותק","חברות הייטק: שכר ותנאים גבוהים, גיל צעיר ועזיבה מהירה","סטארט-אפים בשלב מוקדם שבהם אין לעובדים תנאים סוציאליים כלל"],c:2,e:"המרצה [78:00-79:01]: בצד אחד חברות הייטק — 'השכר מאוד גבוה, התנאים מאוד טובים, הגיל הממוצע מאוד נמוך' והוותק קצר ('אחרי שנה עובר לארגון הבא'); בצד השני חברות מסורתיות — שכר פחות גבוה, גיל ממוצע 43-50, ועובדים שנשארים 10-14 שנה."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"לפי מחקר שהציגה המרצה במסגרת אתגר הכישרונות, כמה מבני דור המילניום (כבני 30), שנהנים מתנאים ומבונוסים טובים, מחפשים את העבודה הבאה בזמן שהם עובדים?",o:["כ-30%","כ-50%","כ-70%","כ-90%"],c:2,e:"המרצה [80:02]: '70% מהמילניאלז, אנשים בגילאי 30 שיש להם תנאים, בונוסים, רכב — כל מה שתרצו — בזמן שהם בעבודה מחפשים את העבודה הבאה'. מכאן האתגר: עד שמכשירים עובד, הוא עוזב — עם הידע, הכסף שהושקע והסודות."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"מנהל רוצה לשמר מפתחת מוכשרת שכבר מקבלת שכר ותנאים טובים. לפי הדיון בכיתה על אתגר הכישרונות (Talent), איזו דרך צפויה להיות האפקטיבית ביותר?",o:["תוספת שכר ובונוס שנתי קבוע שיעלו על ההצעות של המתחרים","צמצום תחומי האחריות שלה, כדי להפחית את הלחץ והשחיקה","מתן אחריות יחד עם סמכות, משמעות ו'בייבי' משלה עם תקציב","הצמדתה למנהל שיבדוק כל פעולה שלה ויעניק לה משוב יומי"],c:2,e:"בדיון [82:00-87:00]: 'אל תנסו לגעת בנושא הכספי — הטנג'יבל לא מדבר אליהם'. מה שעובד: זהות, שייכות וערך — מנכ״ל שנותן לכל אחד 'את הבייבי שלו' ותקציב; שיתוף בקבלת החלטות; 'תן לו את האחריות עם הסמכות — אתה תרוויח אותו יותר'; וגם רוטציה בתפקידים (Job rotation) כגירוי אינטלקטואלי."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"לפי המרצה, מהו אתגר מרכזי שהטכנולוגיה מציבה למנהל — מעבר לכך שהיא משפרת ומייעלת?",o:["לרכוש את המערכות המתקדמות ביותר לפני המתחרים, כדי לא לאבד יתרון","לבנות תרבות ואמון כשרבים עובדים מהבית, ולהכריע בשאלות אתיות כמו ניטור","להחליף את רוב הפגישות הפרונטליות בדוחות אוטומטיים ובדשבורדים בזמן אמת","להגביל את השימוש בבינה מלאכותית, כדי לשמור על המשרות הקיימות"],c:1,e:"המרצה [90:00-91:01]: 'איך אתה בונה תרבות ארגונית' כשחלק גדול מהעובדים עובדים מהבית, ועולות שאלות אתיות — מערכות שבודקות אם מקלידים, אמון מלא בעובד שאתה לא רואה, ותיקון רק לפי ביצועים. סטודנט הוסיף את פער הדורות בין מנהלים מבוגרים לעובדים צעירים."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"בדיון על אתגר הגלובליזציה ביקשה המרצה 'לרשום' מושג שיחזור בקורס. מהו המושג ומה פירושו?",o:["גלוקליזציה (Glocalization) — לשמור על ה-DNA הגלובלי ולהתאים לכל מדינה","גלובליזציה מלאה — אחידות מוחלטת של המוצר ושל השירות בכל המדינות","לוקליזציה מלאה — ויתור על ה-DNA הארגוני לטובת התרבות המקומית","מיקור חוץ (Outsourcing) — העברת הייצור והשירות למדינות שבהן העלויות נמוכות"],c:0,e:"המרצה [93:02-95:01]: 'יש מושג שכולכם תרשמו — גלוקליזציה... איך אני מצד אחד שומרת על ה-DNA, אבל עדיין אני חברה גלובלית'; 'מצד אחד כולנו נדרשים לאותה רמה ולאותם סטנדרטים, מצד שני לכל מדינה ולכל תרבות צריך אדפטציה'. זה מתחבר לשאלת הדיון 'Think Global Act Local' (שקף 29)."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"מצגת",q:"בתרגיל האתי שבשקף 32, מנהל מכירות בחברת תרופות נדרש לקדם באגרסיביות תרופה שעולה 2,500$ למנה, אף שהיא יעילה רק באחוז אחד יותר מחלופה שעולה פחות מ-625$. מה הטיעון של סגן הנשיא למכירות?",o:["שהתרופה הזולה עדיין לא אושרה לשימוש, ולכן אין לה מעמד חוקי","שאם לא יקדם אותה, עלולים לאבד חיים שהיו ניצלים בזכות האחוז הנוסף","שהחברה תאבד את נתח השוק שלה אם תשאיר את השוק לתרופות גנריות","שהרופאים עצמם כבר דורשים את התרופה החדשה ומבקשים לקבל אותה"],c:1,e:"שקף 32: 'He reminds you that if you don't, lives could be lost that might have been saved with that 1 percent increase in the drug's effectiveness'. בכיתה [98:01-104:01] נדונה הדילמה, והמרצה אמרה שלא הייתה יכולה לישון בלילה אם לא הייתה חושפת בפני הלקוח שמדובר רק באחוז אחד."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"לפי המרצה, מה קורה לבעיות האתיות בארגונים בעידן הבינה המלאכותית (AI)?",o:["הן הולכות ומתעצמות ונעשות מאתגרות יותר — נושא מהותי למנהלי העתיד","הן פוחתות, כי מערכות AI מקבלות החלטות לפי כללים קבועים ושקופים","הן עוברות מהמנהל אל ממונה האתיקה, שאחראי עליהן לבדו בארגון","הן נותרות זהות לבעבר, ורק ערוצי הדיווח עליהן השתנו בשנים האחרונות בארגונים"],c:0,e:"המרצה [97:00]: 'בעידן AI הבעיות האתיות הולכות ומתעצמות, נעשות עוד יותר קשות, עוד יותר מאתגרות... הנושא האתי הוא נושא מהותי בתוך דור ההנהלה העתידי'. בסיכום השיעור הוסיפה שהטכנולוגיה מגבירה את האתגרים האתיים."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"לפי המרצה, מה יפגשו קצינים ונגדים בנושא האתיקה כשיצאו לארגונים אזרחיים — דבר שפחות מוכר להם בצבא?",o:["ועדת אתיקה חיצונית שבודקת כל החלטה ניהולית לפני ביצועה","קוד אתי שעליו חותמים ומתקפים אחת לשנה, וממונה אתיקה בארגון","חובה לדווח לרשות לניירות ערך על כל דילמה אתית שעולה בארגון","איסור על מנהלים לקבל החלטות אתיות בלי אישור היועץ המשפטי"],c:1,e:"המרצה [96:03]: 'כשתגיעו לאזרחות תראו שמחתימים אתכם על קוד אתי, ויש בן אדם שהוא ממונה אתיקה... אחת לשנה אתה חייב לחתום על הקוד האתי הזה'. בצבא, לדבריה, יש 'רוח צה״ל'."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"לפי המרצה, מהו האתגר הניהולי שבגיוון (Diversity)?",o:["גיוון נדרש רק בחברות גלובליות, ואינו רלוונטי לארגונים מקומיים","גיוון מתייחס למגדר בלבד, ולכן די במכסות שוות לגברים ולנשים","גיוון מפחית קונפליקטים בצוות, ולכן אין בו אתגר ניהולי של ממש","מנהלים נמדדים בגיוון, אך הוא עלול לגלוש לאפליה ולצוותים לא מנצחים"],c:3,e:"המרצה [105:03-106:01]: 'היום מנהלים נמדדים בדייברסיטי — זה קריטריון', והוא נוגע גם בתרבות וגם במגדר; 'השאלה היא עד לאיפה זה מגיע' — האם זה מוביל לאפליה מתקנת, ו'הרבה פעמים אתה יוצר צוותים שהם לא בהכרח מנצחים, כי אתה עונה על האתגר'."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"'מי צריך כישורים כשיש קשרים?' — בהקשר של איזה אתגר ניהולי ציטטה המרצה את המשפט?",o:["קריירות ורשתות — מנהל מרושת מצליח יותר, אך אנשים טובים עלולים להיתקע","גיוון — צוות מגוון מביא איתו רשתות קשרים רחבות יותר מצוות אחיד ומסורתי","כישרונות — עובדים מוכשרים עוזבים לחברות שבהן יש להם קשרים","אתיקה — מינוי מקורבים הוא הפרה של הקוד האתי ברוב הארגונים"],c:0,e:"המרצה [107:11-108:01]: האתגר השישי, Careers and networks — 'ככל שאני יותר מרושתת, כך אני מנהלת יותר טובה', אבל האתגר הוא 'איך אתה יוצר מצב שבו הרבה פעמים אנשים טובים לא מגיעים לאן שהם צריכים, בגלל שלאחרים היו קשרים'."},
{l:2,t:"אתגרי הכלכלה החדשה",s:"זום",q:"בסיום הדיון על ששת האתגרים הדגישה המרצה עיקרון שנוגע לכולם. מהו?",o:["האתגרים נפרדים זה מזה, ולכן כל אחד מהם באחריות של מחלקה אחרת בארגון","האתגרים היו חזקים יותר לפני 20 שנה, והיום הטכנולוגיה מחלישה אותם","כל אתגר מחזק אחרים — למשל הטכנולוגיה מגבירה את האתגרים האתיים","רק אתגר הכישרונות רלוונטי לצבא, ושאר האתגרים נוגעים לחברות אזרחיות"],c:2,e:"המרצה [109:00-110:03]: 'כל אחד מהאתגרים האלה מחזק גם אתגרים אחרים — הטכנולוגיה מגבירה את האתגרים האתיים, הדייברסיטי מעלה את הגלובליזיישן, והטלנטים עוזבים בין היתר בגלל קריירות ורשתות'. לפני 20 שנה אלה לא היו אתגרים; היום 'הם הולכים ומתעצמים'."},
]);

{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 'Goals and Plans', מה ההבדל בין יעד (Goal) לתוכנית (Plan)?",o:["יעד הוא מצב עתידי רצוי שהארגון שואף אליו; תוכנית היא 'שרטוט' של משאבים, לוחות זמנים ופעולות להשגתו","תוכנית היא מצב עתידי רצוי שהארגון שואף אליו; יעד הוא הפירוט של המשאבים והפעולות הנדרשים להשגתה","יעד הוא ההחלטה של ההנהלה הבכירה על האסטרטגיה; תוכנית היא הבקרה השוטפת על ביצועה בדרגים הנמוכים","יעד נקבע בדרג הזוטר ומתאר את המשימות היומיות; תוכנית נקבעת בדרג הבכיר ומתארת את החזון ארוך הטווח"],c:0,e:"שקף 4: Goal — 'A desired future state that an enterprise attempts to realize'; Plan — 'A blueprint defining resource allocations, schedules, and other actions required for attaining goals'. המרצה [28:41-29:33]: 'היעד הוא מה אנחנו רוצים להשיג והתוכנית היא איך נגיע לשם — זה המה וזה האיך'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 'Purposes of Planning', כל הבאים הם מטרות התכנון, למעט:",o:["מתן כיוון (Providing directions)","הפחתת אי-ודאות (Reducing uncertainties)","ייתור הבקרה (Eliminating the need for control)","מזעור יתירות (Minimizing redundancy)"],c:2,e:"שקף 5 מונה ארבע מטרות: Providing directions, Reducing uncertainties, Minimizing redundancy, Setting standards for controlling. התכנון אינו מייתר את הבקרה — להפך, הוא קובע לה סטנדרט. המרצה: 'התכנון מתחיל, הבקרה מסיימת'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"המרצה, שייעצה לקופות חולים, סיפרה שכל שנה חלק ניכר מחיסוני השפעת שנרכשים לקראת החורף נשאר בלי שימוש, והזכירה ש'מלאי שווה מוות'. איזו מטרה של התכנון היא ביקשה להמחיש?",o:["הפחתת אי-ודאות (Reducing uncertainties) — כדי להוריד את הלחץ במערכת בחורף","מזעור יתירות (Minimizing redundancy) — מניעת עודפים ובזבוז משאבים","מתן כיוון (Providing directions) — מיקוד המאמץ במקום הנכון במערכת הבריאות","קביעת סטנדרט לבקרה (Setting standards) — כדי שאפשר יהיה לבקר את הרכש"],c:1,e:"המרצה [34:01-35:00]: 'Minimizing Redundancy... אחד הדברים המרכזיים שלמדתי זה עד כמה צריך להפחית את רמת היתירות... מלאי שווה מוות. אם לא תמנע את היתירות, התכנון שלך לא יהיה טוב'. היא הוסיפה שתמיד צריך רזרבה, אך פערי תקציב וכוח אדם נובעים הרבה פעמים מתכנון לקוי בעבר."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"רשת מחליטה שב-2027 תפתח עשרה סניפים חדשים — שניים בירושלים, שלושה בצפון וארבעה בדרום — ולכן היא יודעת היכן לגייס ולהכשיר מנהלים. איזו מטרה של התכנון באה כאן לידי ביטוי, לפי הדוגמה שנתנה המרצה?",o:["מזעור יתירות — כי הרשת לא תגייס יותר מנהלים ממה שנדרש לכל הסניפים","הפחתת אי-ודאות — כי העובדים יודעים מראש לאילו סניפים יועברו לעבוד","קביעת סטנדרט לבקרה — כי אפשר יהיה לבדוק בסוף השנה כמה סניפים נפתחו","מתן כיוון (Providing directions) — מיקוד המאמץ במקום הרלוונטי"],c:3,e:"המרצה [32:57-33:23]: 'אם אני יודעת שב-2027 אני פותחת עוד עשרה סניפים — זה נותן לי כיוון פעולה: איפה לגייס מנהלים, איפה להכשיר אותם. התכנון עוזר לי לרכז את המאמץ לכיוון הרלוונטי'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"לפי המרצה, מה קורה בארגונים שבהם יש תכנון והעובדים יודעים מה יקרה ומתי?",o:["רמת הסטרס והשחיקה יורדת, והמוטיבציה והשייכות של העובדים עולות","העובדים מאבדים גמישות ויוזמה, כי כל פעולה נקבעת עבורם מראש","הבקרה נעשית מיותרת, כי כולם יודעים מראש מה מצופה מהם","התחלופה עולה, כי העובדים משתעממים משגרה צפויה מדי"],c:0,e:"המרצה [33:24-34:14], על Reducing uncertainties: 'בארגונים שבהם יש תכנון ואנשים יודעים מה ומתי — א' רמת הסטרס יורדת, ב' השחיקה יורדת, ג' המוטיבציה עולה, ד' השייכות עולה... העובדים embedded, הם איתנו במשימה'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 'Purpose of Goals and Plans', מה פירוש הלגיטימיות (Legitimacy) כמטרה של יעדים ותוכניות?",o:["עמידה בדרישות החוק והרגולציה שחלות על הארגון ועל פעילותו השוטפת","סיבת הקיום של הארגון (Raison d'être) — למה הוא קיים ומה ייחודו","הצדקת ההחלטות שהמנהל מקבל מול העובדים ומול ההנהלה הבכירה","קבלת אישור פורמלי של ההנהלה הבכירה לכל תוכנית עבודה בארגון"],c:1,e:"שקף 6: 'Legitimacy — The organization's Raison d'être'. המרצה [38:01-38:18]: 'למה אנחנו קיימים? מה המטרה שלנו? מה אנחנו עושים שחברות אחרות לא עושות?'. הצדקת החלטות היא מטרה אחרת — Rationale for decisions (שקף 7)."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"מנהלת מחלקה בודקת אם המדיניות הפנימית, התפקידים, המבנה, המוצרים וההוצאות של המחלקה מתיישבים עם התוצאות הרצויות שנקבעו. לפי שקף 7, איזו מטרה של יעדים ותוכניות היא מממשת?",o:["סטנדרט ביצוע (Standard of performance) — קריטריון להערכת הביצועים","מדריך לפעולה (Guides to action) — תחושת כיוון ומיקוד","רציונל להחלטות (Rationale for decisions) — בסיס לבחינת ההחלטות","הקצאת משאבים (Resource allocation) — חלוקת עובדים, כסף וציוד"],c:2,e:"שקף 7: Rationale for decisions — 'Make decisions to verify that internal policies, roles, performance, structure, products, and expenditures are aligned with the desired outcomes'. Standard of performance, לעומת זאת, מספק קריטריון להערכת הביצועים עצמם."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 6, כיצד משמשים יעדים ותוכניות מקור למוטיבציה ולמחויבות (Source of motivation and commitment)?",o:["הם מניעים את העובדים באמצעות קשירת היעדים לתגמול כספי אישי","הם מניעים את העובדים באמצעות תחרות בין המחלקות על השגת היעדים","הם מניעים את העובדים באמצעות פרסום היעדים ברבים והתחייבות פומבית","הם מניעים את העובדים באמצעות הפחתת אי-הוודאות"],c:3,e:"שקף 6: 'Source of motivation and commitment — Motivate by reducing uncertainty'. המרצה [38:18-38:29] הוסיפה מסקרים: עובדים שהיו שותפים לתהליכים וידעו מה התכנון היו מחויבים ומגויסים יותר. תגמול, תחרות ופרסום מופיעים בהקשרים אחרים בקורס."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"בארגון גדול: ההנהלה הבכירה קובעת חזון ויעדי-על, הרמ״חים גוזרים מהם תוכניות ומקצים משאבים, והכמ״דים מתכננים מה ייעשה מחר בבוקר. מהו סוג התכנון של כל דרג, לפי השיעור?",o:["בכירה — טקטי; ביניים — אסטרטגי; זוטר — אופרטיבי","בכירה — אסטרטגי; ביניים — אופרטיבי; זוטר — טקטי","בכירה — אסטרטגי; ביניים — טקטי; זוטר — אופרטיבי","בכירה — אסטרטגי; ביניים — טקטי; זוטר — ביצוע ללא תכנון"],c:2,e:"המרצה [46:26-46:39]: 'דרג הנהלה בכיר — תכנון אסטרטגי; דרג ביניים — תכנון טקטי; דרג זוטר — תכנון אופרטיבי'. גם הדרג הזוטר מתכנן — ברמת 'מה נעשה מחר בבוקר', בפרקי זמן קצרים."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 'Planning Time Lines' ולסיכום של המרצה, מהו אופק הזמן של תכנון טקטי (Tactical)?",o:["שנתיים עד חמש שנים","חצי שנה עד שנתיים","30 יום עד חצי שנה","שנה עד שלוש שנים"],c:1,e:"המרצה [61:01], על פי שקף 14: 'תכנון אסטרטגי שנתיים עד חמש, תכנון טקטי — חצי שנה עד שנתיים, ותכנון ברמה האופרטיבית — 30 יום עד חצי שנה קדימה'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"צוות תפעול מתכנן את המשמרות לחודש הקרוב ואת המשימות לשלושת החודשים הבאים. לאיזה סוג תכנון זה שייך לפי לוחות הזמנים שבשקף 14?",o:["תכנון טקטי (Tactical) — חצי שנה עד שנתיים, בידי דרג הביניים","תכנון אסטרטגי (Strategic) — כי הוא קובע את סדרי העדיפויות של היחידה","תכנון תרחישים (Scenario planning) — כי המשמרות עשויות להשתנות","תכנון אופרטיבי (Operational) — 30 יום עד חצי שנה קדימה"],c:3,e:"שקף 14: Operational — 30 יום עד 6 חודשים; Tactical — 6 חודשים עד שנתיים; Strategic — שנתיים עד 5 שנים. המרצה: הדרג הזוטר 'מסתכל מה יהיה בטווח של ה-30 ימים הקרובים, החודש הקרוב, עד חצי שנה קדימה'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"ישיבת צוות שבועית, ישיבה חודשית ודיון רבעוני — לעומת מעבר משרד או טיול חברה. לפי השיעור, כיצד מכונים שני סוגי התוכניות?",o:["תוכניות קבועות (Standing) מול תוכניות חד-פעמיות (Single-use)","תוכניות אסטרטגיות מול תוכניות טקטיות, לפי אופק הזמן של כל אחת","תוכניות מגירה מול תוכניות פעולה, לפי מידת הוודאות שיש בכל אחת","תוכניות שוטפות מול תוכניות 'מתפרצות', שאין להן תכנון מראש"],c:0,e:"המרצה [44:14-46:00]: Standing plans — 'תוכניות מחזוריות שחוזרות על עצמן: אחת לשבוע ישיבת צוות, אחת לחודש, כל רבעון'; Single-use plans — 'משהו חד-פעמי: טיול חברה, מעבר משרד'. כשסטודנט הציע 'מתפרץ', תיקנה: 'מתפרץ זה משהו שאין לו תכנון בכלל'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"המרצה אמרה במפורש: 'גם במבחן אני אשאל MBO'. מה פירוש הקיצור, ובאיזה דרג משתמשים בשיטה בדרך כלל, לדבריה?",o:["Management by Operations — ניהול תפעולי שוטף; בעיקר בדרג הזוטר","Measurement of Business Outcomes — מדידת תוצאות; בעיקר בדרג הבכיר","Management by Objectives — ניהול לפי יעדים; בדרך כלל בדרג הביניים","Management by Observation — ניהול דרך הירידה לשטח; בכל הדרגים"],c:2,e:"המרצה [40:59-44:02]: 'השיטה שבדרך כלל דרג הביניים עובד בה — אבל לא רק — זה שיטת ה-MBO, Management by Objectives, ניהול על פי יעדים... וגם במבחן אני אשאל MBO'. הרעיון: 'אנחנו קובעים ביחד את היעדים, מגדירים ביחד את לוחות הזמנים'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"מהו הסדר הנכון של ארבע הפעילויות של ניהול לפי יעדים (MBO), לפי השקפים?",o:["הצבת יעדים, פיתוח תוכניות פעולה, סקירת התקדמות, הערכת הביצועים הכוללת","פיתוח תוכניות פעולה, הצבת יעדים, הערכת הביצועים הכוללת, סקירת התקדמות","הצבת יעדים, סקירת התקדמות, פיתוח תוכניות פעולה, הערכת הביצועים הכוללת","הערכת הביצועים הקודמים, הצבת יעדים, פיתוח תוכניות פעולה, סקירת התקדמות"],c:0,e:"שקפים 11-12: Set goals; Develop action plans; Review progress; Appraise overall performance. המרצה ציינה שבחלק מהספרות יש חמישה שלבים, אך בקורס — ארבעה. המחזור חוזר מדי שנה."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי השקף על שלב הצבת היעדים (Set goals) ב-MBO, מה יוצר את המחויבות החזקה ביותר להשגת היעדים?",o:["יעדים שקובעת ההנהלה הבכירה ומורידה לכל הדרגים","יעדים שהעובד קובע לעצמו לבדו, בלי מעורבות הממונה","הסכמה הדדית בין העובד לממונה על היעדים שיש להשיג","יעדים שמפורסמים מראש לכל הארגון, כך שכולם יודעים"],c:2,e:"שקף 11: 'Mutual agreement between employee and supervisor creates the strongest commitment to achieving goals'; ובצוותים — כל החברים עשויים להשתתף בהצבת היעדים. המרצה [47:07-48:02]: 'מחקרים מראים שכשעושים את זה ביחד יש הרבה יותר מחויבות — זו הסכמה הדדית, לא אנחנו והם'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"בשלב סקירת ההתקדמות (Review progress) ב-MBO, מה מספק בדרך כלל את הנתונים לסקירה, לפי השקף?",o:["סקרי שביעות רצון של הלקוחות, הנערכים בסוף כל רבעון","מדדי ביצוע מרכזיים (KPIs — Key Performance Indicators)","הדוחות הכספיים השנתיים של הארגון, לאחר ביקורת רו״ח","הערכות עמיתים (360 מעלות) של כל אחד מחברי הצוות"],c:1,e:"שקף 12: 'A periodic progress review is important to ensure that action plans are working. KPIs (Key Performance Indicators) often provide the data for the review'. הבדיקות התקופתיות מראות אם עומדים ביעד או שנדרשת פעולה מתקנת."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 12, מה נכון לגבי השלב האחרון ב-MBO — הערכת הביצועים הכוללת (Appraise overall performance)?",o:["ההערכה נעשית ברמת המחלקה בלבד, ולא ברמת העובד היחיד, כדי למנוע תחרות","ההערכה מנותקת מהתגמול, כדי לא לפגוע בשיתוף הפעולה בין חברי הצוות","המחזור מסתיים בהערכה, והיעדים לשנה הבאה נקבעים מחדש מאפס בידי ההנהלה","היא משפיעה על התגמול ומעצבת את יעדי השנה הבאה, והמחזור חוזר מדי שנה"],c:3,e:"שקף 12: ההערכה נעשית 'for both individuals and departments'; הצלחה או כישלון 'can become part of the performance appraisal system and the awarding of salary increases'; 'The appraisal... shapes goals for the next year. The MBO cycle repeats itself annually'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"מוקד מכירות מתגמל נציגים לפי מספר הלקוחות החדשים במשמרת. אחרי חודשיים מתגלה שנציגים 'גונבים' לקוחות זה מזה ומבטיחים הבטחות שלא יקוימו. איזו בעיה של MBO מדגים המקרה?",o:["שימוש לא נכון ב-MBO: חיתוך פינות, התעלמות מבעיות והתנהגות לא אתית לשם עמידה ביעד","חוסר התאמה (Alignment) בין יעדי המחלקה לבין היעדים האסטרטגיים של החברה כולה ושל ההנהלה","יעדים שאינם מדידים, ולכן אי אפשר לבדוק בסוף התקופה אם הנציגים עמדו בהם","סקירת התקדמות תכופה מדי, שמלחיצה את הנציגים ופוגעת בשיתוף הפעולה ביניהם"],c:0,e:"שקף 13: 'MBO can cause problems when used improperly. People may cut corners, ignore potential problems, or behave unethically just to meet the targets'. המרצה [51:56-52:26] נתנה בדיוק את הדוגמה הזו: 'גייסי במשמרת עשרה לקוחות חדשים, זה ה-KPI שלך — ואנשים דורסים אחד את השני'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"במשרד ממשלתי נקבע יעד: כל פנייה נענית תוך שש דקות. בפועל הנציגים עונים 'נחזור אליך' — ולא חוזרים. לפי המרצה, מה הלקח מ'חוק שש הדקות'?",o:["יש לקצר את היעד לשלוש דקות, כדי להגביר את הלחץ על הנציגים לחזור ללקוח","יש לבטל את היעד, כי יעדים כמותיים אינם מתאימים לעבודת שירות מול הציבור","זו בעיית בקרה בלבד, ואין לה קשר לאופן שבו הוגדר היעד מלכתחילה","יעדים צריכים להיות גם כמותיים וגם איכותניים, אחרת אין מענה אמיתי"],c:3,e:"המרצה [54:01]: 'יש חוק שש הדקות... הם עמדו ביעד, אבל בפועל לא קיבלתי את המענה... ולכן היעדים צריכים להיות גם כמותיים וגם איכותניים' — דבר שחזר שלוש פעמים בדיון על חסרונות MBO."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 13, כל הבאים הם יתרונות של ניהול לפי יעדים (MBO), למעט:",o:["ממקד את מאמצי המנהלים והעובדים בפעילויות שמובילות להשגת היעדים","מבטיח שהעובדים לא יחתכו פינות ולא יתעלמו מבעיות כדי לעמוד ביעדים","משפר את הביצועים בכל רמות הארגון ומגביר את המוטיבציה של העובדים","מיישר את יעדי הפרט ויעדי המחלקה עם יעדי החברה כולה"],c:1,e:"שקף 13 מונה את היתרונות: מיקוד המאמצים, שיפור ביצועים בכל הרמות, מוטיבציה, ויישור יעדי הפרט והמחלקה עם יעדי החברה. חיתוך פינות הוא דווקא הסיכון של MBO כשמשתמשים בו לא נכון — לא יתרון מובטח."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"המרצה המחישה את השקף 'Goal Alignment' באמצעות צוות חותרים. איזה עיקרון היא ביקשה ללמד?",o:["כל דרג קובע לעצמו יעדים עצמאיים, כדי שהארגון יתקדם בכמה כיוונים במקביל","השגת יעדי הדרגים הנמוכים מאפשרת את יעדי-העל — כולם באותו קצב וכיוון","הקצב נקבע בידי החותר החזק ביותר, ושאר החותרים צריכים להתאים את עצמם אליו","יישור יעדים חשוב בעיקר בדרג הבכיר; בדרגים הנמוכים מספיק לבצע את ההוראות"],c:1,e:"שקף 15: 'Achievement of goals at lower levels allows to attain high-level goals'. המרצה [66:53-67:45]: 'כולם באותו קצב, באותו כיוון, אותה זווית... לא משנה כמה AI יהיה — אם לא תהיה סינרגיה, התאמה, alignment מלא בין כל הדרגים, התכנון לא יקרום עור וגידים'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"במודל 'Making Plans Work' שבשקף 16, איזה שלב בא מיד אחרי הצבת היעדים (Set Goals)?",o:["פיתוח תוכניות פעולה (Develop Action Plans)","מעקב אחר ההתקדמות (Track Progress)","פיתוח מחויבות (Develop Commitment)","שמירה על גמישות (Maintain Flexibility)"],c:2,e:"שקף 16: Set Goals ← Develop Commitment ← Develop Effective Action Plans ← Track Progress towards the Goals ← Maintain Flexibility ← Revise/Begin Plan. רבים מדלגים ישר לתוכניות הפעולה — אך לפני כן יש לרתום את האנשים."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"לפי המרצה, איזה שלב במודל 'Making Plans Work' הוא 'הכי חשוב', ולמה?",o:["הצבת היעדים — כי בלי יעד ברור ומוסכם אין בכלל מה לתכנן ולבקר","פיתוח המחויבות — כי בלי רתימת העובדים שום תוכנית לא תצא לפועל","המעקב אחר ההתקדמות — כי רק כך לא מגיעים מופתעים לסוף התקופה","עדכון והתחלה מחדש (Revise/Begin) — כדי שכל רבעון יהיה טוב מקודמו"],c:3,e:"המרצה [90:01]: 'אני רוצה לשאול אתכם מה הכי חשוב פה? ...אם עשיתי טוב את הרבעון הקודם, הרבעון הבא צריך להיות רק עוד יותר טוב — אני אמורה להשתפר: Revise and begin plan'. זהו השלב שסוגר את המעגל ומתחיל אותו מחדש."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי גרסת SMART שנלמדה בקורס (שקף 'Effective Goal Setting'), לאיזו אות 'שייך' הרכיב 'ריאלי' (realistic)?",o:["לאות R — Realistic, כמו ברוב הגרסאות המוכרות של המודל בספרות","לאות A — Attainable and realistic; ה-R היא Linked to Rewards","לאות S — Specific and realistic, כי יעד ספציפי הוא בהכרח ריאלי","לאות M — Measurable and realistic, כי רק יעד מדיד ניתן לבדיקה"],c:1,e:"שקף 17: Specific; Measurable; Attainable and realistic; Linked to Rewards and incentives (and also Relevant); Timely. זו מלכודת נפוצה — בגרסה של הקורס 'ריאלי' נמצא תחת A, וה-R קשורה לתגמולים ולרלוונטיות."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"בדוגמת SMART של Google Meet בשקף 18, היעד הוא 'להגדיל את השימוש השבועי ב-20% עד סוף Q3'. לאיזה רכיב של SMART שייך הביטוי 'עד סוף Q3'?",o:["Measurable — כי הוא מאפשר למדוד את היעד","Specific — כי הוא מגדיר במדויק את מוקד היעד","Timely — כי הוא תוחם את היעד בפרק זמן מוגדר","Attainable — כי רבעון הוא פרק זמן ריאלי להשגה"],c:2,e:"שקף 18: Specific — שיפור המעורבות באמצעות פיצ'רים; Measurable — הגדלת השימוש השבועי ב-20%; Attainable — השקת שיפורים שכבר בפיתוח; Linked to rewards/Relevant — תומך בכלי עבודה מרחוק; Timely — 'By end Q3' (המרצה: 'סוף ספטמבר, לא אוגוסט')."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"מנהל מציב לצוותו יעדים קלים מאוד 'כדי שלא יהיה לחץ'. לפי המרצה, מה צפוי לקרות?",o:["המוטיבציה תעלה, כי הצלחה קלה ומהירה בונה אצל העובדים ביטחון","הביצועים ישתפרו לאורך זמן, כי העובדים יעמדו ביעדים בלי מאמץ","אבטלה סמויה ושחיקה — לא מעבודה קשה, אלא מפוטנציאל שאינו ממומש","התחלופה תרד, כי העובדים ירגישו בנוח ולא יחפשו מקום עבודה אחר"],c:2,e:"המרצה [71:25-72:48] תיארה שני קצוות של Attainable: יעד קל מדי — 'אבטלה סמויה, שחיקה, לא כי עובדים קשה מדי אלא כי אין מה לעשות והפוטנציאל לא ממומש'; ויעד לא ריאלי — סטרס, ויתור באמצע וחוסר הירתמות."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"טכנאי שמקבל יעד יומי של תיקוני כלים נתקל בתקלה 'פשוטה' שנמשכת שעות, ואינו עומד ביעד. לפי המרצה, איזה כלל צריך כל מנהל לזכור?",o:["אין 'להוריד' יעד לפני שווידאת שהוא עומד בכל חמשת הקריטריונים של SMART","יש להעניש עובד שאינו עומד ביעד, כדי לשמור על הרתעה בצוות כולו","יש לקבוע יעדים יומיים בלבד, כי יעדים ארוכים אינם ניתנים לבקרה","יש להוריד את היעד תמיד לרמה שהעובד החלש ביותר מסוגל לעמוד בה"],c:0,e:"המרצה [74:00]: 'אתה לא יכול להוריד יעד כל עוד הוא לא עומד בחמשת הקריטריונים... הרבה פעמים המשימות שאנחנו נותנים לא עומדות בהם. תסתכלו על ההנהלה הבכירה ותשאלו אם היעדים שאתם מקבלים עומדים בכל קריטריון'."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"לפי 'קריטריון מחקרי' שציינה המרצה, מתי ניתן לומר שמנהל אינו מתכנן נכון?",o:["כשהוא מקדיש לתכנון פחות מ-50% מזמנו, ולכן אינו מעמיק בו","כשהוא מקדיש לתכנון יותר מ-20% מזמנו, ולכן אינו מגיע לביצוע","כשהוא מתכנן יותר משנה קדימה, כי העתיד אינו ניתן לחיזוי","כשהוא מתכנן לבד, בלי שיתוף העובדים בהגדרת היעדים"],c:1,e:"המרצה [78:02]: 'יש פה קריטריון, מחקרית נקבע: אם יותר מ-20% מהזמן את מתכננת, את לא מתכננת נכון — כי בסוף אתה לא מגיע לביצוע'. זה אינו מופיע בשקפים."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"זום",q:"לפי המרצה, מה מייצר אצל העובד יעד בר-השגה שהוא מצליח לעמוד בו?",o:["שאננות, ולכן כדאי להעלות מיד את היעד הבא פי שניים ויותר","תלות במנהל, כי העובד מייחס את ההצלחה להגדרת היעד בידיו","תחושת הצלחה ומסוגלות — חוללות עצמית — שמגבירה את המאמץ הבא","ירידה במוטיבציה, כי הצלחה צפויה מראש אינה מאתגרת את העובד"],c:2,e:"המרצה [78:02-79:28]: יעד בר-השגה 'מייצר אצלו תחושת הצלחה ומסוגלות — קוראים לזה חוללות עצמית' (Self-efficacy), והוסיפה את אפקט פיגמליון: מי שמאמינים בו ומצליח — עובד קשה עוד יותר בפעם הבאה."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי השקף 'Developing Commitment to Goals', כל הבאים מסייעים לפתח מחויבות ליעדים, למעט:",o:["הצבת היעדים בשיתוף העובדים ובעלי העניין","בחירת יעדים סבירים (Reasonable goals)","שמירת היעדים חסויים, כדי למנוע לחץ חברתי מיותר","קבלת תמיכה של ההנהלה הבכירה (Top management support)"],c:2,e:"שקף 20 מונה: Setting goals in participation with employees and stakeholders; Choosing reasonable goals; Making goals public; Obtaining top management support. פרסום היעדים ברבים דווקא מחזק את המחויבות — ההפך מהסתרתם."},
{l:3,t:"יעדים, תכנון ו-MBO",s:"מצגת",q:"לפי שקף 'Effective Action Plans', אילו ארבעה רכיבים כוללת תוכנית פעולה אפקטיבית?",o:["חזון, משימה, ערכי הארגון ויעדי-על","יעד, תקציב, מנגנון בקרה ותגמול","חוזקות, חולשות, הזדמנויות ואיומים","צעדים ספציפיים, אנשים, משאבים ופרק זמן"],c:3,e:"שקף 21: Specific steps; People; Resources; Time period. המרצה [89:50-90:31] קישרה זאת ל'שאלות ה-WH מהתיכון': מה, מתי, כמה, למה, מי ואיך — 'ברחל בתך הקטנה'."},
{l:3,t:"SWOT",s:"מצגת",q:"לפי השקפים על ניתוח SWOT, איזו מהטענות הבאות נכונה?",o:["חוזקות והזדמנויות הן גורמים פנימיים; חולשות ואיומים — גורמים חיצוניים","חוזקות וחולשות נבחנות בהשוואה לאחרים, ו-SWOT הוא בסיס לניתוח מפורט","הניתוח נעשה ביחס לעבר הארגון בלבד, בלי השוואה למתחרים","SWOT הוא ניתוח כמותי מפורט שמייתר ניתוחים אסטרטגיים נוספים"],c:1,e:"שקף 24: 'Strengths and weaknesses should be evaluated in comparison to others'; 'SWOT provides the basis for more detailed analysis'; הניתוח נעשה בסיעור מוחות ובדיון יצירתי. חוזקות וחולשות — פנימיות; הזדמנויות ואיומים — בסביבה החיצונית."},
{l:3,t:"SWOT",s:"זום",q:"לפי המרצה, מה מבדיל בין שני הזוגות של רכיבי SWOT מבחינת ממד הזמן — ומדוע זה הופך אותו לכלי תכנון אסטרטגי?",o:["חוזקות וחולשות — 'עם הפנים קדימה'; הזדמנויות ואיומים — 'כאן ועכשיו'","כל ארבעת הרכיבים מתארים את העבר, ולכן SWOT הוא כלי לבקרה ולא לתכנון","חוזקות וחולשות — 'כאן ועכשיו'; הזדמנויות ואיומים — 'עם הפנים קדימה'","כל ארבעת הרכיבים מתארים את העתיד, ולכן SWOT מחליף את תכנון התרחישים"],c:2,e:"המרצה [98:01-99:00]: 'חוזקות וחולשות זה כאן ועכשיו; איומים והזדמנויות זה עם הפנים קדימה — ולכן התכנון האסטרטגי חשוב באמצעות הכלי הזה: הוא מחבר בין עכשיו למה שיהיה בעתיד'."},
{l:3,t:"SWOT",s:"מצגת",q:"במטריצה שבשקף 25 (Andrews), איזו פעולה אסטרטגית מתאימה למשבצת שבה חולשה פנימית פוגשת הזדמנות חיצונית?",o:["Exploit — למנף את החוזקה לניצול ההזדמנות","Resist — להתגונן מפני האיום באמצעות החוזקה","Forget — לצאת בזמן מהתחום ולוותר עליו לגמרי","Explore — לנצל הזדמנות כדי להתגבר על חולשה"],c:3,e:"שקף 25: Strengths×Opportunities = Exploit; Strengths×Threats = Resist; Weaknesses×Opportunities = Explore; Weaknesses×Threats = Forget. שקף 26 מנסח זאת כשאלה: WO — 'How can you use your opportunities to overcome the weaknesses you are experiencing?'"},
{l:3,t:"SWOT",s:"זום",q:"בתקופת הקורונה, כשמשלוחי הסופרמרקטים התעכבו כשבוע, תנובה ניצלה את קווי הייצור, המוניטין ומערך ההפצה שלה והקימה שירות משלוחים ישירות לבית הלקוח. לפי המרצה, איזו אסטרטגיה זו?",o:["Exploit — מינוף חוזקה לניצול הזדמנות ('מכפיל כוח'), תוך אינטגרציה קדימה","Explore — שימוש בהזדמנות כדי לתקן חולשה במערך ההפצה של החברה","Resist — שימוש בחוזקה כדי להתגונן מאיום של רשתות השיווק הגדולות","Forget — ויתור על המתווכים, שהיו 'בטן רכה' עבור החברה באותה תקופה קשה"],c:0,e:"המרצה [99:00-101:01]: תנובה 'עשתה את השילוב האופטימלי של חוזקות עם הזדמנויות... דילגה על כל המתווכות — לא צריכה את שופרסל ולא את רמי לוי — ומרוויחה יותר. באסטרטגיה זה נקרא אינטגרציה קדימה'. חוזקה עם הזדמנות = 'מנוף' ו'מכפיל כוח'."},
{l:3,t:"SWOT",s:"זום",q:"ביטוח ישיר יצאה מתחום ביטוחי המנהלים ומכרה את הפעילות, כי הייתה חלשה בתחום ומתחרות חזקות רבות נכנסו אליו. לפי המרצה, מה מדגים המהלך?",o:["Resist — התגוננות מפני המתחרות באמצעות המותג החזק של החברה","Forget — יציאה בזמן מ'בטן רכה', שבה חולשה פוגשת איום","Explore — מכירת הפעילות כדי לממן תיקון של החולשות בתחום","Exploit — מינוף המותג לקבלת מחיר גבוה במכירת הפעילות"],c:1,e:"המרצה [102:01-103:00]: חולשה עם איום — 'מקום שלא כדאי להיות בו'; ביטוח ישיר 'בורח מהתחום מהר, לפני עוד הפסדים' — הפסיקה להפסיד כסף, שמרה על המותג ופינתה משאבים לפרויקטים אחרים. זהו Forget."},
{l:3,t:"SWOT",s:"זום",q:"אל על, שהייתה חזקה בטיסות אך זיהתה איום מצד חברות הלואו-קוסט, הקימה מותג-בית של טיסות זולות. לפי המרצה, איזו אסטרטגיה זו?",o:["Exploit — ניצול ההזדמנות שנוצרה בשוק הטיסות הזולות","Explore — תיקון החולשה של אל על במחירי הכרטיסים","Resist — שימוש בחוזקה כדי להתגונן מפני האיום","Forget — יציאה הדרגתית מתחום הטיסות הסדירות"],c:2,e:"המרצה [104:00-105:00]: 'הם היו מאוד חזקים בטיסות, אבל הם ידעו שיש איומים בסביבה החיצונית — אז עשו Resist: הקימו מותג של טיסות זולות יותר תחת הבית שלהם'. חוזקה × איום = Resist (שקף 25)."},
{l:3,t:"SWOT",s:"זום",q:"לרשת רמי לוי היה נתח נמוך בערוץ האונליין, בזמן שהשוק עבר לקניות ברשת. הרשת השקיעה מיליונים בערוץ, בהכשרת עובדים ובגיוס מהנדסים. לפי המרצה, איזו אסטרטגיה זו?",o:["Explore — ניצול הזדמנות בשוק כדי להתגבר על חולשה פנימית","Exploit — מינוף החוזקה של הרשת במחירים נמוכים לערוץ חדש","Resist — התגוננות מפני האיום של שופרסל בתחום האונליין","Forget — נטישת החנויות הפיזיות לטובת הערוץ המקוון"],c:0,e:"המרצה [104:00]: 'אחוז השימוש בערוץ האונליין שלו היה מאוד נמוך... לקח את החולשה פלוס ההזדמנות, השקיע מיליונים בערוץ האונליין'. דוגמה נוספת ל-Explore: מקדונלד'ס, שהוסיפה סלטים כשהחולשה (אוכל לא בריא) פגשה את טרנד הבריאות."},
{l:3,t:"SWOT",s:"זום",q:"המרצה ביקשה במפורש 'לזכור שני מונחים' מתוך הצלבות ה-SWOT. מהם?",o:["'מכפיל כוח' — חולשה עם הזדמנות; 'בטן רכה' — חוזקה עם איום","'מנוף' — חוזקה עם איום; 'בטן רכה' — חולשה עם הזדמנות","'מכפיל כוח' — חוזקה עם הזדמנות; 'בטן רכה' — חולשה עם איום","'מנוף' — הזדמנות עם איום; 'מכפיל כוח' — חוזקה עם חולשה"],c:2,e:"המרצה [103:00-104:00]: 'אתם צריכים לזכור שני מונחים: מכפיל כוח — חוזקה עם הזדמנות, אנחנו גם קוראים לו מנוף; ובטן רכה — מקום שאני חלש בו ובמקביל השוק מציב לי איומים'. החוכמה: לדעת איפה הבטן הרכה — לברוח ממנה או להפוך איום להזדמנות."},
{l:3,t:"SWOT",s:"זום",q:"חברה סיימה ניתוח SWOT מפורט ורשמה את חוזקותיה, חולשותיה, ההזדמנויות והאיומים. לפי המרצה, מה עליה לעשות עכשיו?",o:["להציג את הניתוח לדירקטוריון, ובכך להשלים את תהליך התכנון האסטרטגי","להתמקד רק בחוזקות ובהזדמנויות, ולהשאיר את החולשות לטיפול בעתיד","לחזור על הניתוח מדי חודש, כדי לוודא שהוא מעודכן לכל שינוי בשוק","לבצע הצלבות ולצאת עם החלטות אופרטיביות — לפחות פרויקט אחד בכל משבצת"],c:3,e:"המרצה [105:00-106:03]: 'הרבה חברות עושות ניתוח SWOT — חוזקות, חולשות, איומים, הזדמנויות — וגמרנו. לא. החוכמה היא לעשות הצלבות, וכתוצאה מהן לצאת עם החלטות אופרטיביות... לפחות פרויקט אחד ב-Exploit, אחד ב-Explore, אחד ב-Forget ואחד ב-Resist'."},
{l:3,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי השקף 'Preparing for Unexpected Conditions', כיצד נערכים לתנאים בלתי צפויים?",o:["מזהים גורמים שאינם בשליטה, מכינים תוכניות גמישות וכמה חלופות עתידיות","מגדילים את מלאי הביטחון ומקטינים את ההוצאות על מחקר ופיתוח עד שהמצב מתבהר","מקבעים תוכנית אחת מפורטת ככל האפשר ונצמדים אליה בכל מצב שעלול להתפתח","מעבירים את כל ההחלטות לדרג הזוטר, שמגיב מהר יותר לשינויים בשטח ובסביבה"],c:0,e:"שקף 29: 'Identify uncontrollable factors'; 'Draft flexible plans'; 'Think of multiple future alternatives'. המרצה [107:01]: 'כל ענף, מחלקה, חברה צריכים למפות את ה-uncontrollable factors', והודיעה שבשיעור הבא — תכנון תרחישים."},
