{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"לפי ההסבר בכיתה, כיצד יישמה UPS בפועל את תכנון התרחישים?",o:["מינתה יועץ חיצוני אחד שבנה לבדו את כל התרחישים והציג אותם לדירקטוריון","העבירה את התכנון לדרג הזוטר ביחידות השטח, שמכיר את הלקוחות ואת השוק מקרוב","בחרה תרחיש סביר אחד והשקיעה בו את כל התקציב שהוקצה לתכנון","סדנאות למאות מנהלים בתדירות גוברת, שהניבו ארבעה תרחישים ומנהלים אחראים"],c:3,e:"המרצה [96:05-98:00]: 'ארבעה תרחישים מרכזיים, ארבעה מנהלים, ארבעה פרויקטים'; 'עשו סדנאות למאות מנהלים כל שנתיים, אחר כך כל שנה, אחר כך כל חצי שנה; חייבו מנהלים של 30 שנה לצאת מהקופסה' — ו'שמו את פדקס מאחור'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי שקף 17, מהו תכנון אסטרטגי (Strategic Planning)?",o:["ניתוח הביצועים בעבר כדי להפיק לקחים ולשפר את התפעול השוטף של הארגון","פירוק היעדים של הדרג הבכיר למשימות יומיות מדידות לכל עובד בארגון","קביעת תקציב שנתי והשוואתו לביצוע בפועל בסוף השנה, כדי לתקן חריגות","הסתכלות קדימה לזיהוי מיקום רצוי, ועבודה לאחור אל ההווה לקביעת הדרך"],c:3,e:"שקף 17: 'Looking forward to the future to identify a preferred position and then working backwards to the present to establish ways to achieve it' — לצפות מגמות, להעריך את הנוף התחרותי ולזהות צורכי לקוחות, ולפתח יעדים, מדיניות ופרויקטים שיניבו ביצועים עדיפים."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"בדיון על תוכנית חמש-שנתית ההנהלה עוסקת רק בתחזיות מכירות ובאחוזי צמיחה, ואיש אינו שואל איך השינויים ישפיעו על העובדים ועל הלקוחות. איזה אתגר של תכנון אסטרטגי מדגים המקרה?",o:["אי-ודאות אינהרנטית (Inherent uncertainty) — קושי לצפות שינויים בסביבה","היעדר נקודות מבט מגוונות (Lack of diverse perspectives)","שליטה של המספרים (Too easily dominated by the numbers)","כשל בביצוע (Failing in execution) — דרג הביניים אינו מבין את התוכנית"],c:2,e:"שקף 18: 'Too easily dominated by the numbers — Quantitative analysis drives out qualitative assessment'. המרצה [68:00-69:00]: 'מדברים על 20%, 50% — על כמויות — אבל פחות על נתונים איכותניים, quality'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"ההנהלה הבכירה של חברה גיבשה אסטרטגיה מבריקה, אך מנהלי הביניים לא הבינו כיצד לבצע אותה ביעילות, והתוכנית לא יושמה. איזה אתגר של תכנון אסטרטגי זה, לפי שקף 19?",o:["ניתוק בין החזון ליישום (Lack of linkage)","כשל בביצוע (Failing in execution)","היעדר גיוון בדעות (Lack of diverse perspectives)","אי-ודאות אינהרנטית (Inherent uncertainty)"],c:1,e:"שקף 19: 'Failing in execution — Top managers are in charge of planning, whereas mid-level managers often lack the understanding to carry out the plans effectively'. המרצה [69:00]: 'מנהלים מאוד טובים בקביעת אסטרטגיה — המקום שהם נופלים בו: implementation'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"צוות תכנון מתכנס במהירות להנחה ש'בינה מלאכותית תחליף את כל נציגי השירות', ואיש אינו מציג עמדה אחרת. איזה אתגר של תכנון אסטרטגי זה, ואיך כונה בכיתה?",o:["היעדר נקודות מבט מגוונות — 'אפקט העדר'","אי-ודאות אינהרנטית — 'עולם שמשתנה כל הזמן'","שליטה של המספרים — 'הכמותי מנצח את האיכותני'","ניתוק בין חזון ליישום — 'כאן ועכשיו'"],c:0,e:"שקף 18: 'Lack of diverse perspectives — Teams tend to converge quickly on a consensus set of assumptions and recommendations'. בכיתה [63:09-63:46] סטודנט תיאר זאת כ'אפקט העדר': כולם מאמינים ש-AI יחליף אנשים, אף ש-90% אינם רוצים לדבר עם בוט."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"רע״ן אומר: 'אני בתפקיד שנתיים — מעניין אותי מה יקרה בשנתיים שלי, לא בתפקיד הבא'. לאיזה אתגר של תכנון אסטרטגי זה מתקשר, לפי המיפוי שעשתה המרצה?",o:["שליטה של המספרים — כי הרע״ן מעדיף יעדים כמותיים וקצרים","כשל בביצוע — כי דרג הביניים אינו מבין את התוכנית שהוכתבה לו","היעדר נקודות מבט מגוונות — כי כל המפקדים חושבים בדיוק כמוהו","ניתוק בין החזון ליישום היומיומי — מנהלים עסוקים בשוטף ולא ברחוק"],c:3,e:"המרצה [69:00], בהתייחסות לתשובה הזו: 'למנהלים קשה להבין את ההקשר ולהתחבר לפרויקטים ארוכי טווח, כי הם עסוקים באיך אני עונה למפקד שלי... נורא קשה לבקש מהמנהל: תחשוב שנתיים קדימה' — זה הקשר של Lack of linkage between vision and day-to-day implementation."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי שקף 21, מהו תכנון תרחישים (Scenario Planning)?",o:["טכניקה שבוחרת את העתיד הסביר ביותר ובונה סביבו תוכנית אחת מפורטת ומחייבת","טכניקה שממפה כמה עתידים חלופיים ומכניסה פיזור לתהליך — למשל מטריצת 2x2","טכניקה כמותית לחיזוי המכירות העתידיות על סמך נתוני העבר של החברה","טכניקה שמעבירה את התכנון מההנהלה הבכירה לדרג הזוטר, הקרוב לשטח"],c:1,e:"שקף 21: 'Maps out a small number of possible alternative futures, and considers their implications'; 'Builds divergence into the strategic process, by decomposing the future into distinct states that must be considered separately — Example: Creating a 2x2 matrix of possibilities'. זוהי טכניקה שמתגברת על חלק מקשיי התכנון האסטרטגי."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"המרצה אמרה 'תזכרו — בזה אתם צריכים ללמוד'. כיצד בונים תרחישים ב-90% מהחברות?",o:["שני תרחישים — אופטימי ופסימי — על ציר אחד של צמיחה או ירידה","תרחיש אחד לכל מחלקה, כך שמספרם שווה למספר המחלקות בארגון","כארבעה תרחישים על פני שני צירי אי-ודאות, לפי השאלה האסטרטגית","שמונה תרחישים על שלושה צירים קבועים: פוליטי, כלכלי וטכנולוגי"],c:2,e:"המרצה [86:02-87:03]: 'ב-90% מהחברות נבנים כ-4 תרחישים על שני צירים — שני צירי אי-ודאות, תלוי מה השאלה האסטרטגית (למשל חברה טכנולוגית שואלת איך תשפיע בינה מלאכותית על המוצר)'. הצירים משתנים לפי ענף, מצב, רמת אי-ודאות וגודל החברה."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"לפי המרצה, מה קורה עם כל אחד מהתרחישים שנבחרו בתהליך תכנון התרחישים?",o:["הוא נגנז במגירה עד לדיון הבא של הדירקטוריון, בעוד כשנה","הוא מועבר ליועץ החיצוני, שאחראי לבצע אותו אם יתממש","הוא מדורג לפי סבירות, ורק התרחיש הסביר ביותר מקבל תקציב","הוא מתועד, ומוצמד לו מנהל בכיר עם תוכנית מגירה שהוא 'שולף'"],c:3,e:"המרצה [87:03-89:59]: 'כל תרחיש מתועד וממש מוצמד מנהל שתפקידו, אם וכאשר יקרה התרחיש, לקחת את זה' — עם תוכנית מגירה ותקציב. ב-UPS 'לקחו מנהל בכיר, 20 שנה בארגון, שמכיר אותו מכל הכיוונים'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"המרצה השוותה את תכנון התרחישים לביטוח. מה ביקשה להמחיש?",o:["תכנון תרחישים זול ומשתלם תמיד, כמו פרמיה נמוכה בפוליסה","משקיעים גם בתרחישים בסבירות נמוכה (10%-20%) כדי לשרוד","רק תרחישים שהסבירות שלהם מעל 50% מצדיקים השקעה של כסף","את הסיכונים יש להעביר לחברת ביטוח חיצונית במקום לתכנן אותם בעצמנו מראש"],c:1,e:"המרצה [70:29-70:58]: 'אתה משלם ביטוח 300 ש״ח בחודש, הסבירות קטנה, אבל אף אחד לא רוצה למצוא את עצמו...'; 'חברות שהייתה להן טכנולוגיה מנצחת אבל לא היו להן תוכניות מגירה — נמחקו מהמפה'. הסבירות של התרחישים 'היא 10, 20, לפעמים 3 אחוז — אבל אתה שם על זה כסף'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי שקף 22, מהו תכנון התרחישים 'במהותו' (In essence)?",o:["כלי ללמידה קולקטיבית: דיון עשיר, סימולציה מנטלית וחזרה — שמשפרים גמישות","כלי לחיזוי מדויק של העתיד, שמאפשר לוותר על תוכניות גמישות ועל גיבוי","כלי בקרה, שמשווה בכל רבעון את הביצוע בפועל לתרחיש שנבחר מראש ומדווח עליו","כלי לקבלת החלטות מהירה בחירום, שבו המנהל הבכיר מכריע לבדו"],c:0,e:"שקף 22: 'In essence, scenario planning is a tool for collective learning — Good scenarios generate rich strategic discussions'; 'By mental simulation and rehearsal, managers improve their preparation for the future — Leading to greater flexibility when faced with changing circumstances'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי שקף 23, כל הבאים הם יתרונות של תכנון תרחישים, למעט:",o:["מאלץ מנהלים לשקול עתידים שונים ומסלולי התפתחות מרובים","נותן לגיטימציה רבה יותר לדעות של מיעוט בקבוצה","עוזר להתגבר על ביטחון-יתר בעתיד חזוי אחד","מניב תרומה מיידית ומדידה כבר בשלבים הראשונים"],c:3,e:"שקף 23 מונה: שקילת עתידים ומסלולים מרובים; מניעת התמקדות מהירה מדי במספרים; לגיטימציה לדעות מיעוט; מאבק בהטיות מסורתיות; התגברות על ביטחון-יתר בעתיד יחיד. דווקא בחסרונות (שקף 24): מנהלים מצפים לתרומה מיידית ומדידה, בעוד התהליך משתלם רק לאחר זמן רב."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"מנהלי חברה התלוננו שסדנאות תכנון התרחישים 'מרחפות' ומופשטות מדי, בלי קשר לשטח, ושמנהלי הקו כמעט לא שותפו בהן. אילו חסרונות של תכנון תרחישים (שקף 24) באים כאן לידי ביטוי?",o:["ביטחון-יתר בעתיד יחיד והתמקדות מהירה מדי במספרים ובתחזיות","לגיטימציה מופרזת לדעות מיעוט ולתרחישי קיצון שאינם סבירים","דיונים מופשטים ולא מעוגנים, ודיון לא מספיק עם מנהלי הקו","הסתמכות על יועצים חיצוניים שאינם מכירים את הארגון מבפנים"],c:2,e:"שקף 24: 'Might not involve enough discussion with line managers'; 'Discussions might become too abstract and poorly grounded'. ביטחון-יתר בעתיד יחיד ולגיטימציה לדעות מיעוט מופיעים דווקא ברשימת היתרונות (שקף 23)."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"לפי שקף 24, מהו 'הסיכון בשימוש לרעה בתרחישים' (Risk of misusing scenarios)?",o:["שימוש בתרחישים כדי להצדיק קיצוצים בכוח האדם של הארגון","פיתוי של המנהלים להעדיף מסלול התפתחות אחד על פני האחרים","הדלפה של התרחישים למתחרים, שיכולים להיערך אליהם מראש","בניית יותר מדי תרחישים, עד שכבר אי אפשר לנהל את כולם"],c:1,e:"שקף 24: 'Risk of misusing scenarios — Managers need to resist the temptation to favor one evolutionary path'. בכיתה [92:15-93:01] עלתה גם הסכנה שמנהלים יביאו תרחישים שמשרתים אג'נדה אישית."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"לפי המרצה, מדוע תכנון תרחישים 'מונע את אפקט העדר'?",o:["כי המנהל הבכיר מכתיב את התרחישים, ואין צורך בדיון פתוח","כי הוא מבוסס על נתונים כמותיים בלבד, שאינם נתונים לפרשנות","כי כולם חייבים להשתתף וניתן מקום גם למיעוט ולדעה שונה לחלוטין","כי כל מנהל בונה תרחישים לבדו, בלי להיחשף לדעות של אחרים"],c:2,e:"המרצה [90:01-91:00]: 'זה מחייב מנהלים, גם אם אתה רוצה וגם אם לא, להיות שותפים — כל המטכ״ל יוצא לסדנה'; 'זה מונע את אפקט העדר, ונותנים פה גם למיעוט: אם ראש אמ״ן חושב משהו שונה לחלוטין — הוא ידבר'. בנוסף, מדברים גם על דברים איכותניים ולא רק על מספרים."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"שאלת דיון בשקף 28: 'איזה ענף הכי פגיע לשינוי סביבתי מהיר?'. לפי המרצה, איזה ענף זקוק במיוחד לתכנון תרחישים?",o:["הקמעונאות, שבה השינויים איטיים והצרכנים נאמנים למותגים לאורך זמן","המגזר הציבורי, שבו אין מתחרים ולכן גם אין לחץ לתכנן לטווח ארוך","תעשיית המזון, שבה הביקוש יציב ואינו מושפע כמעט משינויים טכנולוגיים","טכנולוגיה והייטק — שבהם 'אין זכות קיום מהיום למחר' והסיכון גבוה"],c:3,e:"המרצה [102:50-103:36]: 'טכנולוגיה — בהייטק אין זכות קיום מהיום למחר; חברות שהיו באולימפוס, ובעוד שנתיים אין חברה... בענפים שבהם הסיכון גדול יותר חייבים כל הזמן לבנות תרחישים'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"שאלת דיון בשקף 29: 'האם ארגונים צריכים להשקיע בהזדמנויות שאולי לעולם לא יתממשו?'. מה הייתה עמדת המרצה?",o:["כן — גם כשקשה לשרוד היום, שמים תקציב למחר, כמו טבע במחקר ופיתוח","לא — חברה צריכה להשקיע רק בהזדמנויות שהסבירות שלהן גבוהה ומוכחת","רק חברות רווחיות מאוד יכולות להרשות לעצמן השקעות כאלה בעתיד הרחוק","רק אם ההשקעה מחזירה את עצמה בתוך שנה, לפי מדדי התשואה המקובלים"],c:0,e:"המרצה [104:55-106:33]: 'גם כשאתה לא שורד היום, אתה שם תקציב למחר בבוקר'. דוגמת טבע: 'הרבה תרופות ופיתוחים יורדים לטמיון, אבל כדי שמחר יהיה קופקסון — משקיעים במו״פ ועושים תרחישים'. 'תכנון אסטרטגי הוא זה שגורם לחברות לשרוד לאורך שנים'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"מצגת",q:"מהו הסדר הנכון של ארבעת שלבי התכנון האסטרטגי (Stages of Strategic Planning) לפי שקף 27?",o:["גיבוש אסטרטגיה, סריקת סביבה, תכנות אסטרטגי, יישום","סריקת סביבה, תכנות אסטרטגי, גיבוש אסטרטגיה, יישום","סריקת סביבה, גיבוש אסטרטגיה, יישום, תכנות אסטרטגי","סריקת סביבה, גיבוש אסטרטגיה, תכנות אסטרטגי, יישום"],c:3,e:"שקף 27: Environmental scanning; Strategy formulation; Strategic programming; Strategy implementation. המרצה [100:00]: 'אלה ארבעת השלבים — אותם אתם צריכים להבין — שכל חברה עוברת בתכנון אסטרטגי'."},
{l:4,t:"תכנון אסטרטגי ותרחישים",s:"זום",q:"לפי המרצה, מה כולל השלב הראשון של התכנון האסטרטגי — סריקת הסביבה (Environmental scanning)?",o:["הגדרת המוצרים, השווקים וקהלי היעד, ואיך הארגון ימתג את עצמו","סקירה של מה שקורה בחוץ: סקר שוק, SWOT ו-PESTEL","תרגום האסטרטגיה שנבחרה לתוכניות פעולה מפורטות לכל יחידה","יישום התוכניות בפועל ובקרה על הביצוע מול היעדים שנקבעו"],c:1,e:"המרצה [100:00]: Environmental scanning — 'סקירה של מה קורה בחוץ: סקר שוק, ניתוח SWOT, כל מה שדיברנו'. הגדרת מוצרים ושווקים היא Strategy formulation; תרגום לתוכניות פעולה — Strategic programming; והיישום — Implementation."},
{l:4,t:"קבלת החלטות",s:"מצגת",q:"לפי שקף 30, מהי קבלת החלטות רציונלית (Rational decision making)?",o:["תהליך שבו המנהל בוחר לפי האינטואיציה והניסיון שצבר לאורך השנים","תהליך שבו הקבוצה מצביעה על החלופות, והחלופה שקיבלה רוב נבחרת","תהליך שיטתי של הגדרת בעיות, הערכת חלופות ובחירת הפתרון האופטימלי","בחירה בחלופה הראשונה שעומדת בדרישות המינימום, כדי לחסוך בזמן"],c:2,e:"שקף 30: Decision making — 'The process of selecting a solution or a manner of implementation from several available alternatives'; Rational decision making — 'a systematic process of defining problems, evaluating alternatives, and choosing optimal solutions'."},
{l:4,t:"קבלת החלטות",s:"מצגת",q:"לפי שקף 31, מהו הסדר הנכון של שלבי תהליך קבלת ההחלטות (Decision Making Process)?",o:["אבחון הבעיה, פיתוח חלופות, הערכת החלופות, יישום ומעקב","פיתוח חלופות, אבחון הבעיה, הערכת החלופות, יישום ומעקב","אבחון הבעיה, הערכת החלופות, פיתוח חלופות, יישום ומעקב","אבחון הבעיה, פיתוח חלופות, יישום ההחלטה, הערכת החלופות"],c:0,e:"שקף 31: Diagnosing the problem; Developing alternatives; Evaluating the alternatives; Implementation and monitoring the decision. אי אפשר להעריך חלופות לפני שפותחו, ואת ההערכה עושים לפני היישום."},
{l:4,t:"קבלת החלטות",s:"מצגת",q:"לפי שקף 33, כל הבאים הם יתרונות של קבלת החלטות בקבוצה (Group Decision Making), למעט:",o:["ניתוח הבעיה מנקודות מבט מרובות","גישה ליותר מידע וליותר פתרונות חלופיים","מחויבות של הצוות להצלחת הפתרון שנבחר","חיסכון בזמן לעומת החלטה של מנהל יחיד"],c:3,e:"שקף 33 — יתרונות: ניתוח מנקודות מבט מרובות, יותר מידע, יותר חלופות, ומחויבות הצוות לפתרון. חסרונות: 'Time consuming' ו-'Members might not feel accountable for decisions taken'. כלומר, הקבוצה דווקא גוזלת יותר זמן."},
{l:4,t:"קבלת החלטות",s:"מצגת",q:"לפי שקף 33 ודברי המרצה, מהם החסרונות של קבלת החלטות בקבוצה?",o:["פחות מידע ופחות חלופות מאשר בהחלטה של מנהל יחיד ומנוסה","פגיעה במחויבות הצוות והגברת ההתנגדות לפתרון שנבחר בסוף","גוזלת זמן, והחברים עלולים לא לחוש אחריות להחלטות שהתקבלו","השתקת דעות המיעוט וחיזוק דעתו של המנהל הבכיר בחדר"],c:2,e:"שקף 33: 'Time consuming' ו-'Members might not feel accountable for decisions taken'. המרצה [107:00-108:00] הוסיפה: הרבה כסף ומשאבים, ו'אנטגוניזם מצד מנהלים שההחלטה או הרעיון שלהם לא יתקבל' ('my way or the highway'). היתרונות — דווקא יותר מידע, יותר חלופות ויותר מחויבות."},

{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"על פי ההגדרה שהוצגה בשיעור, 'ארגון' (Organization) הוא:",o:["הצבת היעדים והמדדים הכמותיים שאליהם החברה שואפת להגיע בטווח הארוך","הקצאה ופריסה של המשאבים לשם השגת היעדים שנקבעו בשלב התכנון האסטרטגי","אוסף הפעילויות שהופך תשומות לתפוקות בעלות ערך ללקוח","השוואת הביצועים בפועל ליעדים ותיקון סטיות במידת הצורך"],c:1,e:"שקף 3: Organization is the deployment of resources to achieve the goals set at the strategy planning stage; המרצה [31:57]: 'התכנון = לאן רוצים להגיע, הארגון = איך נגיע לשם'. תשובה ג' היא הגדרת התהליך הארגוני (Organizational process), ותשובה ד' היא בקרה."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"מנכ\"לית של רשת קמעונאית מבקשת ממנהל משאבי האנוש מסמך שמגדיר 'מי כפוף למי, אילו מחלקות קיימות ואיך מחולקות המשימות והסמכויות ביניהן'. המסמך המבוקש מתאר בעיקר את:",o:["התהליך הארגוני (Organizational process) של הרשת","האסטרטגיה העסקית (Strategy) שנקבעה בשלב התכנון","המבנה הארגוני (Organizational structure) של הרשת","מוטת הניהול (Span of management) של המנכ\"לית"],c:2,e:"שקף 3: המבנה הארגוני הוא התצורה האופקית והאנכית של מחלקות, סמכות ותפקידים, והוא מגדיר איך מחולקות משימות, מוקצים משאבים ומתואמות מחלקות. התהליך הארגוני עוסק בהפיכת תשומות לתפוקות, לא במפת הכפיפויות."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"בנק גדול מאורגן בחטיבות פונקציונליות (כספים, IT, משאבי אנוש), אך חטיבת הבנקאות שלו מחולקת ללקוחות פרטיים ועסקיים, וסניפיו מחולקים לפי אזורים. לפי דברי המרצה, מצב זה:",o:["אינו אפשרי, שכן ארגון חייב לבחור סוג מחלוקה (Departmentalization) אחד","מוגדר כמבנה מטריציוני (Matrix), שכן משולבים בו כמה סוגי מבנים","לגיטימי — בארגון אחד יכולים להתקיים שילובים של כמה סוגי מבנים","מעיד על ביזוריות יתר (Over-decentralization) של סמכויות ההחלטה"],c:2,e:"[35:32] המרצה הדגישה: 'חשוב לי מאוד להגיד את זה — בכל ארגון יכולים להיות שילובים של מבנים', ונתנה כדוגמה את בנק לאומי. שילוב חטיבות מסוגים שונים אינו מטריצה; מטריצה היא כפיפות של אותו עובד לשני מנהלים."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"איזה מהבאים הוא יתרון של המבנה הפונקציונלי (Functional structure) לפי המצגת?",o:["צמצום כפילויות המוביל להורדת עלויות","קלות בהערכת ביצועי כל יחידת עבודה בנפרד","תגובה מהירה לדרישות של אזורי שוק שונים","מאגר מומחיות הזמין לכל החטיבות בארגון"],c:0,e:"שקף 6: Reduced duplication leads to lower costs — 'יש אחד בכל תפקיד' [41:31]; יתרונות נוספים: מומחים מיומנים, יושרה ומקצועיות, מוכוונות עשייה. הערכת ביצועי יחידות היא יתרון של המבנה המוצרי, תגובה לאזורי שוק – של הגיאוגרפי, ומאגר מומחיות – של המטריציוני."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"בבית חולים המאורגן לפי מחלקות התמחות, אורתופד בכיר מתלונן שאין לו לאן להתקדם מחוץ לתחומו, וכי שני רופאים ממחלקות שונות רשמו לאותו חולה תרופות סותרות. שתי התלונות משקפות חסרונות מוכרים של:",o:["המבנה המטריציוני (Matrix) — קונפליקט בין שני בוסים","המבנה המוצרי (Product) — כפילות פעילויות ואבטלה סמויה","מבנה ריכוזי (Centralized) — צוואר בקבוק בקבלת ההחלטות בצמרת","המבנה הפונקציונלי (Functional) — ניסיון צר וקושי בתיאום"],c:3,e:"שקף 6: חסרונות הפונקציונלי – קושי בתיאום בין מחלקות ומנהלים בעלי ניסיון צר. המרצה השתמשה בדיוק בדוגמאות אלה: 'הרדיולוג לא מדבר עם הרופא' [40:06] ו'תקרת זכוכית' – 'אני אורתופד, אין לי לאן לגדול' [42:26]."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"אילו שתי חברות הובאו במצגת כדוגמאות למבנה פונקציונלי (Functional), עם מחלקות כגון R&D, ייצור, מכירות ו-IT?",o:["אפל ונסטלה","דל ואמריקן אקספרס","טבע ואינטל","קוקה קולה וסמסונג"],c:2,e:"שקף 7: טבע (R&D, ייצור, QA, מכירות ושיווק, כספים) ואינטל (Design, IT, Manufacturing, Sales); המרצה [43:42]: 'טבע עובדת במבנה פונקציונלי מאוד ברור'. אפל ונסטלה – מוצרי; דל ואמריקן אקספרס – לקוח; קוקה קולה וסמסונג – גיאוגרפי."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"רשת כלבו מאורגנת לפי קטגוריות: תכשיטים, ריהוט, כלי בית וספורט, ולכל קטגוריה מנהל, צוות שיווק ורכש משלה. בסוף הרבעון המנכ\"ל רואה מיד שכל הקטגוריות צמחו למעט תכשיטים. יכולת זו היא ביטוי ל:",o:["יתרון המבנה המוצרי (Product) — הערכה קלה של ביצועי יחידות","יתרון המבנה הפונקציונלי (Functional) — מומחים מיומנים","חיסרון המבנה המוצרי (Product) — קושי בתיאום בין מחלקות","יתרון המבנה הגיאוגרפי (Geographic) — היענות לשווקים"],c:0,e:"שקף 9: Easier assessment of work-unit performance; המרצה בדוגמת המשביר לצרכן: 'קל לי מאוד לעלות על מגמות — 80% מהמחלקות עלו, רק תכשיטים ירד' [49:03]. הקושי בתיאום הוא חיסרון של אותו מבנה, אך השאלה מתארת יתרון."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"יזם שוקל לחלק את חברתו לחמש חטיבות מוצר עצמאיות, שלכל אחת אנשי שיווק, מכירות ורכש משלה. לפי המרצה, החיסרון הגדול ביותר שעליו לצפות הוא:",o:["אובדן ההתמחות המקצועית של העובדים בכל אחת מהחטיבות","כפילות תפקידים ובזבוז משאבים ('אבטלה סמויה')","קבלת החלטות איטית בתוך כל חטיבה","כפיפות של כל עובד לשני מנהלים במקביל"],c:1,e:"[49:45] 'החיסרון הגדול ביותר זה משאבים' – כפילות אנשי מקצוע בכל קטגוריה ו'אבטלה סמויה' (שקף 9: Duplication of activities). קבלת ההחלטות במבנה מוצרי דווקא מהירה, וכפיפות לשני מנהלים מאפיינת מטריצה."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"חברה שחטיבותיה מאורגנות סביב iPhone, Mac ו-Services, וחברה אחרת שחטיבותיה הן משקאות, מוצרי חלב, תזונת תינוקות ומזון לחיות מחמד, הן דוגמאות ל:",o:["מבנה מוכוון לקוח (Customer-oriented)","מבנה פונקציונלי (Functional)","מבנה מטריציוני (Matrix)","מבנה מוכוון מוצר (Product-oriented)"],c:3,e:"שקף 10: אפל (iPhone, Mac, Services) ונסטלה (Beverages, Dairy, Infant Nutrition, PetCare) – חלוקה לפי קווי מוצר. המרצה: 'מה שמוביל זה המוצר' [52:49], והדגישה מוצרים משלימים תחת קורת גג אחת."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"בחברת תקשורת המאורגנת לפי סוגי לקוחות (עסקי, ממשלתי, פרטי), מנהל הלקוחות הממשלתיים מפנה תקציבים חריגים כדי למנוע ממשרד ממשלתי לא רווחי לעבור למתחרה, על חשבון שאר הפעילויות. זהו חיסרון האופייני ל:",o:["מבנה פונקציונלי — היעדר מוכוונות עשייה (Action orientation) בקבלת החלטות","מבנה מוכוון לקוח — ריצוי לקוחות על חשבון פעילויות אחרות","מבנה גיאוגרפי — קושי בשליטה ובאחידות בין אזורים","מבנה מטריציוני — קונפליקטים בין שני הבוסים על הקצאת המשאבים והתקציבים"],c:1,e:"שקף 12: Efforts to satisfy customers may come at the expense of other activities. המרצה סיפרה על אלקטרה/תדיראן ומשרד האוצר: 'בגלל שהלקוח במרכז, לפעמים מוציאים יותר מדי תקציבים על לקוחות שהם לא רווחיים' [63:33]."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"דל (Dell), המחולקת לסגמנטים Consumer, Small business ו-Enterprise, ואמריקן אקספרס, המחולקת לצרכנים, עסקים קטנים ותאגידים, הן דוגמאות מהמצגת ל:",o:["מבנה מוכוון לקוח (Customer-oriented structure)","מבנה מוכוון מוצר (Product-oriented structure)","מבנה גיאוגרפי (Geography-oriented structure)","מבנה מטריציוני (Matrix-based structure)"],c:0,e:"שקף 13: Dell ו-American Express מחולקות לפי קבוצות לקוחות. המרצה [64:38]: 'כל אחד מהם זה מנהל אחר שעוסק בסגמנט אחר של הלקוחות', ובאמריקן אקספרס 'לכל אחד סל אחר של אפשרויות אשראי'."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"קוקה קולה מאפשרת למנהל אזור אירופה לשנות אריזות, מחירים ושיווק בהתאם לתרבות ולרגולציה המקומית, ולהגיב במהירות לשינוי בביקוש. היתרון המרכזי של המבנה הזה לפי המצגת הוא:",o:["צמצום כפילויות ברמת הארגון והורדת העלויות התפעוליות","ניהול יעיל של משימות גדולות ומורכבות במיוחד","היענות מהירה לדרישות של אזורי שוק שונים","מיקוד בצורכי הלקוח הבודד"],c:2,e:"שקף 15: Prompt responsiveness to the demands of different market areas (דוגמאות בשקף 16: קוקה קולה וסמסונג); המרצה: 'המנהל בכל אזור הוא מנהל מקומי, מכיר את השפה, התרבות וההעדפות' [68:15] – 'גלוקליזציה'. צמצום כפילויות הוא יתרון פונקציונלי, ומשימות מורכבות – מטריציוני."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"איזה מהבאים מופיע במצגת כיתרון של המבנה המטריציוני (Matrix-based structure)?",o:["כל עובד מדווח לממונה אחד בלבד","נדרשת רמת תיאום נמוכה יחסית בין המנהלים השונים","מנהלים בעלי ניסיון ניהולי רחב במיוחד בכל התחומים","מאגר משאבים — מומחיות זמינה לכל החטיבות"],c:3,e:"שקף 18: Pool of available resources (expertise available to all divisions), לצד ניצול יעיל של משאבים וניהול משימות גדולות ומורכבות; המרצה [78:35]: 'הרבה מאוד משאבים, ידע מקצועי והתמחויות'. במטריצה דווקא אין אחדות פיקוד ונדרש תיאום גבוה."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"בחברת הייטק שעברה למבנה מטריציוני, מהנדסת מדווחת גם למנהל המוצר וגם למנהל האזור, ומחלקת משאבי האנוש מוצפת בתלונות על סתירות בין הנחיות שני המנהלים. לפי המצגת, המענה המתבקש הוא:",o:["הגדלת מוטת הניהול (Span of management) של שני המנהלים","ביטול ההאצלה והחזרת הסמכות להנהלה הבכירה","הכשרה מוגברת ביחסי אנוש בשל הקונפליקטים בין הבוסים","מעבר למבנה גבוה (Tall) עם יותר רמות היררכיה"],c:2,e:"שקף 18: Conflicts between bosses – greater need for human relations training; המרצה: 'המון קונפליקטים, ומחלקת HR בארגונים כאלה חייבת לעבוד מאוד קשה לפשר' [79:49]."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"ב-P&G עובדים מדווחים גם ל-Category Manager (למשל טיפוח תינוקות) וגם ל-Regional Manager (למשל צפון אמריקה). דיווח כפול זה מאפיין:",o:["מבנה מוכוון מוצר (Product) עם מחלקות תמיכה","מבנה גיאוגרפי (Geographic) עם ביזור סמכויות","מבנה פונקציונלי (Functional) עם תיאום צולב","מבנה מטריציוני (Matrix) המשלב מוצר ואזור"],c:3,e:"שקף 19: P&G ו-GE מנהלות קטגוריות/חטיבות מוצר לצד אזורים גיאוגרפיים, והעובד מדווח לשני מנהלים. המרצה: 'רק במבנה מטריציוני יש שני בוסים' [83:56], ודוגמת חברתה שמנהלת פמפרס ב-P&G [74:55]."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"בגדוד חי\"ר, מ\"פ כפוף למג\"ד, שכפוף בעצמו למח\"ט. סטודנט בשיעור טען שזהו מבנה מטריציוני משום שלמ\"פ יש 'שני מפקדים' מעליו. לפי המרצה:",o:["זו שרשרת פיקוד (Chain of command) רגילה ולא מטריצה","הוא צודק — כל כפיפות לשני דרגים היא מטריציונית","זו הפרה של אחדות הפיקוד (Unity of command), ולכן זהו מבנה היברידי","זהו מבנה שטוח (Flat), כי מוטת השליטה של המח\"ט רחבה"],c:0,e:"[85:03]-[85:25]: 'אם יש לי גם מג\"ד וגם מח\"ט — זו שרשרת פיקוד רגילה'; מטריציוני הוא דיווח במקביל לשני מנהלים, למשל מנהל מוצר ומנהל גיאוגרפי, או בצבא 'אחד מקצועי ואחד פיקודי' [75:34]."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"'קו הסמכות המקשר את כל האנשים בארגון ומבהיר מי מדווח למי' — זו ההגדרה של:",o:["אחדות הפיקוד (Unity of command)","מוטת הניהול (Span of management)","שרשרת הפיקוד (Chain of command)","האצלת סמכויות (Delegation of authority)"],c:2,e:"שקף 21: Chain of command – the line of authority linking all persons, clarifying who reports to whom; המרצה: 'הקו האנכי שמחבר בין המנהל הגבוה ביותר לעובד' [84:48]. אחדות הפיקוד היא העיקרון שכל עובד מדווח לבוס אחד בלבד."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"יועץ ארגוני בודק חמישה ארגונים: פונקציונלי, מוצרי, לקוחי, גיאוגרפי ומטריציוני. באיזה מהם צפוי עיקרון אחדות הפיקוד (Unity of command) — כל עובד מדווח לבוס אחד — שלא להתקיים?",o:["בארגון הפונקציונלי, בגלל ריבוי המומחים","בארגון המטריציוני, שבו העובד מדווח לשני מנהלים","בארגון הגיאוגרפי, בגלל המרחק מההנהלה","בארגון המוצרי, בגלל כפילות התפקידים"],c:1,e:"שקף 21: Matrix-based organizations do not necessarily follow this principle. המרצה: 'בכולם למעט אחד יש שרשרת פיקוד... איפה הקו לא בדיוק קיים? במטריציוני' [84:42]. הצורך בשני אישורים בפונקציונלי הוא בעיית תיאום, לא כפיפות כפולה."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"איזה מהמשפטים הבאים על סמכות (Authority) תואם את המצגת?",o:["הסמכות מוקנית לאדם עצמו ועוברת איתו כשהוא מחליף תפקיד","הסמכות מוקנית לתפקיד הארגוני ומקובלת על הכפופים","הסמכות זורמת מלמטה למעלה, מהעובדים אל המנהלים שמעליהם","הסמכות היא הזכות הבלתי פורמלית להשפיע על אחרים"],c:1,e:"שקף 22: Authority is vested in organizational positions (not people), accepted by subordinates, and flows down the vertical hierarchy. סמכות היא זכות פורמלית לקבל החלטות, לתת הוראות ולהקצות משאבים."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"מנהלת מחלקה האצילה לראש צוות סמכות לאשר פיצויים ללקוחות עד 500 ש\"ח. לאחר תלונה על פיצוי שגוי, המנכ\"ל דורש הסברים. לפי המרצה, האחריות הסופית לתקלה מוטלת על:",o:["ראש הצוות, שכן יחד עם הסמכות עברה אליו גם מלוא האחריות לתוצאה","המנכ\"ל, שכן הסמכות זורמת מלמעלה למטה","אף אחד — אחריות וסמכות הם מושגים נפרדים","מנהלת המחלקה — היא האצילה סמכות, אך האחריות נשארת אצלה"],c:3,e:"[86:28]-[86:41]: 'תזכרו — בהאצלת סמכויות אני מסמיכה גורמים, אבל בסוף האחריות של מי? שלי'. אחריות וסמכות הם 'שני צידי המטבע' [85:35]; שקף 22: האצלה היא הענקת סמכות ואחריות ישירה לכפוף למשימות שהמנהל אחראי עליהן."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"לפי המצגת, כאשר חלק מהותי מהסמכות מועבר לדרגים נמוכים והחלטות 'נדחפות כלפי מטה', לעיתים קרובות:",o:["מיושמת סטנדרטיזציה של כללים ותהליכים","המבנה הופך גבוה (Tall) עם יותר רמות ניהול","מצטמצמת מוטת הניהול (Span) של כל מנהל","הסמכות חוזרת להנהלה הבכירה בעת שגרה"],c:0,e:"שקף 25: בביזור (Decentralization) 'often standardization of rules and processes is applied to solve problems'; המרצה: 'מי שמבזר חייב לקבוע סטנדרטיזציה — גבולות גזרה — ובקרה' [95:20]. ביזור אינו קשור בהכרח למספר רמות ההיררכיה."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"מנהל מוקד שירות ביזר סמכויות: כל ראש צוות רשאי לפצות לקוחות ולנהל תקציב משלו. כעבור חצי שנה מתברר שלקוחות דומים קיבלו פיצויים שונים בתכלית, ואחד הצוותים סיים את תקציבו השנתי באוקטובר. לפי המרצה, מה חסר?",o:["החזרת כל סמכויות הפיצוי והתקציב לידי המנהל","מעבר למבנה מטריציוני עם מנהל מקצועי נוסף לכל צוות","הגדלת מספר ראשי הצוותים כדי לפזר את הסיכון","סטנדרטיזציה (גבולות גזרה) ובקרה תקופתית"],c:3,e:"[95:16]-[96:02]: 'מי שמבזר סמכויות חייב לקבוע שני דברים: סטנדרטיזציה — פיצוי בין 200 ל-500 — ובקרה אחת לחודש/שבוע'; [100:32] דוגמת המנהל שסיים את התקציב באוקטובר. שקף 29: ביזור דורש מערכת בקרה ותקשורת נאותה."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"מנכ\"ל שנהג לבזר סמכויות נרחבות למנהלי הסניפים מרכז לפתע את כל ההחלטות הכספיות בידיו לאחר שהחברה נקלעה לסכנת קריסה. לפי המצגת והמרצה, התנהגות זו:",o:["סותרת את העיקרון שמידת הריכוזיות צריכה להתאים לאסטרטגיית החברה","צפויה — בזמן משבר או סיכון לכישלון הסמכות עשויה להתרכז בצמרת","שגויה — אי-ודאות גבוהה מחייבת דווקא ביזור","מעידה על מעבר ממבנה שטוח (Flat) למבנה גבוה (Tall) עם יותר דרגים"],c:1,e:"שקף 26: In times of crisis or risk of company failure, authority may be centralized at the top; המרצה: 'מנהל ביזורי — יש עכשיו משבר — אוטומטית הוא הופך להיות מנהל ריכוזי' [94:26]. אי-ודאות בסביבה (לא משבר פנימי) היא שמקושרת לביזור."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"לפי המצגת, שינוי ואי-ודאות גבוהים בסביבה העסקית קשורים בדרך כלל ל:",o:["ריכוזיות (Centralization) של הסמכות בצמרת","מבנה גבוה (Tall) עם מוטת ניהול צרה","ביזוריות (Decentralization) של הסמכות","חיזוק אחדות הפיקוד (Unity of command)"],c:2,e:"שקף 26: Greater change and uncertainty in the environment are usually associated with decentralization — הדרגים הקרובים לשטח מגיבים מהר (שקף 28: adaptable in situations of rapid change). ריכוזיות מקושרת דווקא לזמן משבר."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"מבנה ארגוני גבוה (Tall structure) מאופיין ב:",o:["מוטת ניהול צרה ורמות היררכיה רבות","מוטת ניהול רחבה ומעט רמות היררכיה בפיזור אופקי","ריכוז סמכות ההחלטה בהנהלה הבכירה","פיזור אופקי של המחלקות לפי אזורים"],c:0,e:"שקף 27: A tall structure has an overall narrow span and more hierarchical levels; מבנה שטוח (Flat) — מוטת ניהול רחבה ופחות רמות. גובה המבנה אינו זהה לריכוזיות – זו נוגעת למיקום סמכות ההחלטה ולא למספר הרמות."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"לפי הגישה המסורתית לעיצוב ארגונים המוזכרת במצגת, מוטת הניהול (Span of management) המומלצת היא כ:",o:["שלושה כפופים למנהל","שבעה כפופים למנהל","חמישה-עשר כפופים למנהל","עשרים כפופים למנהל"],c:1,e:"שקף 30: Traditional views of organization design recommended a span of management of about seven subordinates per manager. מוטת ניהול (span of control) = מספר העובדים המדווחים למנהל אחד."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"כל הבאים הם יתרונות של ביזוריות (Decentralization) לפי המצגת, למעט:",o:["מניעת עומס יתר על המנהל הבכיר","האצת החלטות תפעוליות באמצעות פעולה מקומית","הגברת תחושת האחריות של המנהלים בכל דרגי הארגון","הבטחת אחידות ביחס ללקוחות בכל היחידות"],c:3,e:"שקף 28 מונה: מניעת עומס על המנהל הבכיר, האצת החלטות תפעוליות, גמישות מקומית והגברת אחריות בכל הדרגים. אחידות ביחס ללקוחות היא דווקא בעיה של ביזור — שקף 29: 'Can lead to inconsistency of treatment of customers'."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"מצגת",q:"רשת מסעדות ביזרה סמכויות תפריט, תמחור וגיוס למנהלי הסניפים. תוך שנה חלק מהסניפים פרחו ואחרים נקלעו להפסדים, כי מנהליהם לא ידעו להתמודד עם האחריות. הכשל מדגים את הדרישה של הביזוריות ל:",o:["מוטת ניהול (Span of management) צרה יותר לכל מנהל","היצע מספק של מנהלים מוכשרים ובעלי מוטיבציה","ריכוז מחודש של הסמכות בהנהלה הבכירה","מעבר ממבנה גיאוגרפי למבנה פונקציונלי"],c:1,e:"שקף 29: Requires a plentiful supply of capable and well-motivated managers, able to respond to the increased responsibility; המרצה: 'לא תמיד יש לנו את המנהלים שאפשר לסמוך עליהם, אבל אם אתה מכשיר אותם...' [92:52]."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"סמנכ\"ל שכל אישור תקציבי בחברה עובר דרכו מדווח שהוא 'טובע בשוטף', שמנהלי המחלקות 'מרגישים חסרי אונים מול לקוחות', ושאין לו סגן שיוכל להחליף אותו. לפי המרצה, אלה תסמינים של:",o:["ריכוזיות יתר — צוואר בקבוק שאינו מצמיח מנהלים","ביזוריות יתר — היעדר סטנדרטיזציה ובקרה","מבנה מטריציוני — קונפליקט בין שני בוסים","מבנה פונקציונלי — מנהלים בעלי ניסיון צר"],c:0,e:"[89:39]-[92:44]: ריכוזיות יוצרת 'צוואר בקבוק', המנהל הוא 'פיבוט להכל', שירות הלקוחות נפגע, 'המבנה הריכוזי שוחק את המנהל — הוא לא מצמיח מנהלים'; בביזור 'המנהלים מתעסקים הרבה יותר באסטרטגיה ולא שוחים בשוטף' [97:14]."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"מנהלת אגף מחליטה: החלטות גיוס, לוחות זמנים ושיטות עבודה מועברות לראשי הצוותים, אך אישור התקציב נשאר בידיה בלבד. לפי הדיון בשיעור, גישה זו:",o:["פוגמת בעיקרון שריכוזיות צריכה להיות מלאה או אפסית","היא ביטוי להאצלה חלקית לגיטימית — 'לא 100 או 0'","יוצרת מבנה מטריציוני, כי לצוותים יש שני מקורות סמכות","נחשבת ריכוזיות מלאה, כי התקציב הוא הסמכות היחידה שחשובה"],c:1,e:"[93:08]-[93:21]: 'אתה יכול לבזר החלטות בנושאים מסוימים אבל תקציב זה רק בידיים שלך — דלגיישן זה האצלת סמכויות, אתה עושה דלגיישן רק לחלק, לא 100 או 0'; המרצה: 'יש אמצע, אתה יכול לנוע בין שתי השיטות' [94:09]."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"לפי המרצה, המבנה המטריציוני (Matrix) נקרא בעברית גם 'מבנה היברידי' או 'מבנה משולב' משום ש:",o:["הוא משלב ריכוזיות של ההנהלה הבכירה עם ביזוריות מלאה בדרגי הביניים והשטח","הוא משלב מבנה גבוה (Tall) עם מבנה שטוח (Flat)","הוא משלב שניים מסוגי המבנים האחרים, למשל מוצר ואזור גיאוגרפי","הוא משלב את ארבע הפונקציות הניהוליות בכל תפקיד"],c:2,e:"[73:30]-[73:46]: 'מבנה מטריציוני, או בעברית מבנה היברידי או מבנה משולב — שילוב של שני מבנים מבין המבנים שדיברנו עליהם: לקוח ומוצר, גיאוגרפי ופונקציונלי'. שקף 19: P&G – קטגוריות מוצר לצד אזורים גיאוגרפיים."},
{l:5,t:"מבנים ארגוניים",s:"זום",q:"עובד במבנה מטריציוני מתלונן: 'אני מסביר כל דבר פעמיים, שני המנהלים לא מכירים זה את זה, ובסוף השנה אני לא יודע מי קובע את הבונוס שלי'. לפי המרצה, מה שהעובד מתאר הוא:",o:["חסרונות מובנים של המטריצה — תיאום, שחיקה וקונפליקטים","כשל ביישום — במטריצה שמיושמת נכון כל עובד מדווח לממונה אחד בלבד","יתרון של המטריצה — מאגר משאבים (Pool of resources) זמין","תוצאה של מבנה גבוה (Tall) עם יותר מדי רמות היררכיה"],c:0,e:"[76:43]-[79:35]: 'הרבה פעמים המנהלים אפילו לא מכירים אחד את השני', 'צריך להסביר הכל פעמיים', 'שחיקה גבוהה — כמו ילד של גרושים', ו-[82:44] הערכת סוף שנה דורשת המלצות משני המנהלים. שקף 18: High level of coordination required; conflicts between bosses."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"בחברת סטרימינג כל עובד מקבל יעדים ומדדים (KPIs), אך מחליט בעצמו מה לעשות, איך וכמה, בלי לבקש אישורים. המרצה הביאה זאת כדוגמה ל:",o:["מבנה מטריציוני שבו כל עובד הוא גם מנהל","ריכוזיות המבוססת על בקרה הדוקה של ההנהלה באמצעות מדדים כמותיים","ביזור אחריות קיצוני שמעצב תרבות ארגונית של עצמאות","מבנה פונקציונלי המבוסס על מומחי תוכן עצמאיים בכל אחת מהמחלקות"],c:2,e:"[110:05]-[110:46]: נטפליקס — 'כל עובד הוא מנהל... יש לו KPIs ומדדים, אבל הוא מחליט מה, איך, כמה ולמה'; המרצה קישרה בין סגנון המנהל (ריכוזי/מבזר) לתרבות הארגונית — 'נקודה סופר חשובה' שתורחב בפרק תרבות ארגונית."},
{l:5,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"מנהל תחום תעבורה טוען שהוא חייב להיות 'ריכוזי ברמה מטורפת' כי טעות של כפוף עלולה לעלות בחיי אדם, בעוד מנהל מוקד שירות מבזר לנציגים סמכויות פיצוי. לפי המרצה, ההבדל ביניהם:",o:["מעיד שמנהל התעבורה סובל מפרפקציוניזם ומאגו ולכן אינו מסוגל לשחרר","זמני — כל ארגון נדרש בסופו של דבר להגיע לביזור מלא ולוותר על שליטה","משקף הבדל במוטת הניהול ולא במידת הריכוזיות","לגיטימי — מידת הריכוזיות תלויה בענף, בתחום וברגולציה"],c:3,e:"[98:26]-[98:49]: 'יש ארגונים שאתה לא יכול להיות ביזורי — הערה מצוינת — Centralization or Decentralization צריך להתאים לאסטרטגיה, תלוי בענף, בתחום, ברגולציה' (שקף 25-26); בדוגמת התעבורה [103:04] המרצה הסכימה: 'זה תחום שחס וחלילה...'."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"במפעל תרופות המחולק למחלקות R&D, ייצור, בקרת איכות ושיווק, מנהל בקרת האיכות מאשר בעצמו שחרור אצווה בלי לחכות לאישורים חיצוניים, מתוקף מומחיותו. תכונה זו מדגימה את יתרון המבנה הפונקציונלי המכונה:",o:["מוכוונות עשייה (Action orientation) של בעלי סמכות מקצועית","מאגר משאבים (Pool of resources) של מומחיות","היענות מהירה (Prompt responsiveness) לדרישות השוק","אחדות הפיקוד (Unity of command) של המבנה הפונקציונלי"],c:0,e:"שקף 6: Action orientation; המרצה: 'אני עכשיו הרופא — לא צריך אישור... אני בר סמכא' [41:46]; דוגמת טבע בשקף 7. מאגר משאבים שייך למטריצה והיענות לשווקים – לגיאוגרפי."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"'אוסף הפעילויות שהופך תשומות לתפוקות שהלקוחות מעריכים' — לפי שקף 3, זו ההגדרה של:",o:["מבנה ארגוני (Organizational structure)","תהליך ארגוני (Organizational process)","ארגון (Organization) — פריסת המשאבים","מחלוקה (Departmentalization)"],c:1,e:"שקף 3: 'Organizational process is the collection of activities that transforms inputs into outputs that customers value'. המבנה הארגוני הוא התצורה האופקית והאנכית של מחלקות, סמכות ותפקידים; והארגון (Organization) הוא פריסת המשאבים להשגת היעדים שנקבעו בתכנון."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"לפי שקף 'Departmentalization', מהם חמשת סוגי המחלוקה שנלמדו בשיעור?",o:["פונקציונלי, מוצר, לקוח, גיאוגרפי ומטריציוני","פונקציונלי, מוצר, לקוח, גיאוגרפי וצוותי","פונקציונלי, מוצר, לקוח, וירטואלי ומטריציוני","פונקציונלי, מוצר, מעגלי, גיאוגרפי ומטריציוני"],c:0,e:"שקף 4: Functional, Product, Customer, Geographic, Matrix. המבנה הצוותי, הווירטואלי והמעגלי הם 'מבנים חלופיים' (Alternate structuring options) שנלמדו בשיעור 6."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"לפי שקף 9, מה נכון לגבי המבנה המוכוון מוצר (Product-oriented structure)?",o:["יתרונותיו: צמצום כפילויות ומנהלים מקצועיים; חסרונו: קבלת החלטות איטית","יתרונותיו: הערכה קלה של ביצועי היחידות והחלטות מהירות; חסרונותיו: כפילות וקושי בתיאום","יתרונו: מאגר מומחיות הזמין לכל החטיבות; חסרונו: קונפליקטים בין שני בוסים","יתרונו: היענות מהירה לאזורי שוק שונים; חסרונו: מנהלים בעלי ניסיון צר"],c:1,e:"שקף 9 — Pros: Easier assessment of work-unit performance; Faster decision-making. Cons: Duplication of activities; Difficulties in cross-department coordination. צמצום כפילויות הוא יתרון הפונקציונלי, מאגר המומחיות — של המטריצה, וההיענות לאזורים — של הגיאוגרפי."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"סמסונג מפעילה מרכזים אזוריים נפרדים — סמסונג אירופה, סמסונג הודו — ולכל אחד צוותי שיווק, מכירות ושירות משלו. לפי שקף 15, מהם חסרונותיו של מבנה כזה?",o:["כפילות פעילויות וקושי בתיאום בין המחלקות","היענות איטית לדרישות של השווקים המקומיים","מנהלים בעלי ניסיון צר, שמכירים תחום אחד בלבד","קונפליקטים בין שני בוסים וצורך בהדרכה ביחסי אנוש"],c:0,e:"שקף 15 — המבנה הגיאוגרפי: Pros — Prompt responsiveness to the demands of different market areas; Cons — Duplication of activities; Difficulties in cross-department coordination. שקף 16 מביא את קוקה קולה ואת סמסונג כדוגמאות."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"לפי שקף 18, כל הבאים הם חסרונות של המבנה המטריציוני (Matrix), למעט:",o:["נדרשת רמה גבוהה של תיאום בין המנהלים","נדרשת רמה גבוהה של מיומנויות ניהול","קונפליקטים בין בוסים וצורך בהדרכה ביחסי אנוש","ניצול לא יעיל של משאבים וכפילות של מומחים"],c:3,e:"שקף 18 — Cons: High level of coordination required; High level of management skills required; Conflicts between bosses – greater need for human relations training. ניצול יעיל של המשאבים ומאגר מומחיות זמין לכל החטיבות הם דווקא יתרונות המטריצה."},
{l:5,t:"מבנים ארגוניים",s:"מצגת",q:"חברה מחלקת את פעילותה לפתרונות עסקיים, לפתרונות ממשלתיים ולפתרונות צרכניים (כמו בתרשים שבשקף 11). מהו היתרון המרכזי של מבנה כזה, לפי שקף 12?",o:["צמצום כפילויות והורדת עלויות","הערכה קלה של ביצועי קווי המוצר","מיקוד בצורכי הלקוחות השונים","היענות מהירה לאזורים גיאוגרפיים"],c:2,e:"שקף 12 — המבנה המוכוון לקוח: Pros — Focus on customer needs; Cons — Duplication of activities; Difficulties in cross-department coordination; Efforts to satisfy customers may come at the expense of other activities."},
]);

{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"לפי המרצה, מה פירוש המגמה 'FF' בעיצוב ארגונים בשנים האחרונות?",o:["Fast Fashion — התאמה מהירה של המבנה לטרנדים המשתנים בשוק","Flatter is Faster — פחות רמות ומנהלים, כדי שההחלטות יתקבלו מהר","Formal First — חיזוק הנהלים הכתובים לפני כל ביזור של סמכויות","Functional Focus — חזרה למבנה פונקציונלי שממקד את המומחיות"],c:1,e:"המרצה [42:56-43:22]: 'ללכת לכיוון ה-FF — לא Fast Fashion אלא Flatter is Faster. היום יש השטחה של ארגונים: פחות לבלים של ניהול, פחות רמות, פחות מנהלים, כדי שהחלטות יהיו יותר מהר — כשהן מבוזרות הן יותר מהירות'."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"המרצה, שמרבה לומר ש'ביזוריות היא העתיד', ביקשה 'לזכור' חריג אחד שהוא 'דבר מאוד מאוד חשוב'. מהו, ומה ההסבר?",o:["בזמן שינוי ואי-ודאות מרכזים הכל, כי המנהלים הזוטרים אינם מכירים את הסביבה","בזמן צמיחה מהירה מרכזים את הסמכויות, כדי לשמור על אחידות בין היחידות","בזמן משבר או סכנת כישלון מרכזים הכל למעלה, כי אין מרווח לטעויות","בארגונים קטנים תמיד מרכזים את ההחלטות, כי אין בהם דרג ביניים שיבצע אותן"],c:2,e:"המרצה [44:00-45:01]: בתקופות של שינוי ארגוני או אי-ודאות 'בדרך כלל אנחנו רוצים decentralization'; 'אבל תזכרו, שבזמנים של משבר או ריסק... אנחנו חייבים לרכז הכל אצלנו. למה? אין מרווח טעויות' (שקף 5: 'In times of crisis or risk of company failure, authority may be centralized at the top')."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"לפי המרצה, מה ההשלכה של השטחת הארגונים על המנהלים הזוטרים — גם בצבא?",o:["הם מאבדים סמכויות, כי בהשטחה ההחלטות עוברות אל ההנהלה הבכירה","תפקידם מתבטל, כי הבינה המלאכותית מקבלת את ההחלטות התפעוליות","הם עוברים לתפקידי מטה ללא אחריות על תקציבים או על כוח אדם","סמכויות ותקציבים שהיו פעם אצל רע״ן ורמ״ח נמצאים היום אצל רמ״ד"],c:3,e:"המרצה [46:18-48:42]: 'איזה כלים ושיטות צריך כדי שהיום מנהל זוטר מאוד יחזיק תקציבים גדולים ויקבל החלטות — לפני 10-15 שנה עשה את זה רע״ן ורמ״ח, היום עושה את זה רמ״ד'. גם בצבא 'הסמכויות של קמ״ד/רמ״ד היום היו לפני שנים בידיים של רמ״ח ורע״ן'."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"פעם, כדי לקבל אישור בבנק, היה צריך מורשה חתימה או את מנהל הסניף; היום כל בנקאי אישי מוסמך לכך. לפי המרצה, מה הסיבה?",o:["התחרות: אם הלקוח לא יקבל מענה מהר הוא יעבור לבנק אחר — ולכן מבזרים","רגולציה חדשה של בנק ישראל שחייבה את הבנקים לבטל את תפקיד מורשי החתימה","הבינה המלאכותית, שמקבלת כיום את רוב החלטות האשראי במקום הבנקאי בסניף","סגירת סניפים רבים, שהשאירה בבנקים הרבה פחות מנהלים"],c:0,e:"המרצה [48:56-49:25]: 'פעם היית צריך ללכת למורשה חתימה או למנהל הסניף; היום כל אחד מהבנקאים האישיים מוסמך לתת לך את זה. למה? כי רמת התחרות כזו גדולה שאני הולך לבנק אחר'. זוהי דוגמה לביזור סמכויות לדרג הזוטר."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"בדיון על השטחת ארגונים אמרה המרצה: 'המונח המקצועי שכל המנהלים צריכים לזכור'. מהו המונח, ומדוע הוא חשוב בהשטחה?",o:["מנהל כללי — כי בארגון שטוח כל מנהל אחראי על כמה תחומים במקביל","עתודה ניהולית — כי בהשטחה מגייסים מנהלים חדשים מבחוץ במקום הוותיקים","מוטת שליטה — כי בהשטחה כל מנהל חייב לנהל לפחות 12 עובדים","מומחה תוכן — השטחה אינה רק קיצוץ; בכל תפקיד צריך את בעל הידע"],c:3,e:"המרצה [50:58-52:27]: 'המונח המקצועי שכל המנהלים צריכים לזכור — מומחה תוכן. כשאתה משטיח זה לא שמקצצים תפקידים — אתה צריך לדאוג שבכל תפקיד יהיה חוד החנית עם הידע והמקצועיות', ורצוי גם 'מספר שתיים' בכל תפקיד כדי לא להיות תקוע."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"לפי המרצה, 'הביזוריות היום היא העולם — אבל' היא לא תעבוד כל עוד הארגון לא דאג לכמה תנאים. איזה מהבאים אינו אחד מהתנאים שמנתה?",o:["שינוי התרבות הארגונית לכזו שסומכת על הדרג הזוטר","מתן סמכות מתאימה יחד עם האחריות, ולא אחריות בלבד","מעבר למבנה מטריציוני שבו לכל עובד שני מנהלים","מנגנוני בקרה ושליטה, וכוח אדם מתאים לתפקידים"],c:2,e:"המרצה [60:29-60:57]: 'כל עוד הארגון לא שינה את התרבות הארגונית לכזו שסומכת על הדרג הזוטר, לא נתן סמכות עם אחריות, לא ביצע מנגנוני בקרה ושליטה, לא וידא שיש כוח אדם מתאים — זה לא יעבוד'. מעבר למבנה מטריציוני, שבו לכל עובד שני מנהלים, אינו אחד התנאים שמנתה — זהו סוג של מבנה ארגוני ולא תנאי לביזור."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"לקוח מתקשר לחברת תקשורת: ראש צוות אחד מפצה אותו ב-1,000 ש״ח, ולמחרת ראש צוות אחר אינו מפצה אותו כלל. לפי המרצה, מה מדגים המקרה?",o:["ריכוזיות יתר — ראשי הצוותים אינם מוסמכים להחליט על פיצויים","חוסר קונסיסטנטיות — ביזור בלי גבולות גזרה וסטנדרטים","מוטת שליטה צרה מדי — כל ראש צוות מנהל מעט מדי נציגים","מבנה מטריציוני — ראשי הצוותים מקבלים הנחיות סותרות משני מנהלים"],c:1,e:"המרצה [58:30-59:43], 'הנקודה החשובה': ביזוריות מובילה הרבה פעמים לחוסר קונסיסטנטיות ארגונית 'אם אין פרקטיקות, אם אין גבולות גזרה, אם אין סטנדרטים אחידים' — ארגון שטוח בלי גבולות גזרה 'מתנהל כמו שישה תתי-ארגונים'. שקף 8: 'Can lead to inconsistency of treatment of customers, especially in service industries'."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"לפי המרצה, מה הקשר בין בינה מלאכותית (AI) לבין ביזור סמכויות?",o:["AI מחייב ריכוזיות, כי רק ההנהלה הבכירה יודעת להפעיל אותו נכון","AI מייתר את הבקרה, ולכן בביזור כבר אין צורך במנגנוני שליטה","AI מאפשר בקרה מהירה, ולכן אפשר לבזר יותר סמכות לדרג הזוטר","AI הוא הגורם היחיד לביזור, שלא היה קיים כלל לפני שהופיע"],c:2,e:"המרצה [61:45-62:53]: 'ה-AI מאפשר לנו באמצעים טכנולוגיים מהירים לתת לדרג הזוטר יותר סמכות ואחריות, כי אנחנו יכולים לעשות הרבה יותר בקרה... הביזוריות הזאת קורית כבר 10-15 שנה; ה-AI מאיץ'."},
{l:6,t:"סמכות, ריכוזיות וביזור",s:"זום",q:"'המונח הבא שאתם צריכים לדעת' — מוטת שליטה (Span of control). לפי המרצה, מדוע מנכ״לים טובים מחזיקים רק כחמישה-שישה סמנכ״לים בכפיפות ישירה?",o:["כדי להיות נגישים וזמינים ולא להפוך לצוואר בקבוק שבו עובד מחכה שבועות","כדי לחסוך בשכר, כי כל סמנכ״ל נוסף מייקר מאוד את העלות של ההנהלה הבכירה בחברה","כי החוק מגביל את מספר הכפופים הישירים למנכ״ל של חברה ציבורית","כדי שההחלטות יתקבלו בידי מעטים, בלי ביזור לדרגים שמתחת"],c:0,e:"המרצה [63:19-64:52]: מוטת שליטה — 'כמה אנשים יש לי בכפיפות ישירה'; מחקרים מראים שמנהל יעיל מנהל כשבעה עובדים; 'מנכ״לים טובים: חמישה-שישה סמנכ״לים. למה? קשב... אתה לא רוצה להיות צוואר בקבוק, לא לאבד טאלנטים, לא שעובד יחכה שלושה שבועות כדי להיפגש איתך'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי השקפים על Siebel Systems, מה נכון לגבי המבנה של החברה?",o:["יש לה תרשים מטריציוני מפורט, שבו כל עובד כפוף גם למנהל מוצר וגם למנהל אזור","אין לה תרשים ארגוני פורמלי אך אפשר להסיק אותו, וכולם יודעים מיהו הלקוח","היא מחולקת לפי אזורים גיאוגרפיים, ולכל אזור מנהל עם סמכות מלאה","היא נשענת על שכבות ניהול רבות, שמבטיחות שכל החלטה עוברת אישור"],c:1,e:"שקף 11: 'Everyone in Siebel Systems has a clear understanding about who the primary customer is. Siebel Systems has no formal organization chart, but it can be inferred'. המרצה [70:01] הציגה את התרשים כ'מעגלים' — ובמרכזם הלקוח."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"מנהל ב-Siebel מספר שהוא תלוי במכירות, בתמיכה, בשיווק ובקבוצות מומחיות — ואף אחת מהן אינה כפופה לו. לפי הציטוט בשקף 13, איך בכל זאת מתאפשר התיאום?",o:["ההנהלה הבכירה מתאמת בין הפונקציות בישיבת מטה שבועית קבועה","כל פונקציה כפופה לשני מנהלים, כמו במבנה מטריציוני קלאסי ומוכר","נהלים כתובים ומפורטים מגדירים מראש מי אחראי על כל משימה","שביעות רצון הלקוח היא העדיפות הראשונה של כולם"],c:3,e:"שקף 13: 'Coordination happens because we all have customer satisfaction as our first priority. We are in constant communication and we are all given consistent objectives'. המרצה: 'אתם לא עובדים של המנהלים — עבור הלקוח'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי ההגדרה בשקף 24, מה נמצא במרכז המבנה המעגלי (Circular structure)?",o:["הלקוח, שסביבו מסודרות כל הפונקציות של הארגון","המנהלים הבכירים, שמפיצים את החזון החוצה בטבעות","הצוותים העצמאיים, שבוחרים בעצמם את הפרויקטים","הזכיינים, שמבצעים את המכירות ואת השירות"],c:1,e:"שקף 24: 'In the Circular structure executives are at the center, spreading their vision outward in rings grouped by function (managers, then specialists, then workers)'. שימו לב: בהצגת Siebel אמרה המרצה 'שימו לב מה נמצא במרכז — הלקוח' — אבל ההגדרה בשקף שמה במרכז את המנהלים."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 24, מהי הבעיה המרכזית של המבנה המעגלי?",o:["ריבוי שכבות ניהול וביורוקרטיה שמאטים את קבלת ההחלטות","כפילות של פעילויות זהות בין הטבעות השונות במבנה","העובדים עלולים לא לדעת למי הם מדווחים","תלות מוחלטת בספקים חיצוניים שמבצעים את עיקר הפעילות"],c:2,e:"שקף 24: 'The Circular structure has intuitive appeal for creative entrepreneurs and small firms. Employees are apt to be unclear about whom they report and who is running the show'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי השקף על W.L. Gore, איך נשמרת בחברה אחריותיות חזקה (Strong accountability), אף שאין בה שכבות ניהול?",o:["כל עובד כפוף למנהל צוות קבוע, שמעריך אותו פעמיים בשנה","המנכ״ל קובע אישית את השכר של כל עובד לפי מדדים כמותיים ואיכותיים","כל צוות מדווח לוועדת בקרה חיצונית על הביצועים שלו","השכר נקבע בפאנל עמיתים, וכל עובד נסקר בידי 20 עמיתים"],c:3,e:"שקף 15: 'Gore also builds on strong accountability — compensation is decided by a panel of peers and people are reviewed by at least 20 of their peers every year'. המרצה [75:01]: 'אני סומכת עליך, יש לך מדדים — אבל מותר לך לעשות הכל כל עוד אתה מביא כסף לחברה'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 15, כל הבאים מאפיינים את W.L. Gore, למעט:",o:["העובדים מחליטים מה הם רוצים לעשות","כל אחד יכול לקדם רעיון ולשכנע אחרים להצטרף","צוותים קטנים הם יחידת הפעולה, ואנשים בוחרים צוות","תרשים ארגוני מפורט עם תואר ברור לכל תפקיד"],c:3,e:"שקף 15: 'Employees decide what they want to do. Anyone can pursue an idea and persuade others to join. There are no management layers, few titles, and no organization charts. Small teams are the core operating unit. People choose which teams to work'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 17, מהו המבנה הווירטואלי (Virtual structure — נקרא גם Network או Modular)?",o:["ארגון ליבה קטן וריכוזי מאוד, שמוציא את הפונקציות העיקריות למיקור חוץ","ארגון גדול ומבוזר, שבו כל מחלקה פועלת כחברה עצמאית עם הנהלה ותקציב משלה","ארגון שכל עובדיו עובדים מהבית, אך כל הפונקציות מבוצעות בתוכו","ארגון שבו צוותים מועצמים מחליפים את המחלקות ומבטלים את ההיררכיה"],c:0,e:"שקף 17: 'a small, core organization that outsources major business functions... highly centralized, with little or no departmentalization'; הוא מצמצם תקורה בירוקרטית, והליבה היא קבוצת מנהלים קטנה שמתאמת עם הארגונים שמייצרים ומפיצים. שימו לב: 'ריכוזי מאוד' — לא מבוזר."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"ברשת מזון מהיר, המטה מחזיק את המנהלים, המערכות והמומחים, והמכירות והשירות מבוצעים בידי בעלי סניפים עצמאיים. לפי שקף 18, מה נכון לגבי צורה זו?",o:["זו צורת הסטארבורסט — חברת האם מפצלת פונקציה לחברת ספין-אוף עצמאית","זה מבנה צוותי — בעלי הסניפים עובדים בצוותים חוצי-ארגון","זו צורת הזכיינות, והזכיינים אף מתחרים על משאבי המטה","זה מבנה מטריציוני — כל זכיין כפוף גם למטה וגם למנהל האזור"],c:2,e:"שקף 18: בצורת ה-Franchise יש מנהלים, מערכות ומומחים בצומת הביצועי, והמכירות והשירות מבוצעים בידי יחידות זכיינות; 'franchises do not tend to collaborate or coordinate with one another and may actually be in direct competition for resources from the executive group' (מקדונלד'ס)."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 19, מהי צורת 'סטארבורסט' (Starburst) של המבנה הווירטואלי?",o:["חברת אם שמפצלת אחת מהפונקציות שלה לחברת ספין-אוף","רשת של זכיינים שמתחרים זה בזה על משאבי המטה","מבנה שבו המנהלים במרכז מפיצים את החזון בטבעות","מיזוג של כמה חברות קטנות לארגון גדול אחד"],c:0,e:"שקף 19: 'Starburst form is also a type of virtual structure, in which a parent firm splits off one of its functions into a spinoff firm'. זכיינים מתחרים — צורת ה-Franchise (שקף 18); מנהלים במרכז — המבנה המעגלי (שקף 24)."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 19, מהו החיסרון העיקרי של המבנה הווירטואלי?",o:["חוסר גמישות, שמקשה על יזמים קטנים להתחרות בחברות הגדולות","עלויות גבוהות של משרדים קבועים ושל תפקידים היררכיים","תקורה בירוקרטית גבוהה בגלל ריבוי מחלקות ושכבות ניהול","תפקידים, יעדים ואחריות לא ברורים, שמעודדים התנהגות פוליטית"],c:3,e:"שקף 19: היתרון המרכזי — גמישות, שמאפשרת ליזם עם רעיון ומעט כסף להתחרות בגדולים, וחיסכון במשרדים ובתפקידים היררכיים; 'The drawbacks are that roles, goals, and responsibilities are unclear, setting the stage for increased political behavior'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"איזה מהצירופים הבאים של חברה ומבנה ארגוני נכון לפי הדוגמאות בשקפי שיעור 6?",o:["GitLab — מבנה מעגלי (Circular)","Haier — מבנה וירטואלי (Virtual)","Spotify — מבנה מעגלי (Circular)","Wix — מבנה וירטואלי (Virtual)"],c:2,e:"שקף 25: Spotify (מודל Squads, Tribes, Chapters, Guilds) ו-Google — מבנה מעגלי. שקף 20: GitLab (אין משרדים, יותר מ-2,000 עובדים מרחוק) ו-Airbnb — וירטואלי. שקף 23: Haier (אלפי מיקרו-ארגונים) ו-Wix — מבנה צוותי."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"לפי המרצה, מה מרוויחות חברות כמו מקדונלד'ס או פז מכך שהן פועלות כמבנה וירטואלי עם זכיינים?",o:["שליטה ישירה בכל סניף, כי כל עובדי הסניפים הם עובדי החברה","פחות עובדים ותקורה, והעברת הסיכון וההפסדים לזכיין","אחידות מלאה בשירות, כי הזכיינים משתפים פעולה ביניהם באופן הדוק ומתמיד","ביטול הצורך במותג, כי כל זכיין בונה לעצמו מוניטין עצמאי"],c:1,e:"המרצה [76:03-77:16]: חברות שנראה שיש להן אלפי עובדים הן בפועל עובדי קבלן, אאוטסורסינג וזכיינים; 'אם אני זכיינית של סניף — ההפסדים הם שלי'. החברה וירטואלית: פחות עובדים, פחות HR, 'אבל המותג קיים', והיא מבזרת את האחריות והסיכון לזכיין."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 21, מה מאפיין את המבנה הצוותי (Team structure)?",o:["מחלקות פונקציונליות נשמרות, ולצידן נוספים צוותי פרויקט זמניים","ארגון ליבה קטן שמוציא את רוב הפעילות לספקים חיצוניים","צוותים מועצמים מחליפים את המחלקות, וההיררכיה והדרגות משוטחות","מנהלים במרכז מפיצים את החזון החוצה בטבעות, לפי פונקציה"],c:2,e:"שקף 21: 'This structure replaces departments with empowered teams'; הורדת גבולות אנכיים משטיחה את ההיררכיה ומצמצמת מעמד ודרגה; 'Cross-hierarchical teams, participative decision making practices, and the use of 360 degree performance appraisals'. דוגמה: Xerox, שמפתחת מוצרים בצוותים רב-תחומיים סביב תהליך."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 22, כיצד מתייחס המבנה הצוותי לגיאוגרפיה?",o:["כבסיס המרכזי לחלוקת הצוותים — צוות נפרד לכל אזור","כעניין טקטי-לוגיסטי יותר מאשר מבני, כדי לשבור מחסומי תרבות","כמגבלה, ולכן כל חברי הצוות חייבים לעבוד באותו אתר","כגורם שמחייב מנהל אזורי מעל כל צוות, כמו במטריצה"],c:1,e:"שקף 22: 'it considers geography as more of a tactical, logistical issue than structural one; The goal is to break down cultural barriers and open opportunities'. חלק מהארגונים אף יוצרים צוותים שכוללים לקוחות או ספקים."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"'תזכרו מה אני אומרת' — מה חזתה המרצה בהקשר של מבנים צוותיים ושטוחים, ומה לדבריה עלול לעכב זאת?",o:["הצבא יאמץ מבנה צוותי מלא עד 2030; מה שיעכב הוא התקציב","רוב החברות יחזרו למבנים היררכיים; מה שיעכב הוא חוסר הניסיון של הדור הצעיר","המבנה הווירטואלי ייעלם; מה שיעכב הוא הרגולציה על זכיינות","הילדים שלכם יהיו המנהלים של עצמם; מה שמעכב הוא התרבות הארגונית"],c:3,e:"המרצה [78:07-79:29]: המבנה הצוותי (כמו ב-Wix) הוא 'שינוי בתרבות הארגונית, שינוי בתפיסה של המנהלים'; 'גם אם אני מנהלת יחידה בצבא ואני נורא פתוחה — התרבות הארגונית לא מאפשרת את זה... תזכרו מה אני אומרת: הילדים שלכם יהיו המנהלים של עצמם, בארגונים שטוחים'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 26, מהו צמצום (Downsizing)?",o:["הרזיה שיטתית של הארגון: סגירת אתרים, צמצום עובדים או מכירת יחידות","העברה של פונקציות עסקיות לספקים חיצוניים, תוך שמירה על אותו מספר עובדים בארגון","קיצוץ רוחבי בשכר של כל העובדים, כדי להימנע מפיטורים בתקופת משבר","איחוד של שתי חברות, שבמהלכו מבוטלים תפקידים כפולים בהנהלה הבכירה"],c:0,e:"שקף 26: 'Downsizing is a systematic effort to make an organization leaner by closing locations, reducing staff, or selling off business units that don't add value'. ארגון רזה יכול להיות זריז ויעיל יותר — אם הקיצוצים נעשים בזהירות ומלווים את העובדים."},
{l:6,t:"מבנים חלופיים וצמצום",s:"מצגת",q:"לפי שקף 26, מה עלולה להיות ההשפעה של צמצום (Downsizing) על העובדים?",o:["עלייה אוטומטית במחויבות, כי העובדים שנשארו חשים שנבחרו","נסיגה פסיכולוגית ועלייה בתחלופה הרצונית","שיפור חד במוטיבציה, בזכות העלייה בסמכויות","אין לו השפעה על העמדות, רק על מספר העובדים"],c:1,e:"שקף 26: 'The impact of downsizing on organizational performance is not without controversy. Reducing the size of the workforce has effect on employee attitudes. Downsizing can also lead to psychological withdrawal and more voluntary turnover'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"לפי המרצה, מה הייתה התוצאה של הרה-ארגון ברשות המסים האמריקאית (IRS), שהוצג בשקף 'לפני ואחרי'?",o:["כפל תקנים ומשאבים, ששיפר מאוד את השירות לנישומים","אותו מספר תקנים, אבל בפריסה גיאוגרפית שונה לחלוטין","חצי מהתקנים ומהמשאבים — ובכל זאת תפעול טוב יותר","סגירת הרשות והעברת כל הגבייה לחברות פרטיות"],c:2,e:"המרצה [82:01]: 'ככה היה לפני X שנים, ככה הוא נראה היום... חצי מכמות התקנים, חצי מכמות המשאבים — והתפעול טוב יותר': ההכנסות, זמני התגובה, ושביעות הרצון לא ירדה. לפני הרה-ארגון נישומים לא הצליחו אפילו להשיג את הרשות בטלפון."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"הכלל הראשון ברה-ארגון של ה-IRS היה שקיפות מלאה — כולם ידעו מראש לאן הולך הארגון ואילו תפקידים ישתנו. לפי המרצה, מדוע זה כה חשוב?",o:["כי שקיפות מאפשרת לפטר מהר יותר, בלי התנגדות של העובדים","כי החוק האמריקאי מחייב גופים ממשלתיים לפרסם כל שינוי מבני","כי 90% מהכישלונות בשינוי ארגוני נובעים מחוסר שיתוף ושקיפות","כי שקיפות מייתרת את הצורך במיון ובהכשרה של המנהלים"],c:2,e:"המרצה [84:34-85:19]: 'כל ההנהלה ידעה זמן מראש מה הולך להיות המבנה... 90% מהכישלונות בשינוי ארגוני זה בגלל שלא משתפים ואין שקיפות' — 'לא אומרים 20% מהעובדים מקוצצים, אומרים: זה הארגון, לשם אנחנו הולכים'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"לפי תיאור המרצה, איזה מהבאים היה חלק מתהליך הרה-ארגון ב-IRS?",o:["פיטורים רוחביים של 20% מכל מחלקה, בלי הודעה מוקדמת לעובדים","קיצוץ שכר רוחבי לכל העובדים, כדי שאיש מהם לא יפוטר בתקופת השינוי","מנהלים התמודדו על שלושה תפקידים; מי שלא נבחר יצא עם פיצויים","העברת כל המנהלים לתפקידי מטה, בלי מיון ובלי הכשרה מקצועית"],c:2,e:"המרצה [85:05-88:08]: 'כל מנהל מקבל אופציה לבחור אחד מבין שלושה תפקידים, לדרג אותם ולהיבחן עליהם' מול 10-12 מועמדים; מי שנבחר עבר הכשרה והפך למומחה תוכן; ומי שלא — 'יצא בראש מורם' עם בונוסים ופיצויים גדולים, במקום ש'תפוחים רקובים' יישארו וישמיצו."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"לפי המרצה, מה קרה כשה-IRS הוציא בשלב מסוים את הגבייה עצמה לחברות חיצוניות (אאוטסורסינג)?",o:["הגבייה השתפרה מאוד, ולכן גם משרדי ממשלה אחרים העבירו את הגבייה החוצה במהירות","הנישומים איבדו אמון ('מי מתקשר אליי?'), והגבייה הוחזרה פנימה","החברות החיצוניות נכשלו מבחינה טכנית, והרשות תבעה אותן על הנזקים","הגבייה הועברה לבינה מלאכותית, והצורך בנציגים אנושיים בוטל לגמרי"],c:1,e:"המרצה [96:51-98:05]: 'ה-IRS בשלב מסוים הוציא את הגבייה עצמה לחברות אאוטסורסינג — ואתה מאבד את האמון: מי זה שמתקשר אליי?... היום החזירו את הגבייה חזרה'. זו דילמה של משרדי ממשלה רבים."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"שאלת דיון בשקף 28: בזמן משבר — לפטר חלק מהעובדים או לקצץ בשכר של כולם? מה סיכמה המרצה?",o:["תמיד עדיף קיצוץ רוחבי, כי הוא שומר על כל הידע והניסיון שנצברו בארגון","תמיד עדיף לפטר, כי קיצוץ שכר רוחבי פוגע במוטיבציה של כל העובדים","אין שחור-לבן: במשרדי ממשלה נוטים לקצץ רוחבית, ובעולם התחרותי מפטרים","ההחלטה נתונה לוועד העובדים בלבד, ולא למנהל או להנהלה הבכירה"],c:2,e:"המרצה [99:34-102:05]: 'זה מה שאוהבים לעשות במשרדי הממשלה בישראל — קיצוץ רוחבי; שאלה אם אתה סוציאליסט או קפיטליסט... אין שחור-לבן... בעולם התחרותי של היום הולכים דווקא על [פיטורים] ולא על אחוזים — אנחנו עולם פחות סוציאליסטי'."},
{l:6,t:"מבנים חלופיים וצמצום",s:"זום",q:"לפי הדיון בכיתה, איך משפיע צמצום על העובדים שנשארים — 'השורדים' (Survivors)?",o:["הם חשים ביטחון תעסוקתי גבוה יותר, כי 'עברו את הסינון'","הם מגבירים את שיתוף הפעולה ביניהם, כי נותרו פחות עובדים","הם אינם מושפעים, כי הצמצום לא פגע בהם באופן ישיר","הם מפוחדים ו'הולכים על קליפות ביצים' — זהירים ותחרותיים יותר"],c:3,e:"בדיון [102:06-103:27]: 'אנשים מרגישים יותר מפוחדים, הולכים על קליפות של ביצים; גם אם יש להם סמכות ואחריות הם צריכים להיות זהירים, יותר פחדנים, יותר תחרותיים אחד כלפי השני'. המרצה: 'המון אנשים נשארו מפחד — הם לא נכשלו, אבל גם לא הצליחו'."},
]);

{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"המרצה הציגה חמישה מודלים של מנהיגות. אילו שניים מהם הגדירה כ'המרכזיים שאני רוצה להעביר לכם' — עכשוויים יותר, ואינם נלמדים בקורס המנהיגות המקביל?",o:["גישת התכונות ושריג בלייק-מוטון","תיאוריית נתיב-מטרה ו-LMX","LMX ואינטליגנציה רגשית (EI)","שריג בלייק-מוטון ואינטליגנציה רגשית"],c:2,e:"המרצה [13:52-14:25]: שלושה מהמודלים — תכונות, השריג ונתיב-מטרה — 'לימור תיגע איתכם', 'שניים נוספים לא, והם המרכזיים שאני רוצה להעביר לכם'. ב-[48:01]: 'בשנים האחרונות שני מודלים... א' גישת ה-LMX, ב' הגישה של ה-EI'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"לפי הטבלה בשקף 'Leaders Vs. Managers', איזו מההתאמות הבאות נכונה?",o:["מנהיגים — Do things right; מנהלים — Do the right thing","מנהיגים — שומרים על הסטטוס קוו; מנהלים — מובילים שינוי","מנהיגים — מתמקדים באמצעים (Means); מנהלים — במטרות (Ends)","מנהיגים — אדריכלים (Architects); מנהלים — בנאים (Builders)"],c:3,e:"שקף 4 — מנהיגים: Do the right thing, Change, Long-term, Ends, Architects, Motivating and inspiring. מנהלים: Do things right, Status quo, Short-term, Means, Builders, Problem solving. המרצה: מנהיגים 'מעצבים, משנים ומגדירים לאן הם רוצים להגיע'; מנהלים צריכים 'מערכת שתיתן להם את הכלים'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"לפי הטבלה בשקף 4, איזה צמד מאפיינים שייך למנהלים (Managers) ולא למנהיגים?",o:["פתרון בעיות (Problem solving) וטווח קצר (Short-term)","הנעה והשראה (Motivating and inspiring) וטווח ארוך","התמקדות במטרות (Ends) והובלת שינוי (Change)","עשיית הדבר הנכון (Do the right thing) ועיצוב הכיוון"],c:0,e:"שקף 4: מנהלים — Do things right, Status quo, Short-term, Means, Builders, Problem solving. המרצה [16:55-17:34]: מנהלים 'זקוקים ל-Means, לאמצעים — לסמכות, לתקציב, למערכות... אנחנו קוראים להם Builders' והם 'יודעים לפתור בעיות'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"המרצה הביאה את דפני ליף, שהובילה את מחאת האוהלים בלי כסף, בלי סמכות ובלי תפקיד מוגדר. מה ביקשה להמחיש?",o:["מנהיגות אמיתית מחייבת קודם כל תפקיד פורמלי וסמכות מוגדרת מלמעלה בארגון","מנהיגים אינם זקוקים לסמכות או לתקציב — יש להם חזון ואג'נדה","מחאה ציבורית היא דוגמה לניהול משברים ולא למנהיגות של ממש","כל מנהל טוב הוא בהכרח גם מנהיג, ולכן אין צורך להבחין ביניהם"],c:1,e:"המרצה [18:43-19:53]: 'לא היה כסף, לא הייתה סמכות, אף אחד לא הגדיר לה תפקיד — והיא הובילה מחאה שזעזעה... המנהיגים לא צריכים תקציב, לא סמכות מלמעלה, לא הרשאה — יש להם אג'נדה, יש להם חזון'. ומיד אחר כך: האם כל מנהל הוא מנהיג? 'התשובה היא לא'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"לפי שקף 'Leadership Traits', כל הבאות הן תכונות של מנהיגים, למעט:",o:["דחף (Drive) ורצון להוביל (Desire to lead)","יושר ויושרה (Honesty and Integrity)","צייתנות לנהלים ולהוראות (Compliance)","יציבות רגשית (Emotional stability)"],c:2,e:"שקף 5 מונה שבע תכונות: Drive, Desire to lead, Honesty and Integrity, Self confidence, Emotional stability, Cognitive ability, Knowledge of the business. צייתנות אינה ביניהן — המרצה תיארה מנהיגים ככאלה שמובילים שינוי ולא שומרים על הקיים."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"המרצה שאלה: 'מבין כל התכונות של המנהיג, איזו הכי קל להשתפר בה — במיוחד בעידן של היום?'. מה הייתה התשובה?",o:["ביטחון עצמי — כי אפשר לבנות אותו בהכשרות, בתרגול ובחניכה אישית","יציבות רגשית — כי היא תלויה בעיקר בתנאי העבודה ובאווירה בצוות","דחף — כי תגמול נכון ומדויק מייצר אותו כמעט אצל כל אחד מהעובדים","ידע בעסק — כי הידע זמין לכולם, והכישרון הוא להשתמש בכלים"],c:3,e:"המרצה [28:10-28:53]: 'בעידן של היום, הידע שלי זה הידע שלך, הכישרון הוא להביא את התוצר — לדעת להשתמש בכלי הנכון בפלטפורמה' (Knowledge of the business). 'את כל הדברים האחרים יחסית יותר קשה לשנות'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"לפי המרצה, מה ההנחה של גישת התכונות (Traits) לגבי תכונות המנהיג?",o:["הן נרכשות בעיקר בהכשרה, ולכן כל אדם יכול להפוך למנהיג","הן תלויות במצב, ולכן אותו אדם מנהיג במצב אחד ולא במצב אחר","הן בעיקר מולדות — אפשר לשפר מעט, אבל לא 'מאפס למאה'","הן נקבעות לפי היחסים עם הכפיפים, ולכן משתנות מכפיף לכפיף"],c:2,e:"המרצה [20:29-21:03, 25:15-25:48]: 'נקודת ההנחה שהן מולדות... אי אפשר לעבור מ-0 ל-100. מי שנולד עם DNA שהוא אנטיתזה למנהיגות — לא נצליח להפוך אותו גם בהכשרות'. התלות במצב שייכת לנתיב-מטרה, והיחסים עם כל כפיף — ל-LMX."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"על אילו שני צירים בנוי שריג המנהיגות של בלייק ומוטון (Blake Mouton Leadership Grid)?",o:["סמכות פורמלית ואחריות אישית","ריכוזיות וביזוריות של סמכויות","אסרטיביות ושיתוף פעולה","דאגה למשימה ודאגה לאנשים"],c:3,e:"המרצה [29:21-29:47]: 'מודל השריג... מטריצת המנהיגות. שני צירים: ציר משימתיות מול ציר כוח אדם' (ציר X — משימה, ציר Y — אנשים). הם מקבילים לשתי הגישות ההתנהגותיות: Initiating structure ו-Consideration. אסרטיביות ושיתוף פעולה הם צירי מודל תומס-קילמן לקונפליקטים."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"בצוות של מנהל מסוים תמיד כיף: גיבושים, הקשבה לכולם ועבודת צוות — אבל המשימות מתפספסות. לפי השריג של בלייק ומוטון, כיצד מכונה סגנונו?",o:["Country Club — גבוה בדאגה לאנשים ונמוך בדאגה למשימה","Impoverished — נמוך גם בדאגה לאנשים וגם בדאגה למשימה","Middle of the road (5,5) — איזון חלקי בין שני הצירים","Team management (9,9) — גבוה בשני הצירים גם יחד"],c:0,e:"המרצה [30:33-31:45]: 'קאנטרי קלאב לידר: כיף, חבר'ה, עבודת צוות, הרבה גיבוש, מקשיבים לכולם — אבל מה קורה הרבה פעמים? מפספסים את המשימה'. זו הפינה השמאלית העליונה: 'מאוד גבוה בכיף, נמוך במשימתיות'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"בהסבר על השריג של בלייק ומוטון, אילו מנהלים כינתה המרצה בסלנג המקצועי 'עציצים'?",o:["הגבוהים בשני הצירים (9,9), שנראים מושלמים אך אינם מתפתחים","הגבוהים מאוד במשימה ונמוכים מאוד בדאגה לאנשים שלהם בצוות","הגבוהים בדאגה לאנשים ונמוכים בדאגה למשימה ולתוצאות","הנמוכים בשני הצירים — 'מנהלים שבמקרה הגיעו' לתפקיד"],c:3,e:"המרצה [30:54-31:45]: 'לא טוב להיות באף אחת מהפינות' — והפינה השמאלית התחתונה, נמוכה גם במשימה וגם באנשים: 'בסלנג המקצועי קוראים להם עציצים — מנהלים שבמקרה הגיעו' (Impoverished)."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"לפי המרצה, לאן בשריג של בלייק ומוטון 'רוצים להצמיח' מנהלים, ומה המסר היישומי?",o:["לפינה המשימתית (9,1), כי בסוף רק התוצאות הן שקובעות","מ-5,5 עד 9,9 — לאזן בין המשימה לאנשים, ולחזק את הצד החלש","לפינת ה-Country Club (1,9), כי אנשים מרוצים מבצעים יותר","לאמצע השריג בלבד (5,5), כי כל נטייה לצד אחד מסוכנת"],c:1,e:"המרצה [31:47-33:52]: 'המודלים שאותם אנחנו רוצים להצמיח — מ-5,5 עד 9,9 — אנשים שיודעים לאזן בין השניים'; 'כל מנהל צריך לדעת במה הוא יותר חזק ואיפה הוא חלש, ואיפה שהוא חלש לקבל הכשרות'. 'מאוד חשוב להיות משימתי — אבל חשוב לזכור שאנחנו מנהלים אנשים ולא מכונות'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"בתרגיל 'יועצים ארגוניים' הוצג מפקד מקצועי ומשימתי מאוד, שהאנשים שלו שחוקים. איזו עצה נתנה המרצה, כיועצת ארגונית?",o:["להחליף את המפקדים הזוטרים באנשים חמים יותר, שיפצו על המפקד","להעלות את היעדים המשימתיים, כדי שהצוות יתמקד בעבודה ולא בקשיים","לבחור סגן שהוא '180 מעלות' ממנו — שישלים את הצד החלש שלו","לשלוח את הכפופים לקורס חוסן, במקום לשנות את סגנון הפיקוד"],c:2,e:"בתרגיל [36:02-37:00] סטודנטים הציעו 'לרדת מהעץ' ולצאת לשטח, ולשים לצידו סגן שיעזור לו 'לחבק את האנשים'. המרצה: 'כיועצת ארגונית, אם יש מנהל שרוצה סגן, אני אומרת לו: קח סגן שהוא 180 מעלות ממך' — אם אתה כאן, הוא יאזן אותך שם."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"מנהלת מקפידה על לוח זמנים מפורש, נותנת הוראות ברורות, מדגישה תכנון ודדליינים ומכוונת את פעילות הכפיפים ליעד. לאיזו גישה התנהגותית היא שייכת?",o:["התחשבות (Consideration) — התנהגות מוכוונת אנשים","מבנה יוזם (Initiating Structure) — התנהגות מוכוונת משימה","מנהיגות משתפת (Participative) — אחד מסגנונות נתיב-מטרה של אבנס והאוס","חילופי מנהיג-חבר (LMX) — בניית יחסים דיאדיים"],c:1,e:"שקף 8: Initiating Structure — 'Task-oriented behavior: Directs subordinates work activities toward the goal; Gives instructions; Emphasizes planning and deadlines; Provides explicit schedule of work'. שקף 7: Consideration — קשב לכפיפים, אמון הדדי ועבודת צוות."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"מי פיתחו את תיאוריית נתיב-מטרה (Path-Goal), ומה הרעיון המרכזי שלה, לפי המרצה?",o:["בלייק ומוטון (שנות ה-60) — מיקום המנהל על שני צירים קבועים","אבנס והאוס (שנות ה-70) — התאמת הסגנון למצב ולמשימה","דניאל גולמן — המנהיג מזהה את רגשותיו ואת רגשות האחרים","נורת'האוס — המנהיג בונה יחסים דיאדיים עם כל כפיף בנפרד"],c:1,e:"המרצה [40:01-41:01]: 'המודל בשנות ה-70 של אבנס והאוס... מודל נתיב-מטרה: בהתאם ליעד, בהתאם לתנאים, בהתאם למשימה — אני מתאים, משנה ומנרמל את ההתנהגות או את הסגנון שלי'. 'Path זה נתיב ו-Goal זה מטרה'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"מג״ד שפלוגתו חזרה מפעילות קשה, שבה נפצעו לוחמים, הופך לנגיש, פותח את דלתו, מתמקד פחות במשימה ומנסה 'להרגיש' את האנשים. לפי תיאוריית נתיב-מטרה, באיזה סגנון הוא נוקט?",o:["מנהיגות תומכת (Supportive)","מנהיגות דירקטיבית (Directive)","מנהיגות משתפת (Participative)","מנהיגות הישגית (Achievement-oriented)"],c:0,e:"המרצה [42:01-43:01], מסיפורי מג״דים: 'חוזרים מפעילות קשה... אנחנו המנהיגים התומכים — נגישים, פתוחים, פחות משימתיים'. שקף 9: Supportive — 'Shows concern for subordinates; Approachable, open and friendly; Creates a team climate; Treats subordinates as equals'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"אותו מג״ד תומך ונגיש אחרי אירוע קשה, אך ברור, ממוקד ודירקטיבי כשהוא יוצא למשימה מבצעית. לפי אבנס והאוס, מה זה מבטא?",o:["חוסר עקביות בסגנון, שפוגע באמון של הכפיפים במפקד","מעבר מ-Country Club לסגנון המשימתי (9,1) בשריג","LMX גבוה עם חלק מהכפיפים ונמוך עם האחרים","ורסטיליות — מנהיג טוב משנה סגנון לפי המצב והמשימה"],c:3,e:"המרצה [46:00]: 'מנהל טוב הוא מנהל שיודע להיות ורסטילי — כתלוי במצב, בתנאים, בסביבה, בכפיפים... אתה לא רק משימתי או חברתי, אלא פר סיטואציה'. והמג״ד הדירקטיבי [43:01]: 'שם את האפוד הקרמי... סופר מפוקס במשימה, יש יעדים, סטנדרט, כללים'."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"זום",q:"מנהל תיכון בתל אביב אומר למוריו: 'כל מורה הוא מבחינתי מנהל — בכיתה ובמקצוע שלך תחליט מה, איך וכמה, כל עוד התלמידים יהיו מוכנים'. לפי נתיב-מטרה, באיזה סגנון הוא נוקט?",o:["מנהיגות תומכת (Supportive)","מנהיגות משתפת (Participative)","מנהיגות דירקטיבית (Directive)","מנהיגות הישגית (Achievement-oriented)"],c:1,e:"המרצה [43:01-45:00], על מנהל תיכון שמיר: 'הוא דוגל במנהיגות בעיקר הפרטיסיפטיבית, שאומרת: אתה תחליט מה בתוך העולם שלך'. שקף 10: Participative Leadership — 'Consults with subordinates about decisions'. היא הוסיפה שבבית ספר אפשר להיות משתף יותר מאשר בצבא."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"חברת ביטוח מציבה לסוכניה יעדים מאתגרים ומדגישה ביצועים באיכות גבוהה. לפי תיאוריית נתיב-מטרה, איזו מנהיגות זו?",o:["מנהיגות תומכת (Supportive) — דאגה ויחס שוויוני","מנהיגות משתפת (Participative) — התייעצות","מנהיגות הישגית (Achievement-Oriented)","מנהיגות דירקטיבית (Directive) — הוראות מפורשות"],c:2,e:"שקף 10: Achievement-Oriented Leadership — 'Defines challenging goals for subordinates; Stresses high-quality performance'. המרצה [45:00] הביאה דוגמאות מחברות ביטוח (הראל, ביטוח ישיר, מגדל) והעירה שהסגנון מזכיר את ציר ה-X ואת המנהיגות הדירקטיבית."},
{l:7,t:"מנהיגות: תכונות והתנהגות",s:"מצגת",q:"לפי שקפים 9-10, מה מאפיין את המנהיגות הדירקטיבית (Directive) בתיאוריית נתיב-מטרה?",o:["הדרכה מפורשת מה בדיוק לעשות: תכנון, יעדי ביצוע וסטנדרטים","התייעצות עם הכפיפים לפני קבלת ההחלטות בנושאים שלהם","דאגה לכפיפים, נגישות ויצירת אקלים צוותי חם","הצבת יעדים מאתגרים והדגשת ביצועים באיכות גבוהה"],c:0,e:"שקף 9: Directive Leadership — 'Instructs and tells subordinates exactly what to do; Planning, setting performance goals, and behavior standards'. התייעצות — Participative; דאגה ונגישות — Supportive; יעדים מאתגרים — Achievement-oriented."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי תיאוריית LMX (Leader-Member Exchange), במה מתמקד תהליך ההנהגה?",o:["בתכונות המולדות של המנהיג, שקובעות אם יצליח להוביל","בהתאמת סגנון המנהיג לסוג המשימה ולתנאי הסביבה","בקבוצה כולה, ולא ביחסים של המנהיג עם כל פרט בה","ביחסים הדיאדיים בין המנהיג לכל אחד מהכפיפים"],c:3,e:"שקף 11: LMX רואה במנהיגות 'a process that is focused on the interactions between a leader and subordinates' (Northouse, 2010); 'Unlike other approaches, which focus on the group level, the LMX theory focuses on an interactive relationship'. שקף 12: 'LMX theory makes the dyadic relationship between leaders and followers the focal point'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"לפי המרצה, מה מייחד את גישת ה-LMX לעומת גישות המנהיגות הקודמות שנלמדו בשיעור?",o:["היא מתמקדת רק במנהיג: בתכונותיו ובסגנון ההתנהגות שלו","לראשונה מסתכלים גם על המונהגים — יחסים הדדיים","היא קובעת סגנון אחד קבוע שמתאים לכל הכפיפים ולכל המצבים בארגון","היא מחליפה את המנהיג בצוות שמנהל את עצמו, ללא ממונה"],c:1,e:"המרצה [48:01-50:00]: 'איך אני בונה יחסים דיאדיים, דו-כיווניים, עם המונהגים... גם נותן וגם מקבל מכל אחד מהכפיפים'; 'המילה היא הדדיות'; 'זו פעם ראשונה שגישת מנהיגות לא הסתכלה רק על המנהיג, אלא מי המונהגים — הפולוורס — מה מאפיין אותם ואיך בונים איתם יחסים'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי תיאוריית LMX (שקף 13), מה מאפיין את קבוצת הפנים (In-group)?",o:["הם פחות מתאימים למנהיג, מגיעים, עושים את עבודתם והולכים הביתה","הם מקבלים מהמנהיג רק את מה שמוגדר בחוזה העבודה, ולא יותר","הם מקבלים יותר מידע, השפעה, אמון ודאגה, ומעורבים ותקשורתיים יותר","הם עובדים חדשים, שהמנהיג עוד לא הספיק ליצור איתם קשר אישי"],c:2,e:"שקף 13: In group — 'more information, influence, confidence and concern from the leader, highly involved and communicative than out-group'; Out group — 'less compatible with leader, usually just come to work, do their work and go home'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"המרצה כינתה את קבוצת הפנים (In-group) ב-LMX 'אנשי המפקד'. מהי, לדבריה, השאיפה של מנהל ביחס לקבוצה הזו?",o:["להרחיב אותה — שיותר עובדים יעשו מעבר למה שכתוב בחוזה","לצמצם אותה, כדי שהעובדים האחרים לא ירגישו מופלים","לשמור אותה קטנה ואיכותית, כדי שתישאר קבוצת עילית","לבטל אותה, כי כל העובדים צריכים לקבל יחס זהה"],c:0,e:"המרצה [61:01-62:01]: 'In-Group זה אנשי המפקד... הם עושים מעבר למה שכתוב בחוזה'; 'בכל ארגון, השאיפה שלנו כמנהלים זה להרחיב את המעגל' — וככל שהמנהל פתוח יותר ומתאים את עצמו לכל כפיף ('חנוך לנער על פי דרכו'), המעגל גדל והביצועים עולים."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי שקף 14, כל הבאים הם תוצאות של יחסי LMX איכותיים (High-quality leader-member exchanges), למעט:",o:["תחלופה נמוכה יותר של עובדים","קידום תכוף ומהיר יותר בקריירה","מחויבות ארגונית גבוהה יותר","פחות תשומת לב ותמיכה מהמנהיג"],c:3,e:"שקף 14: Less employee turnover; More positive performance evaluations; Higher frequency of promotions; Greater organizational commitment; Better job attitudes; More attention and support from the leader; Greater participation; Faster career progress."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי Harris, Wheeler & Kacmar (2009) בשקף 16, מהם החסרונות לעובד ביחסי LMX נמוכים?",o:["יחס מועדף, תקשורת עניינית ומשוב תכוף על הביצועים","אמון ותמיכה מוגבלים מהממונה, ומעט הטבות מעבר לחוזה","עומס יתר של משימות, כי המנהיג סומך עליו יותר מאחרים","נגישות גבוהה מדי לממונה, שפוגעת בעצמאות של העובד"],c:1,e:"שקף 16: Disadvantages of low LMX — 'Limited trust and support from supervisors; Few benefits outside the employment contract'. יחס מועדף, תקשורת ומשוב ונגישות לממונה הם דווקא היתרונות של LMX גבוה (שקף 15)."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"בדיון על LMX סיפרה המרצה על נטפליקס, שביטלה את מכסת ימי החופשה: 'קחו כמה שאתם רוצים — אבל תגיעו לביצועים הטובים ביותר'. מה קרה בפועל?",o:["העובדים ניצלו את ההסדר, והחברה חזרה למכסה קבועה","הביצועים נשארו זהים, אבל שביעות הרצון של העובדים עלתה","העובדים לקחו חופש לא יותר מבעבר — והביצועים רק עלו","רק המנהלים הבכירים נהנו מההסדר, והעובדים לא השתמשו בו"],c:2,e:"המרצה [50:00-51:01]: 'מה קרה אחרי שנתיים, ארבע ושש? אנשים לקחו עשרים, עשרים וחמישה ימי חופש בשנה, או שניים או עשרה — והביצועים רק עלו'. המסר: 'ככל שתגביל אותו פחות' — עם יעדים ברורים — הוא יהיה טוב יותר; 'from managers to coaches'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי שקף 17, מהי אינטליגנציה רגשית (Emotional Intelligence)?",o:["היכולת הקוגניטיבית לראות את הארגון כמערכת שלמה ולפתור בעיות מורכבות","כישורים ויכולות לא-קוגניטיביים שמשפיעים על ההתמודדות עם לחצים","מידת ההצלחה של אדם במבחני אינטליגנציה ובלימודים אקדמיים","היכולת להפעיל סמכות פורמלית בלי לעורר התנגדות אצל הכפיפים"],c:1,e:"שקף 17: 'A combination of non-cognitive skills, competencies and capabilities which influence a person's ability to cope with environmental demands and pressures'; וגם 'Ability to perceive and express emotions to facilitate thinking' (Mayer, Salovey & Caruso, 2000). ראיית הארגון כמערכת היא המיומנות הקונספטואלית של קאץ."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי שקף 18, כל הבאים הם ממדים של אינטליגנציה רגשית, למעט:",o:["מודעות עצמית לרגשות (Self-awareness)","ניהול עצמי (Self-management)","אמפתיה לרגשות של אחרים (Empathy)","יכולת קוגניטיבית (Cognitive)"],c:3,e:"שקף 18 מונה חמישה ממדים: Self-awareness, Self-management, Self-motivation, Empathy, Social skills. יכולת קוגניטיבית היא אחת מתכונות המנהיג בגישת התכונות (שקף 5) — ודווקא האינטליגנציה הרגשית היא 'לא-קוגניטיבית'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"מג״ד רואה טעות של מ״פ ונוזף בו בחריפות מול כל הקצינים והפקודים. לפי המרצה, איזה ממד של אינטליגנציה רגשית חסר לו?",o:["ניהול עצמי (Self-management) — 'אורך הפתיל', לספור עד עשר","מודעות עצמית (Self-awareness) — לזהות את מצבי הרוח שלו","מוטיבציה עצמית (Self-motivation) — להיות מונע מבפנים","כישורים חברתיים (Social skills) — לבנות רשת של קשרים"],c:0,e:"המרצה [83:00-84:03]: המרכיב השני 'בסלנג — אורך הפתיל: האם אני יודע לספור עד עשר'; המג״ד 'מול הקצינים שלו משפיל את המ״פ... כי הוא לא מצליח לספור עד עשר'. שקף 18: Self-management — 'the ability to control impulses and moods, and to think before acting'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"המרצה סיפרה שאחותה יודעת על עצמה ש'כשהיא רעבה — אין עם מי לדבר'. איזה ממד של אינטליגנציה רגשית מדגים הדבר?",o:["אמפתיה (Empathy) — להבין את המניעים של האנשים שמולך","ניהול עצמי (Self-management) — לשלוט בדחפים ולחשוב לפני שפועלים","מודעות עצמית (Self-awareness) — לזהות את מצבי הרוח שלך ואת השפעתם","מוטיבציה עצמית (Self-motivation) — לפעול מתוך דחף פנימי ולא בשביל תגמול"],c:2,e:"המרצה [82:01-83:00]: המרכיב הראשון, מודעות עצמית — 'היכולת שלי לקרוא את המצבים שלי... לדעת לזהות את הרגשות ואיך הם משפיעים על ההתנהגות שלכם'. שקף 18: Self-awareness — 'the ability to recognize and understand your moods and emotions, and how they affect others'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"לפי המרצה, מדוע מתנדבים הם 'הרבה פעמים הרבה יותר טובים' מעובדים — בהקשר של אינטליגנציה רגשית?",o:["בגלל ניהול עצמי — הם אינם כפופים לממונה ולכן אינם נתונים בלחץ","בגלל מוטיבציה עצמית — הנעה פנימית שאינה תלויה בשכר או בבונוס","בגלל כישורים חברתיים — הם נבחרים לפי רשת הקשרים שלהם","בגלל אמפתיה — רובם מגיעים מתחומי הטיפול, החינוך והרווחה"],c:1,e:"המרצה [87:01-88:01]: המרכיב השלישי, Self-motivation — 'מוטיבציה אינהרנטית: לא בשביל שכר, לא בשביל בונוס, לא בשביל קורס, אלא כי זה בא ממנו'... 'זו הסיבה שהרבה פעמים מתנדבים הם הרבה יותר טובים'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"לפי המודל של דניאל גולמן (Daniel Goleman), כפי שהציגה אותו המרצה, מה נכון לגבי המהנדסים 'עם העיפרון הכי מחודד'?",o:["הם יהיו המנהלים הטובים ביותר, כי הידע המקצועי הוא הבסיס לכל ניהול","הם לא בהכרח המנהלים הטובים ביותר — מי שיש לו EI גבוה מצליח יותר","הם מתאימים לניהול רק בתנאי שיעברו קודם הכשרה ארוכה בתחום הרגשי","הם מתאימים לניהול בדרג הבכיר בלבד, שבו נדרשת חשיבה אנליטית"],c:1,e:"המרצה [81:00-82:01]: 'המהנדסים שהם העיפרון הכי מחודד... זה לא אומר שהם בהכרח יהיו המנהלים הכי טובים'. ב-[89:01]: חמשת המרכיבים 'מופיעים במודל של דניאל גולמן... מנהלים שיש להם את זה, גם אם הצליחו פחות באוניברסיטה, בציונים — הם מנהלים יותר טובים'."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"בשאלון ההערכה העצמית של אינטליגנציה רגשית (שקף 26), מה פירוש ציון של 31-40?",o:["מצוין (Excellent EI) — רמה גבוהה בכל חמשת הממדים","טוב — יש תחומים לשיפור, אך באופן כללי אפקטיבי","דורש פיתוח — מומלץ פיתוח ממוקד של אינטליגנציה רגשית","נמוך — מומלץ אימון מובנה (coaching) או הדרכה"],c:1,e:"שקף 26 — Scoring Guide: 41-50 Excellent EI; 31-40 Good — areas to improve but generally effective; 21-30 Needs Development — consider focused EI development; Below 20 — consider structured coaching or training."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"מצגת",q:"לפי שקף 22, מהן שלוש הרמות בתוכנית האימון לאינטליגנציה רגשית, לפי הסדר?",o:["ניהול רגשות, מודעות עצמית, בניית מערכות יחסים","מודעות עצמית, בניית מערכות יחסים, ניהול רגשות","מודעות עצמית, ניהול רגשות, בניית מערכות יחסים","אמפתיה, מוטיבציה עצמית, כישורים חברתיים"],c:2,e:"שקף 22 — Emotional Intelligence Training Program: Level 1 — Self Awareness; Level 2 — Emotion Management; Level 3 — Relationship Building. ההיגיון: קודם מכירים את עצמך, אחר כך מנהלים את הרגשות, ורק אז בונים מערכות יחסים."},
{l:7,t:"LMX ואינטליגנציה רגשית",s:"זום",q:"בסיום הדיון על הטיפים של Forbes לשיפור אינטליגנציה רגשית הביאה המרצה את דוגמת 'ה-6 וה-9'. מה היא ממחישה?",o:["שיש להתנצל ולהודות בטעויות מיד כשהן מתגלות","שכדאי לשים לב לשפת הגוף — שלך ושל האחרים","שעדיף לעצור לפני שמגיבים, כדי לא לפעול מתוך דחף","שיש לנסות לראות את הדברים מנקודת המבט של האחר"],c:3,e:"המרצה [93:00]: 'אני פה, אני רואה את הספרה 6; אני אלך לשם — אני רואה 9. שתי ספרות שונות, אבל זו אותה ספרה... הרעיון הוא להיכנס לנעליים של מישהו אחר' — הטיפ של Forbes: 'Try to see from another person's point of view' (שקף 23)."},
]);
