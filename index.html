/* ===================== שיעור 8 — בקרה ===================== */
{l:8,t:"תהליך הבקרה",s:"מצגת",q:"לפי שקף 'The Control Process', אילו שלושה רכיבים כולל תהליך הבקרה הדינמי?",o:["תכנון היעדים, ארגון המשאבים והובלת העובדים לביצוע, ובסוף בדיקת התוצאות","איסוף נתונים מהשטח, דיווח שוטף להנהלה הבכירה ופרסום התוצאות לכלל העובדים","קביעת סטנדרטים ברורים, השוואת הביצוע בפועל לרצוי, ופעולה מתקנת","הצבת יעדים אישיים, תגמול העובדים המצטיינים והערכת ביצועים שנתית"],c:2,e:"שקף 4: 'Establishment of clear standards of performance; Comparison of actual performance to desired performance; Corrective performance to repair performance deficiencies'. המרצה [9:13-10:11]: זה 'תהליך שיטתי מתמשך', שמטרתו ללמוד ולהשתפר מתקופה לתקופה."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"לפי המרצה, על סמך אילו שלושה דברים נקבע סטנדרט — למשל בפיצרייה שכונתית שמוציאה 700 פיצות במשמרת?",o:["תקן ISO של הענף, הוראות הרגולטור ותקציב המחלקה לשנה הקרובה","מה הלקוחות רוצים, מה המתחרים נותנים, ומה השגנו בתקופה הקודמת","עלויות הייצור, מחיר המכירה לצרכן ושולי הרווח הרצויים לבעלים","דעת המנכ״ל, דעת העובדים הוותיקים ודעת הספקים העיקריים"],c:1,e:"המרצה [11:01-12:02]: 'סטנדרט נקבע ברמת העיקרון לפי שלושה דברים: מה לקוחות רוצים; מה המתחרים נותנים; ומה אנחנו עשינו ברבעון, בחציון, בשנה הקודמת'. שקף 5: 'Setting standards by observing competitors and listening to customers'."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"פיצרייה שכונתית מבטיחה משלוח תוך חצי שעה, בעוד רשת מתחרה מאפשרת ללקוח לעקוב בזמן אמת אחרי הפיצה מהתנור ועד הדלת. לפי המרצה, מה הלקח לגבי קביעת סטנדרטים?",o:["הסטנדרט נקבע גם לפי המתחרים — מי שלא עומד בו 'אין לו זכות קיום'","כל עסק קובע סטנדרט לפי יכולותיו, בלי קשר למה שעושים המתחרים בשוק","סטנדרט של זמן משלוח אינו רלוונטי לעסק קטן, שמתחרה בעיקר במחיר","יש להעתיק את הטכנולוגיה של המתחרה, גם אם הלקוחות אינם מבקשים אותה"],c:0,e:"המרצה [12:02-13:00]: 'אם המתחרות שלי מביאות פיצה תוך רבע שעה ואני עם 30 דקות — לא יקרה כלום... אין לי זכות קיום'. באותו היגיון [43:00]: חברה שקיצרה את חלון הגעת הטכנאי מ-3-4 שעות ל-45 דקות — 'המתחרות לא יוכלו לשרוד אם לא יעמדו באותם תנאים'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, איזו בקרה היא 'הבקרה האמיתית' — שחברות וארגונים שרוצים להשתפר משתמשים בה?",o:["הבקרה הגלויה והמתוכננת מראש, כי היא שקופה לעובדים ומקובלת עליהם","סקרי שביעות רצון של לקוחות, כי הם מייצגים מאות ואלפי לקוחות","הבקרה הסמויה — למשל מבקרים שמתארחים במלון כאורחים רגילים","ביקורת 'פתע' של משרד הבריאות, שמודיעים עליה לבית החולים יום מראש"],c:2,e:"המרצה [13:00-15:01]: 'יש בקרה גלויה ויש בקרה סמויה... הבקרה הסמויה היא הבקרה האמיתית' — זוג שמתארח במלונות ומדווח, צוות ניתוח שיחות בבנק. ובבתי חולים יודעים יום מראש על 'ביקורת הפתע', ו'אין שום דימיון למה שראו אתמול'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"מפקד טייסת מקיים תחקיר לכל הטייסת אחרי גיחה, ואינו מתבייש להודות בטעויות שלו מול כולם. לפי הדיון בכיתה, מה היתרונות של בקרה כזו?",o:["חיסכון בזמן, כי כך אין צורך לקיים גם תחקירים ברמת הצוותים","שקיפות, למידה ארגונית וביטחון פסיכולוגי — 'הארגון הלומד'","תיקון התקלות עוד לפני שהגיחה עצמה הסתיימה, בזמן אמת","אנונימיות מלאה של המשתתפים, שמאפשרת לכולם לדבר בחופשיות"],c:1,e:"בדיון [17:02-19:00]: היתרונות — 'שקיפות מלאה, תהליכי למידה, הארגון הלומד... ביטחון פסיכולוגי'; המרצה הקבילה זאת לרופא שמודה מול כל המתמחים בטעות בניתוח. 'המילה תחקיר היא מילה להבנה וללמידה'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, מה החיסרון המרכזי של תחקיר שמתקיים לאחר שהגיחה או הרבעון הסתיימו?",o:["זו בקרה במקביל (Concurrent), שמלחיצה את העובדים בזמן הביצוע עצמו","זו בקרה מקדימה (Feedforward), יקרה מאוד ומעוררת התנגדות אצל הספקים","זו בקרה לאחר מעשה (Feedback) — את מה שקרה כבר אי אפשר להשיב","זו בקרה נורמטיבית, שמתבססת על ערכים ולא על נתונים מדידים"],c:2,e:"המרצה [20:00-21:02]: 'נגמרה הגיחה... אי אפשר להשיב. הבקרה הזו נקראת בקרת פידבק — בקרה אחר מעשה'. היא נותנת תמונת מצב מלאה, אך את התוצאה כבר אי אפשר לתקן. ובפורום גדול נוסף גם 'אלמנט של פחד' ודומיננטיות של חלק מהמשתתפים."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 22, מה ההבדל בין בקרה במקביל (Concurrent control) לבין בקרה מקדימה (Feedforward control)?",o:["במקביל — איסוף מידע על ליקויים לאחר שקרו; מקדימה — השוואה לתקציב בסוף התקופה","במקביל — מידע על ליקויים בזמן שהם קורים; מקדימה — ניטור התשומות כדי למנוע ליקויים","במקביל — ניטור התשומות לפני הייצור; מקדימה — מעקב אחר התפוקות בזמן אמת","במקביל — בקרה של הצוות כולו; מקדימה — בקרה של כל עובד בנפרד לפי התנהגותו"],c:1,e:"שקף 22: Feedback control — מידע על ליקויים 'after they occur'; Concurrent control — 'as they occur'; Feedforward control — 'Monitor performance inputs rather than outputs to prevent or minimize performance deficiencies before they occur'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"אפל עורכת ביקורות — גם ביקורות פתע — אצל יצרני השבבים שמספקים לה רכיבים, ומי שמסרב אינו יכול להיות ספק שלה. לפי המרצה, איזה סוג בקרה זה, ומה המחיר שלו?",o:["בקרה לאחר מעשה (Feedback) — זולה, אך מגלה את התקלות רק אצל הלקוח","בקרה במקביל (Concurrent) — מהירה, אך מחייבת נוכחות קבועה של מפקחים במפעל","בקרה קונצרטיבית (Concertive) — הספקים מבקרים זה את זה, ולכן יש טרמפיסטים","בקרה מקדימה (Feedforward) — יקרה ומעוררת אנטגוניזם, אך מונעת את רוב התקלות"],c:3,e:"המרצה [25:01-28:02]: 'הבקרה הזו נקראת feed forward control, בקרה מקדימה'. אפל עושה בקרות אצל הספקים כדי שלא יגיע רכיב פגום ללקוח. 'זו בקרה מאוד יקרה, היא מעוררת הרבה אנטגוניזם מצד הספק — אבל היא מבטיחה ש-90% מהתקלות לא יגיעו אליך'; 'חברות שחוסכות בבקרה מקדימה משלמות אותה אחר כך'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"מנכ״ל רואה על מסך ענק בלשכתו, בזמן אמת, את מספר השיחות הנכנסות ואת התקלות במוקד; כשנדלק אדום הוא שולח את סגנו לבדוק. לפי המרצה, מהו היתרון המרכזי של בקרה כזו?",o:["בקרה לאחר מעשה — תמונה מלאה של הרבעון כולו לצורך הפקת לקחים","בקרה מקדימה — מניעת תקלות אצל הספקים עוד לפני שהן מגיעות","בקרה במקביל — טיפול לפני שהלקוח עוזב ולפני שהתקלה הופכת למשבר","בקרה נורמטיבית — העובדים מפנימים את הערכים ואינם צריכים פיקוח"],c:2,e:"המרצה [32:01-33:03]: 'בקרה מספר 3 נקראת Concurrent Control' — הבקרה בזמן אמת. 'למה היא כל כך חשובה? הלקוח עוד לא עזב, התקלה עוד לא הפכה להיות משבר, הכל חם בזמן אמת'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"'במקום לנהל את העבודה — אתה מנהל את המדדים'. לפי הדיון בכיתה, מתי קורה הדבר בבקרה בזמן אמת?",o:["כשהמדדים מוצגים רק להנהלה הבכירה ולא לעובדים עצמם שמבצעים את העבודה","כשהבקרה נעשית אחת לרבעון במקום בכל יום ויום","כשהמדדים נקבעים יחד עם העובדים, כמו בשיטת MBO","כשהבקרה הופכת למטרה במקום לכלי — נציגים ממהרים לסגור שיחות"],c:3,e:"בדיון [33:03-34:00]: החיסרון של הבקרה בזמן אמת — העובדים תמיד בלחץ, ו'אם אתה הופך את זה למטרה ולא משתמש בו ככלי — פספסת'. המרצה מצאה בדוקטורט שבמוקדים 'העובדים טרודים בלסגור שיחה, כי הם נמדדים תוך כמה זמן השיחה נסגרה'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, מדוע בקרה בזמן אמת (Concurrent) קשה ויקרה במיוחד במלון גדול, לעומת מפעל ייצור?",o:["כי במלונות אסור לצלם ולתעד את האורחים, ולכן אין בכלל נתונים לבקרה","כי בשירות יש מאות אינטראקציות בדקה ומדדים איכותניים; בייצור — מספרים","כי עובדי מלונות מתנגדים לבקרה יותר מעובדים בענפים אחרים","כי מלונות אינם זקוקים לבקרה בזמן אמת, שכן האורחים שוהים זמן קצר"],c:1,e:"המרצה [36:01-37:01]: 'אני מנכ״לית של מלון — 700 אינטראקציות מדי דקה, אין אפשרות'; בחברות שירות הבקרה בזמן אמת יקרה מאוד; 'בחברות ייצור הרבה יותר קל, כי יש לך הכל במספרים... המדדים הכמותיים יותר קלים לבדיקה, האיכותניים — יותר קשה'."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"המרצה הדגישה מושג ש'תצטרכו גם למבחן': בנצ'מרקינג (Benchmarking). איך הסבירה אותו?",o:["השוואה בין יחידות מקבילות לפי מדדים משותפים, שיוצרת תחרות בונה ביניהן","השוואה של כל עובד רק לביצועים שלו עצמו בתקופה הקודמת, בלי השוואה לעובדים אחרים","קביעת סטנדרט לפי דרישות הרגולטור בלבד, בלי להתחשב במתחרים או בלקוחות","בקרה סמויה באמצעות לקוח מסתורי, שמשווה בין הסניפים בלי שהעובדים יודעים"],c:0,e:"המרצה [41:00-42:01]: 'אתם יודעים — זה מושג שתצטרכו גם למבחן — מה זה בנצ'מרקינג? אם אני היום מנהלת איכילוב, אני רוצה להשוות את השירות באף-אוזן-גרון מול ילדים, מול נוירולוגיה, מול אורתופדיה... אתה יוצר תחרות' — לפי מדדים חוצי-מחלקות, בשקיפות (אדום-צהוב-ירוק)."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"לפי המרצה, כיצד צריך לבנות דשבורד בקרה (Dashboard) לארגון?",o:["יחד עם המנהלים, כמו ב-MBO — ולבחור בו את המדדים הרלוונטיים והקריטיים","בידי צוות טכנולוגי חיצוני, כדי שהמדדים יהיו אובייקטיביים ונקיים מהטיות","עם כמה שיותר מדדים, כדי שלא יתפספס שום נתון בפעילות היומיומית","לפי תבנית אחידה לכל הארגונים בענף, כדי לאפשר השוואה ביניהם"],c:0,e:"המרצה [38:02-39:00]: 'בתכנון עושים MBO עם העובדים, עם המנהלים... אפילו ברמה של הדשבורד, מנהל צריך לבנות ביחד עם המנהלים שלו מה יותר בולט, מה פחות — מה באמת רלוונטי, מה חשוב למדוד'. סטודנט הוסיף: בפסגת הפירמידה צריך לקחת 'כמה פרמטרים הכי קריטיים'."},
{l:8,t:"תהליך הבקרה",s:"מצגת",q:"לפי שקף 'Corrective Action', מהם שלושת השלבים של הפעולה המתקנת?",o:["זיהוי הסטיות בביצועים, ניתוח הסטיות, ופיתוח ויישום תוכניות לתיקונן","דיווח על הסטיות להנהלה, מציאת האחראי, והטלת סנקציות על העובד שכשל","עדכון הסטנדרט כלפי מטה, דיווח לעובדים, והמשך העבודה ללא שינוי","קביעת סטנדרטים חדשים, מדידת הביצועים מחדש, ופרסום התוצאות לכולם"],c:0,e:"שקף 17: 'Identify performance deviations; Analyze the deviations; Develop and implement programs to correct the deviations'. המרצה [51:00]: זיהוי 'ברחל בתך הקטנה' של הפערים, ניתוח מעמיק, ופיתוח תוכניות שמטרתן לסגור את הפער."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"פיצרייה שמוציאה בדרך כלל 700 פיצות במשמרת ירדה ל-560, ולמחרת ל-530. לפי המרצה, מה צריך לקרות אחרי שמזהים את הפער?",o:["לחכות לרבעון הבא ולבדוק אם המגמה נמשכת, לפני שמשנים משהו בפיצרייה","להחליף מיד את מנהל המשמרת, כי הוא האחראי הישיר לירידה במכירות","לנתח לעומק את הסיבה — עובדים, תנורים, שליחים — ולתקן באותו רבעון","להוריד את הסטנדרט ל-550 פיצות במשמרת, כך שיתאים למציאות החדשה בשטח"],c:2,e:"המרצה [51:00-53:01]: לא מספיק לציין את הפער — צריך 'לבדוק מה סיבת הפערים: העובדים, המוקד הטלפוני, סוג הפיצות, התנורים, השליחים'; ובהרבה יחידות 'מזהים פערים, עד הרבעון הבא שוכחים... לא, עד סוף אותו רבעון צריך לעשות פעילות מתקנת'."},
{l:8,t:"תהליך הבקרה",s:"זום",q:"במוקד שירות נקבעו שני מדדים: מספר השיחות שנענו ואיכות השירות. לפי המרצה, מה צריך לזכור כשבונים מדדים כאלה?",o:["להעדיף תמיד את המדד הכמותי, כי רק אותו אפשר למדוד באופן אובייקטיבי","להעדיף תמיד את מדד האיכות, כי כמות השיחות אינה חשובה ללקוח","לבחור רק מדד אחד, כדי שהנציגים לא יתבלבלו בין דרישות סותרות","לוודא שהמדדים אינם מתנגשים, ולשלב מדד כמותי ומדד איכותני"],c:3,e:"המרצה [50:02]: 'צריך לראות שאין התנגשות של מספר מדדים — מדד הכמות מול מדד האיכות... לקחת בחשבון שיש גם מדד כמותי וגם מדד איכותני'. המדד הכמותי יראה כמה נמכר, ומדד האיכות יראה שהנציג היה לא נחמד — 'כל הדברים האלה חייבים להיכלל'."},
{l:8,t:"תהליך הבקרה",s:"מצגת",q:"המרצה אמרה על השקפים העוסקים במאפייני מערכת בקרה אפקטיבית 'שקפים שתצטרכו לדעת'. לפי שקפים 20-21, כל הבאים הם מאפיינים של מערכת בקרה אפקטיבית, למעט:",o:["המידע מובן למי שצריך לפעול לפיו, ומוצג בצורה מתאימה","הסטיות מדווחות מהר ככל האפשר — ורצוי עוד לפני שהן קורות","הבקרה מתמקדת בפעילויות הקריטיות להצלחת הארגון","יש כמה שיותר בקרות על כל פעילות, גם על פעילויות שוליות"],c:3,e:"שקף 21: 'An unnecessary number of controls over comparatively unimportant activities are uneconomic and time-consuming'. שאר המאפיינים: מידע מובן ומוצג בצורה מתאימה, מסופק למנהלים האחראים, דיווח מהיר על סטיות (אפילו לפני שיקרו), מידע שאינו מושפע מגורמים לא קשורים, ועקביות עם מטרת הפעילות."},
{l:8,t:"תהליך הבקרה",s:"מצגת",q:"לפי שקף 21, מה עוד נדרש ממידע שמערכת בקרה אפקטיבית מספקת?",o:["שיהיה מושפע ממגוון רחב של גורמים, כדי לשקף את התמונה המלאה","שלא יושפע משינויים בגורמים שאינם קשורים למטרת מערכת הבקרה","שיוצג רק להנהלה הבכירה, כדי למנוע לחץ מיותר על העובדים","שייאסף אחת לשנה, כדי לא להעמיס על היחידות בדיווחים שוטפים"],c:1,e:"שקף 21: 'The control system must yield information that is not influenced by changes in other factors unconnected to the purpose of the control system', ו-'should be consistent with the objective of the activity to which it relates'. שקף 20 מוסיף: המידע מסופק למנהלים האחראים לתחום, ומדווח על סטיות מהר ככל האפשר."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 18 על בקרת מלאי (Inventory Control), מה נכון לגבי סוגי המלאי?",o:["מלאי חומרי גלם הוא היקר ביותר, כי הוא נקנה מראש בכמויות גדולות","מלאי בתהליך (Work in process) הוא מוצרים גמורים שעדיין לא נמכרו","מלאי מוצרים גמורים יקר, כי כבר הושקעו בו עבודה, עלויות ושטח אחסון","לארגונים יש שני סוגי מלאי בלבד: חומרי גלם ומוצרים גמורים"],c:2,e:"שקף 18: שלושה סוגי מלאי — מוצרים גמורים (יקר: הושקעו בו עבודה ועלויות, ויש לשלם על אחסונו — למשל מכוניות חדשות בחניון המפעל), מלאי בתהליך (מנועים וגלגלים שממתינים להרכבה), וחומרי גלם (זול יותר, כי עוד לא הושקעה בו עבודה — פלדה, חוטים, זכוכית)."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 19, מהי בקרה תקציבית (Budgetary control)?",o:["קביעת יעדי הוצאות, מעקב והשוואה לתקציב, ושינויים לפי הצורך","הקצאת תקציב קבוע לכל מחלקה בתחילת השנה, בלי מעקב נוסף עד סוף השנה","ביקורת חיצונית של רואה חשבון, שנערכת פעם בשנה על הדוחות הכספיים","בקרה שבה כל עובד מנהל לבדו את התקציב שלו, בלי דיווח להנהלה"],c:0,e:"שקף 19: 'Budgetary control is one of the most commonly used methods of managerial control. It is the process of setting targets for an organization's expenditures, monitoring results and comparing them to the budget, and making changes if needed'. התקציבים הם דוחות של הוצאות מתוכננות מול הוצאות בפועל."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"באמזון בודקים אם החבילה הגיעה ללקוח בזמן, עוקבים אחר העובדים בזמן האריזה, ובודקים את הסחורה עוד לפני שנארזה. אילו סוגי בקרה אלה, לפי הסדר?",o:["מקדימה (Feedforward), במקביל (Concurrent), לאחר מעשה (Feedback)","לאחר מעשה (Feedback), מקדימה (Feedforward), במקביל (Concurrent)","במקביל (Concurrent), לאחר מעשה (Feedback), מקדימה (Feedforward)","לאחר מעשה (Feedback), במקביל (Concurrent), מקדימה (Feedforward)"],c:3,e:"המרצה [53:01-54:00], על אמזון: 'בקרה לאחר מעשה — אם הסחורה הגיעה בזמן; שתיים — תוך כדי, תוך כדי עבודת העובדים; שלוש — עוד לפני שהיא נארזת, לפני שזה יוצא לדרך'. כלומר Feedback, Concurrent, Feedforward."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"מכונות החטיפים בקמפוס מתרוקנות, ובעל המכונות מגלה זאת רק כשמישהו מתלונן. המרצה הציעה לו מערכת חיישנים שתתריע מראש. לאיזה סוג בקרה זה שייך, ומה השיקול?",o:["בקרה לאחר מעשה — הזולה ביותר, ולכן אין צורך בחישוב כלכלי","בקרה נורמטיבית — כדאי לסמוך על כך שהעובדים ימלאו את המכונות","בקרה מקדימה — יקרה, ולכן צריך לשקול עלות מול תועלת","בקרה עצמית — כל מכונה מבקרת את עצמה, ולכן אין צורך בבעלים"],c:2,e:"המרצה [54:00-57:00]: 'בקרה לפני מעשה... זה יקר'; מי שלא משקיע בטכנולוגיה ובכלים 'חוסך בזה ומפסיד'. היא הציעה לו מערכות שידעו מראש איזו מכונה עומדת להתרוקן — 'עלות-תועלת: כמה זה יעלה לו מול כמה זה ייתן לו'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, מה הבעיה בבקרה הבירוקרטית של שעון נוכחות, ואיפה היא עדיין רלוונטית?",o:["היא זולה מדי ולכן אינה אמינה; היא רלוונטית בעיקר בחברות הייטק","הנוכחות אינה משקפת את התפוקה; היא רלוונטית בייצור ובתחנות דלק","היא פוגעת בפרטיות העובדים; היא רלוונטית בעיקר במשרדי ממשלה","היא מחליפה את בקרת התפוקה; היא רלוונטית בכל ארגון באותה מידה"],c:1,e:"המרצה [58:00-59:00]: שעון הנוכחות 'לא אומר שזכית בשיטות וכלי ניהול מתקדמים' — 'זה שעובד הגיע לא מבטא את התפוקה שלו'. היא רלוונטית בייצור ובשירות — 'אם מבין 12 מתדלקים בפז לא באו 6, אכלתי אותה' — ופחות בהייטק, שבו 'אנחנו רוצים לראות תפוקה'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 23, מה מאפיין בקרה ביורוקרטית (Bureaucratic Control)?",o:["ויסות התנהגות העובדים באמצעות ערכי קבוצת העבודה ואמונותיה","מיון קפדני של עובדים והקשבה לעובדים הוותיקים על החברה","בקרה מלמעלה למטה באמצעות תגמולים, עונשים, מדיניות וכללים","עובדים שקובעים לעצמם יעדים ועוקבים אחר התקדמותם בגבולות מוגדרים"],c:2,e:"שקף 23: 'Top-down control; Use rewards and punishments to influence employee behaviors; Use policies and rules to control employees; Often inefficient and highly resistant to change'. ערכי הקבוצה — קונצרטיבית; מיון והקשבה לוותיקים — נורמטיבית; יעדים אישיים — בקרה עצמית."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"סניף בנק בודק כל בנקאי בשני מדדים: איך הוא מתנהג מול הלקוחות (אדיבות, זמני מענה, טון) וכמה הלוואות ותיקים הוא סגר. לפי השקפים, איזו בקרה זו?",o:["בקרה אובייקטיבית (Objective) — שילוב של בקרת התנהגות ובקרת תפוקה","בקרה נורמטיבית (Normative) — ויסות לפי הערכים המקובלים בסניף","בקרה קונצרטיבית (Concertive) — בדיקה של הצוות כולו ולא של כל פרט","בקרה עצמית (Self control) — כל בנקאי קובע לעצמו יעדים ובודק אותם"],c:0,e:"שקף 24: Objective control — 'Use of observable measures of worker behavior or outputs'; Behavior control — ויסות ההתנהגויות והפעולות בעבודה; Output control — ויסות התוצאות באמצעות תגמולים. המרצה [60:11-61:01]: השילוב חשוב — עובד חדש ומקצועי עשוי להראות תפוקה נמוכה בהתחלה, ועובד שמוכר הרבה עשוי להיות אנטיפתי ללקוחות."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 25, כיצד נוצרת בקרה נורמטיבית (Normative Control)?",o:["באמצעות מדדים אובייקטיביים ונצפים של ההתנהגות והתפוקה של כל עובד","באמצעות הערכים והאמונות של קבוצת העבודה, בקבוצות אוטונומיות","באמצעות כללים ונהלים, ותגמולים ועונשים שמוטלים מלמעלה","באמצעות מיון קפדני של עובדים, והתבוננות והקשבה לעובדים ותיקים"],c:3,e:"שקף 25: Normative Control — 'Created by careful selection of employees; Observing experienced employees and listening to what they have to say about the company'. ערכי הקבוצה — בקרה קונצרטיבית (שקף 26); מדדים נצפים — אובייקטיבית; כללים ועונשים — ביורוקרטית."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"בנורדסטרום, אם פריט שהלקוחה מבקשת אינו בחנות — העובדים ידאגו להביא אותו, אפילו מחנות מתחרה, בלי שמישהו הורה להם. לפי המרצה, איזו בקרה זו ומה יתרונה?",o:["בקרה ביורוקרטית — נוהל כתוב מחייב את העובדים לספק כל פריט","בקרה במקביל — מנהל החנות מפקח על כל עסקה בזמן אמת ובאופן צמוד","בקרה אובייקטיבית — העובדים מתוגמלים לפי כמות המכירות שלהם","בקרה נורמטיבית — הנורמות מעצבות את ה-DNA, ולכן נדרש פחות פיקוח"],c:3,e:"המרצה [64:00-67:02]: בקרה נורמטיבית היא 'בקרה על פי ערכים, על פי כללים שמקובלים בארגון' (בגוגל — הצוות לא הולך הביתה עד שהפרויקט הסתיים; בנורדסטרום — מביאים את הפריט גם ממתחרה). 'נורמה מעצבת את ה-DNA של הארגון... פחות נהלים, פחות תהליכי בקרה' — 'אני קוראת לה בקרת DNA'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 26, מהי בקרה קונצרטיבית (Concertive Control)?",o:["ויסות התנהגות העובדים והחלטותיהם באמצעות הערכים והאמונות של קבוצת העבודה","ויסות התנהגות העובדים באמצעות מדדים של תפוקה ותגמולים אישיים לכל אחד","ויסות התנהגות העובדים באמצעות מיון קפדני וחיקוי של עובדים ותיקים","ויסות התנהגות העובדים באמצעות כללים ונהלים שנקבעים בידי ההנהלה הבכירה"],c:0,e:"שקף 26: Concertive Control — 'Regulation of workers' behavior and decisions through work group values and beliefs'; 'Autonomous work groups, in which group members control processes, output and behaviors'. המרצה המשילה זאת לתזמורת: המנצח בודק את כולה, לא כל נגן בנפרד."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, מה החיסרון המרכזי של בקרה קונצרטיבית (Concertive), שבודקת את הצוות כולו ולא כל עובד?",o:["היא יקרה מאוד, כי נדרש מפקח צמוד לכל אחד מחברי הצוות","היא מעודדת 'טרמפיסטים' ועלולה להוריד את מוטיבציית הטובים","היא אינה מאפשרת להשוות בין צוותים שונים באותו ארגון ובאותו תחום","היא מתאימה רק לארגונים היררכיים עם שרשרת פיקוד ברורה"],c:1,e:"המרצה [68:00-70:01]: היתרון — רואים את הצוות כולו ואפשר לאזן בין צוותים (בנצ'מרק בין עשרה צוותים במוקד). החיסרון — 'לפעמים מעודדת טרמפיסטים, Free riders... במקום לגרום למוטיבציה מביאה לירידה', וגם 'מפספסת את הטובים ביותר'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 27, מהי בקרה עצמית (Self Control)?",o:["המנהל בודק כל יום את העובדים ומתקן אותם בזמן אמת, לפי מדדים","הצוות כולו מבקר את חבריו לפי ערכים ואמונות משותפים שגיבש בעצמו","העובדים קובעים לעצמם יעדים ועוקבים אחר התקדמותם, בגבולות מוגדרים","העובדים בוחרים לעצמם מנהל, והוא מבקר אותם בשמם מול ההנהלה הבכירה"],c:2,e:"שקף 27: 'Employees control their own behavior, making decisions within well-established boundaries; Managers instruct others the skills they need; Employees set goals and monitor their own progress; In essence: Self-management'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"לפי המרצה, מדוע הבקרה העצמית (Self control) היא 'הכי חשובה' כיום?",o:["כי היא זולה, ומאפשרת לוותר לגמרי על מערכות בקרה ועל דשבורדים","כי היא מתאימה לארגונים שטוחים ולצמצום, והמנהלים מתפנים לאסטרטגיה","כי היא מחזקת את הריכוזיות ומעבירה את כל ההחלטות להנהלה הבכירה","כי היא מתאימה רק לעובדים ותיקים, שכבר אינם זקוקים להדרכה"],c:1,e:"המרצה [71:01-72:00]: 'הבקרה החמישית — זה הכי חשוב'; 'עד אחרון העובדים, שיודע איך לבקר את עצמו' עם דשבורד משלו; 'זה מתיישב עם ארגונים שטוחים יותר, עם ה-downsizing'; ו'אז יש לנו זמן לחשוב על אסטרטגיה, כי אנחנו סומכים על העובד'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"זום",q:"שאלת הדיון בשקף 29: 'האם תרבות ארגונית חזקה יכולה להחליף מערכות בקרה פורמליות?'. מה השיבה המרצה?",o:["לא — תרבות חזקה רק מגבירה את הצורך במערכות בקרה פורמליות","לא — רק מערכות מבוססות AI יכולות להחליף את הבקרה הפורמלית","כן — אבל רק בחברות הייטק, ולא בצבא או במשרדי ממשלה","כן, במידה רבה — היא מגדלת עובדים ומנהלים שמבקרים את עצמם"],c:3,e:"המרצה [73:00-74:01]: 'האם תרבות חזקה... יכולה להחליף חלק מסוגי הבקרה? כן. למה? כי אתה מגדל דור של מנהלים ועובדים זוטרים שמבינים שהם המבקרים של עצמם' — ברוח 'from managers to coaches'."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי השקף על מערכת הבקרה של Haier, מהו עקרון 80-20 של אחריות ההנהלה?",o:["20% מהעובדים — המנהלים — אחראים ל-80% מתוצאות הביצועים","80% מהעובדים אחראים ל-20% מהתקלות, ולכן יש לבקר אותם יותר","20% מהלקוחות מניבים 80% מההכנסות, ולכן הבקרה מתמקדת בהם","20% מזמן המנהל מוקדש לבקרה, ו-80% — לתכנון ולאסטרטגיה"],c:0,e:"שקף 32: '80-20 management responsibility principle — 20% of employees who are managers are responsible for 80% of the company's performance results'. זה אינו עקרון פארטו הקלאסי של לקוחות והכנסות."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 31, איזה מהבאים הוא מרכיב במערכת ניהול הביצועים של Haier?",o:["מכסת חופשה בלתי מוגבלת לכל העובדים, בתנאי שיעמדו ביעדים","הערכה שנתית של כל עובד בידי לפחות 20 עמיתים לעבודה","דוח רווח והפסד חודשי ואישי לכל עובד ועובד במפעל","ויתור על תרשים ארגוני ועל תארים לטובת צוותים עצמאיים"],c:2,e:"שקף 31 — Haier: הערכה יומית של עובדי המפעל; מודל ייחודי לגיוס ולקידום; עקרון 80-20; תמריצים למנהלים עם ביצועים גבוהים; 'Individual monthly profit and loss statement for each employee'. חופשה בלתי מוגבלת — נטפליקס (לפי המרצה); 20 עמיתים וללא תרשים — W.L. Gore (שיעור 6)."},
{l:8,t:"סוגי בקרה ודוגמאות",s:"מצגת",q:"לפי שקף 35, מה מאפיין בקרה מבוזרת (Decentralized control) לעומת בקרה היררכית?",o:["כללים ונהלים מפורטים, ומערכות בקרה פורמליות בכל הדרגים","דגש על תגמולים חיצוניים בלבד — שכר, הטבות ומעמד","סמכות מלמעלה למטה, ומפקחי איכות ייעודיים על כל התהליכים","מעט כללים, ערכים ובקרה קבוצתית ועצמית, ותרבות מסתגלת"],c:3,e:"שקף 35 — Decentralized control: שימוש מוגבל בכללים; הסתמכות על ערכים ועל בקרה קבוצתית ועצמית; סמכות גמישה ומבנה שטוח — כולם מפקחים על האיכות; תגמולים חיצוניים ופנימיים; עובדים לוקחים יוזמה; תרבות מסתגלת. שאר האפשרויות מתארות את הבקרה ההיררכית."},
]);

/* ===================== שיעור 9 — ניהול צוות (1) ===================== */
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"איזו מההגדרות הבאות היא ההגדרה של Katzenbach & Smith (1993) לצוות, כפי שהוצגה בשקף?",o:["אוסף של יחידים בעלי תלות הדדית (interdependent) החולקים אחריות לתוצאות מוגדרות עבור הארגון","קבוצות מובנות של אנשים העובדים על מטרות משותפות מוגדרות, המחייבות אינטראקציות מתואמות","מספר קטן של אנשים בעלי כישורים משלימים, המחויבים למטרה משותפת ואחראים זה כלפי זה","קבוצת עובדים באותה מחלקה, החולקים ממונה משותף, תקציב אחד ומערכת תגמול משותפת"],c:2,e:"שקף 3: Katzenbach & Smith — 'small number of people with complementary skills… mutually accountable'. התשובה הראשונה היא DeMeuse & Futrell (1990) והשנייה היא Forsyth (2018)."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"במחלקת מכירות עובדים שמונה נציגים; כל אחד מוכר ללקוחות שלו, מתוגמל על מכירותיו בלבד ואינו זקוק לעמיתיו כדי לבצע את עבודתו. לפי הדגש של המרצה על מהות הצוות, מה חסר כאן כדי שהמחלקה תיחשב צוות?",o:["מספר קטן יותר של חברים, שכן צוות אמיתי לפי ההגדרות אינו עולה על חמישה אנשים","תלות הדדית (interdependence) בין החברים ומטרה משותפת שההצלחה בה נמדדת יחד","מנהל דומיננטי שמקבל את ההחלטות ומחלק את המשאבים והלקוחות בין הנציגים","לכידות חברתית (Social cohesion) — מפגשים חברתיים קבועים של החברים מחוץ לעבודה"],c:1,e:"המרצה [07:38]-[08:31]: 'תלות הדדית אומרת שא' תלוי בב' ושהמשימה לא יכולה להתבצע', ו'ההצלחה שלנו נמדדת כצוות'. לכידות חברתית אינה תנאי להגדרת צוות, ומספר החברים אינו הבעיה."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"כל הבאים הוצגו בשקף 'יתרונות הצוותים' (The Advantages of Teams), למעט:",o:["הגברת הפריון (productivity) של הארגון","שיפור שביעות רצון הלקוחות (customer satisfaction)","הגדלת מעורבות העובדים (involvement) בעבודתם","צמצום הצורך בניהול קונפליקטים בארגון"],c:3,e:"שקף 6 מונה: פריון, שביעות רצון לקוחות, מעורבות, איכות מוצר ושירות, ושביעות רצון בעבודה. קונפליקטים לפי שקף 24 הם בלתי נמנעים בצוותים — הצוות אינו מצמצם אותם."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"המרצה הסבירה מדוע ארגונים עובדים בצוותים. איזו מהאמירות הבאות תואמת את דבריה?",o:["מעל 99% מהארגונים עובדים בצוותים, והצוות הוא היחידה האורגנית הקטנה ביותר שמרכיבה את הארגון","צוותים מפחיתים את הצורך בתקשורת בארגון, כי כל חבר צוות פועל באופן עצמאי בתחום ההתמחות שלו","קבלת החלטות בצוות איטית ופחות מבוססת (grounded) מקבלת החלטות אישית, אך היא משפרת את שביעות הרצון של העובדים","צוותים מתאימים בעיקר לארגונים קטנים; בארגונים גדולים עדיף לעבוד ביחידות אישיות עם ממונה ישיר"],c:0,e:"[09:48]-[09:56]: 'מעל 99% מהארגונים… הצוות הוא היחידה האורגנית הקטנה ביותר'. היא הדגישה גם [12:19] שקבלת החלטות בצוות 'הרבה יותר טובה, מקצועית ומבוססת' — ההפך מהטענה בתשובה ג'."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בצוות פיתוח כולם יודעים מה היעד והתפקידים מוגדרים היטב, אך בכל ישיבה שלושה חברים מדברים ללא הפסקה ושניים אחרים שותקים תמיד. איזו תכונה של צוות אפקטיבי (Scholtes, 2003) נפגעת כאן?",o:["בהירות ביעדי הצוות (Clarity in team goals)","תוכנית שיפור (Improvement plan)","הגדרת תפקידים ברורה (Clearly defined roles)","השתתפות מאוזנת (Balanced participation)"],c:3,e:"שקף 7: Balanced participation. המרצה [20:17]-[21:14]: 'אין אחד שדורס את כולם… תפקיד ראש הצוות לאזן' ('ויטלי, עצור, שמענו אותך; משה, מה אתה חושב'). היעדים והתפקידים בתרחיש דווקא ברורים."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"המרצה חזרה שלוש פעמים על גורם אחד וטענה שצוות המורכב מהאנשים המקצועיים ביותר, בעלי ההשכלה הגבוהה ביותר, 'לא יתפקד לעולם' בלעדיו. מהו הגורם?",o:["הגדרת תפקידים ברורה לכל חבר צוות","מערכת תגמול הוגנת ושוויונית","מנהיג דומיננטי ומנוסה בראש הצוות","אמון (trust) בין חברי הצוות"],c:3,e:"[27:56]-[28:11]: 'אין אמון — אני אומרת את זה פעם שלישית… שיהיו בו האנשים הכי מקצועיים… אבל לא יהיה אמון — לא יתפקד לעולם'. תואם את 'Lack of trust' בשקף 8."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בצוות של עשרה אנשים אחד החברים 'עושה הרבה רוח' בישיבות אך בפועל כמעט אינו תורם, ומסתמך על כך שהאחרים יעשו את העבודה. המרצה כינתה זאת 'אפקט הטרמפיסט'. לאיזו תופעה מהשקף על צוותים לא אפקטיביים זה מתאים?",o:["קיטוב קבוצתי (Group polarization)","חשיבת יחד (Groupthink)","בטלנות חברתית (Social loafing)","קונפורמיות (Conformity)"],c:2,e:"שקף 8 מונה Social loafing כאחת מ'מחלות הצוות'; המרצה [11:31]-[11:40] תיארה את הטרמפיסט כ'אנשים שעושים הרבה רוח אבל לא עושים כלום'. חשיבת יחד וקונפורמיות עוסקות בהתיישרות עם הקבוצה, לא בהפחתת מאמץ."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"נורמות צוות (Team norms), כפי שהוגדרו בשקף ובדברי המרצה, הן:",o:["סטנדרטים שהוסכמו באופן בלתי פורמלי ומווסתים את התנהגות הצוות — 'כללי המשחק'","נהלים כתובים שקובעת ההנהלה הבכירה ומפורסמים לעובדים חדשים בעת קליטתם לארגון","יעדי ביצוע כמותיים שהצוות מציב לעצמו לתקופה מוגדרת ומודד את עצמו לפיהם","ערכי הליבה של הארגון כפי שהם מופיעים בחזון, באסטרטגיה ובקוד האתי שלו"],c:0,e:"שקף 10: 'informally agreed-on standards that regulate team behavior'. המרצה [39:14]-[39:44]: 'נורמות בצוות זה כללי משחק… בדרך כלל לא חוקים כתובים'. נהלים כתובים הם ההפך מנורמה."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"במוקד שירות שחקרה המרצה נהוג לצאת להפסקה של עשר דקות כל שעתיים. נציג חדש מאריך את הפסקותיו שוב ושוב. לפי דבריה, מה צפוי לקרות בצוות מגובש עוד לפני שראש הצוות מתערב?",o:["הצוות יאמץ את ההתנהגות החדשה, כי נורמות משתנות לפי החבר האחרון שהצטרף","החברים יפנו למנהל בדרישה לכתוב את הנורמה כנוהל רשמי ומחייב בארגון","לא יקרה דבר, כי נורמות בלתי כתובות אינן נאכפות ללא סמכות פורמלית","זהות הצוות תפעל מבפנים והחורג ירגיש שאינו שייך — ויתיישר או יעזוב"],c:3,e:"[40:41]-[41:27]: 'הזהות של הצוות מתגבשת, ומישהו שחורג מהכללים מרגיש שהוא לא שייך… עוד לפני שראש הצוות מתערב'. נורמות נאכפות חברתית, לא באמצעות נוהל כתוב."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"מנהלת שהצטרפה לצוות חדש לאחר שעבדה בחמישה צוותי הנהלה מנהיגה מיד את המנהג שמישהו מסכם כל ישיבה ושמישהו אחראי על הצד החברתי. איזה מקור להתפתחות נורמות (The Development of Team Norms) זה מדגים?",o:["התנהגויות מוקדמות (Early behaviors)","התנהגויות מיובאות (Imported behaviors)","אירועים קריטיים (Critical events)","סטנדרטים מוצהרים במפורש (Explicitly stated standards)"],c:1,e:"שקף 12 ודוגמת המרצה [45:29]-[46:05]: 'באתי אחרי שישה ארגונים… ואני מייבאת התנהגות: בכל צוות יש מי שאחראי על הצד החברתי, מי שמסכם את הישיבה'. Early behaviors הן התנהגויות שנוצרו בצוות עצמו בתחילת דרכו."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"חברת בקבוקים מגלה שהשוק דורש בקבוק של 700 מ\"ל שאינו בקו הייצור, ומקימה בדחיפות צוות שמגבש כללי עבודה חדשים. לפי המרצה, איזה מנגנון של היווצרות נורמות פועל כאן?",o:["אירועים קריטיים (Critical events) — משבר או לחץ שמצמיח נורמות חדשות","התנהגויות מוקדמות (Early behaviors) — מה שנעשה בתחילת הדרך מקבע נורמה","התנהגויות מיובאות (Imported behaviors) — נורמות שמביאים מארגונים קודמים","סטנדרטים מוצהרים (Explicitly stated standards) — כללים שהמנהל מכריז עליהם"],c:0,e:"[46:08]-[46:58]: 'משבר, לחץ… במקרה קיצון יוצא הצורך האמיתי ואז נבנות נורמות' — והדוגמה של בקבוק 700 מ\"ל. סטנדרטים מוצהרים הוזכרו כמקור נפרד (המנהל + דרישות השוק)."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"לכידות (Cohesiveness) הוגדרה בשקף כ:",o:["המידה שבה חברי הצוות נמשכים לצוות ומונעים (motivated) להישאר בו","המידה שבה חברי הצוות מסכימים זה עם זה בעת קבלת החלטות","המידה שבה הצוות עומד ביעדי הביצוע שהוצבו לו על ידי ההנהלה","המידה שבה חברי הצוות חולקים רקע מקצועי וכישורים דומים"],c:0,e:"שקף 13-14: 'the extent to which team members are attracted to a team and motivated to remain in it'. הסכמה גורפת בהחלטות היא דווקא סימן לחשיבת יחד, לא ללכידות."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"בחמ\"ל אחד הקצינים מקצועי מאוד, מתעקש לשבת עם כל חבר צוות ולגבש יחד את ההערכה הטובה ביותר, אך אינו משתתף באף מפגש חברתי ומסיים משמרת ב'שלום' יבש. איך המרצה הייתה מאפיינת אותו?",o:["לכידות חברתית (Social cohesion) גבוהה ולכידות משימתית נמוכה","לכידות נמוכה משני הסוגים — הוא אינו נמשך לצוות כלל","חשיבת יחד (Groupthink) — הוא מתיישר עם הקבוצה בכל החלטה","לכידות משימתית (Task cohesion) גבוהה ולכידות חברתית נמוכה"],c:3,e:"שקף 16 + [54:14]-[56:38]: לכידות משימתית = 'לעבוד ביחד, לשמוע כל אחד, להתבשל ביחד עד ההחלטה'; לכידות חברתית = 'פאב, מפגשי משפחות'. על קצין כזה נאמר בכיתה: 'הוא היה סופר לכידות משימתית'."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"מה מלמד המחקר העדכני, לפי השקף 'The Cohesion-Performance Relationship', על הקשר בין לכידות לביצועים?",o:["רק לכידות משימתית קשורה לשיפור ביצועים; לכידות חברתית פוגעת בהם","רק לכידות חברתית קשורה לשיפור ביצועים; המשימתית אינה משפיעה","עלייה בשני סוגי הלכידות, המשימתית והחברתית, קשורה לעלייה בביצועים","אין קשר עקבי בין לכידות לביצועים, והקשר תלוי בגודל הצוות בלבד"],c:2,e:"שקף 17: 'increases in both task and social cohesion are associated with increased performance'. המרצה [55:52]: 'השילוב של השניים הוא אופטימלי — ביצה ותרנגולת'."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"ראש צוות אומר: 'לא הצלחתי לגבש את הצוות — בואו נעשה תחרות בין הצוותים', ובאמת 'כל צוות מתיישר'. איזה גורם לפיתוח לכידות (The Development of Cohesion) הוא מנצל?",o:["חיזוק המשיכה הבין-אישית בין חברי הקבוצה","יצירת רקורד של הצלחות עבר וביצועים גבוהים","הפעלת סמכות פורמלית וסטנדרטים מוצהרים","טיפוח תחרות (competition) עם צוותים אחרים"],c:3,e:"שקף 18: 'Fostering competition with other teams'. המרצה [58:30]-[58:49]: 'מתי אנחנו הכי חזקים במשפחה? כשאנחנו בתחרות מול משפחות אחרות… כל צוות פתאום מתיישר'."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"צוות הנהלה מגובש מאוד: כשהמנכ\"ל מציע כיוון כולם מהנהנים גם כשיש להם ספק, ורעיון יצירתי של חבר חדש נדחה כי 'לא כך עושים אצלנו'. המרצה השוותה מצב כזה למים ש'מחיים אך גם יכולים להרוג'. מה מדגים המקרה?",o:["השפעות שליליות של לכידות-יתר: נורמות לא פרודוקטיביות ונטייה לחשיבת יחד","לכידות משימתית (Task cohesion) נמוכה: הצוות אינו מצליח לעבוד יחד על השלמת המשימה","קונפליקט מסוג A (Affective conflict): המחלוקות בצוות הפכו מעניין מקצועי לעניין אישי ורגשי","הרמוניה מלאכותית (Artificial harmony) הנובעת מחוסר לכידות: החברים אינם נמשכים לצוות"],c:0,e:"שקף 20: לכידות גבוהה עלולה להדגיש נורמות לא פרודוקטיביות, לדחות רעיונות יצירתיים החורגים מהנורמות ולהגביר את הסיכוי לחשיבת יחד. המרצה [59:41]-[61:20]: 'לכידות אובר… נורמה חולה שבה רצים אחרי אחד מהאנשים'."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"חשיבת יחד (Groupthink) מוגדרת בשקף כ:",o:["נטייה של חברי קבוצה להקצין את עמדותיהם לאחר דיון קבוצתי","נטייה של יחידים להפחית מאמץ כשהם עובדים בקבוצה ולהסתמך על אחרים","נטייה של צוותים מלוכדים מאוד לאבד את יכולות ההערכה הביקורתית שלהם","נטייה של צוות להתפצל לתתי-קבוצות יריבות סביב אדם דומיננטי אחד"],c:2,e:"שקף 21: 'a tendency for highly cohesive teams to lose their evaluative capabilities'. תשובה א' מתארת קיטוב קבוצתי (Group polarization) ותשובה ב' — בטלנות חברתית (Social loafing)."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בסימולציה ניהולית הצוות כבר 'סגור' על השקת המוצר בגרמניה. המנחה שותל בצוות משתתף שתפקידו להתנגד בכוונה ולטעון שיש להתחיל דווקא בדרום אמריקה. איזו שיטה למניעת חשיבת יחד (How to avoid Groupthink) זו?",o:["הזמנת מומחים חיצוניים (outside experts) שאינם חלק מהצוות","יצירת תתי-צוותים שיעבדו על אותה בעיה ויציגו את פתרונותיהם","עידוד שיתוף של נקודות מבט באמצעות סבב דיבור מחייב","הקצאת חבר צוות לתפקיד 'פרקליט השטן' (devil's advocate)"],c:3,e:"שקף 22: 'Assign one member to play devil's advocate'. המרצה [66:11]-[66:59] תיארה בדיוק את הסימולציה הזו ('שחקן ששתלנו… בואו נתחיל עם דרום אמריקה') והוסיפה: 'צריך שיהיה אחד בכל ארגון'. מומחה חיצוני אינו חבר צוות."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"ראש צוות של 12 אנשים מבחין שבדיונים רק שלושה דומיננטיים מדברים והשאר, גם בעלי ידע רב, שותקים. לפי המרצה, מה הפעולה המומלצת?",o:["לצמצם את הצוות לשלושת הדומיננטיים בלבד, כי מעבר לגודל מסוים הביצועים תמיד יורדים","להעביר את ההחלטות לראש הצוות בלבד כדי למנוע קונפליקט מסוג A (Affective)","לפצל לתתי-צוותים קטנים שבהם גם השקטים יביעו דעה, ואז לאחד את המסקנות","להעניק לדומיננטיים תפקיד פורמלי של 'פרקליט השטן' כדי לאזן את הדיון"],c:2,e:"[65:17]-[65:58]: 'צוות של 12 אנשים — מפצלים לתתי-צוותים… ואז כל אחד מהתתי-צוותים מעלה מסקנות; יש אנשים שבפורום מצומצם יגידו את דעתם'. תואם 'Create sub-teams' בשקף 22."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"מנהלת מתגאה שבצוות שלה 'אין שום קונפליקטים' וכולם מסכימים תמיד. לפי השקף 'Team Conflict' ודברי המרצה, מה הפרשנות הנכונה?",o:["זהו סימן מובהק לצוות אפקטיבי, שכן לפי השקף המפתח להתמודדות עם קונפליקט הוא להימנע ממנו לחלוטין","זהו סימן ללכידות חברתית (Social cohesion) גבוהה במיוחד, שמבטלת את הצורך בקונפליקט מסוג C","ייתכן שזו 'הרמוניה מלאכותית'; המפתח הוא לא להימנע אלא לחוות את סוג הקונפליקט הנכון","זהו סימן שהצוות בשל ומגובש, כי לפי המרצה קונפליקט הוא סימפטום של צוות חולה בכל מינון"],c:2,e:"המרצה [29:50]-[30:35]: מצב ללא קונפליקטים = 'הרמוניה מלאכותית… שקט שמתחתיו לבה גועשת'; 'קונפליקטים הם דבר טוב במינון הנכון'. שקף 24: 'the key… is not avoiding it'. רק קונפליקט לא מנוהל הוא סימפטום לצוות חולה."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"עובד מקבל תואר 'מצטיין' ובונוס, ועמיתיו בצוות משוכנעים שלא הגיע לו. בעקבות זאת מתגלע קונפליקט. איזה גורם לקונפליקטים בצוות (What causes Team Conflicts) זה מדגים?",o:["הערכה לא תואמת של מערכת התגמול (reward system)","רמות שונות של מחויבות (Different levels of commitment) בין החברים","סמכויות חופפות (Overlapping authority) בין בעלי תפקידים","העדפת אג'נדה אישית על פני אג'נדת הצוות (personal agendas)"],c:0,e:"שקף 26: 'Incompatible evaluation of reward system'. המרצה [69:06]-[69:35]: 'הוא קיבל מצטיין — מה הוא עשה?… מה קורה לעובד שבטוח שלא מגיע לו'. סמכויות חופפות עוסקות בחפיפה בין תפקידים, לא בתגמול."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"בחברת תוכנה הפיתוח מבקש לדחות השקה כדי לשפר את המוצר, ואילו השיווק והמכירות הבטיחו ללקוח מועד. שני הצוותים מלוכדים ומעריכים זה את זה. לפי המרצה, מה נכון?",o:["לכידות גבוהה מונעת קונפליקטים, ולכן מדובר בכשל תקשורת בלבד שייפתר בפגישת הבהרה","קונפליקט מתיעדוף שונה ומתלות הדדית במשימות — בלתי נמנע גם בצוות מלוכד","זהו קונפליקט מסוג A (Affective), כי כל צד מגן בעיקר על האינטרס האישי שלו","זהו סימן לחשיבת יחד (Groupthink), כי כל מחלקה מתיישרת עם עמדת המנהל שלה"],c:1,e:"[70:14]-[72:21]: 'כל אחד רואה זווית אחרת, תיעדוף שונה, אבל תלויים אחד בשני… גם קבוצות סופר מלוכדות עדיין יש בהן קונפליקטים… קונפליקט הוא בלתי נמנע, הניהול שלו קובע'. המחלוקת עניינית (C-type), לא אישית."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בשאלון 'How Do You Handle Conflict?' משתתף קיבל: ש'1=5, ש'6=4, ש'5=3, ש'10=3, ש'4=2, ש'9=1, ש'2=4, ש'7=4, ש'3=3, ש'8=2. מהו סגנונו המועדף ומהו סגנון הגיבוי (backup) שלו?",o:["מועדף: שיתוף פעולה (Collaborating); גיבוי: התפשרות (Compromising)","מועדף: התחשבות (Accommodating); גיבוי: תחרותיות (Competing)","מועדף: תחרותיות (Competing); גיבוי: שיתוף פעולה (Collaborating)","מועדף: תחרותיות (Competing); גיבוי: התחשבות (Accommodating)"],c:3,e:"שקף 31-32: Competing=ש'1+ש'6=9, Accommodating=ש'2+ש'7=8, Collaborating=ש'5+ש'10=6, Compromising=ש'3+ש'8=5, Avoiding=ש'4+ש'9=3. הסגנון המועדף הוא הגבוה ביותר והגיבוי הוא השני בגובהו."},
{l:9,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"לפי מפתח הניקוד של השאלון (שקף 31), הפריטים 'אני מנסה לשים את צורכי האחרים מעל לשלי' (ש'2) ו'אני שואף לטפח הרמוניה' (ש'7) מודדים יחד את הסגנון:",o:["התפשרות (Compromising)","הימנעות (Avoiding)","שיתוף פעולה (Collaborating)","התחשבות (Accommodating)"],c:3,e:"שקף 31: Accommodating = Q2+Q7 — הדגשת צורכי האחרים ואמפתיה (שקף 33). Compromising הוא Q3+Q8 ('פתרונות מספקים הדדית', 'לקבל חלק ממה שהצעתי'), Avoiding הוא Q4+Q9."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"המרצה הסבירה שני עקרונות בבניית השאלון: מדוע הפריטים של כל סגנון מפוזרים ואינם רצופים, ומדוע הסולם הוא 1–5. מה הסיבות שנתנה?",o:["הפיזור מקל על החישוב הידני של הציונים; הסולם 1–5 נבחר כי הוא המקובל ביותר בסקרים אקדמיים","הפיזור נועד למנוע הטיה של המשיב שמזהה את הסגנון; סולם אי-זוגי מאפשר נקודת אמצע","הפיזור מאפשר לבדוק את עקביות התשובות; סולם 1–5 מונע מהמשיב לבחור בתשובת אמצע","הפיזור מבטא סדר חשיבות של הסגנונות; סולם קצר מקצר את זמן המילוי של השאלון"],c:1,e:"[83:04]-[83:12]: 'בכוונה, כדי שאתה לא תהיה מוטה כשאתה עונה — כל זוג שאלות מודד קריטריון אחר'; [74:11]-[74:17]: 'סולם הוא תמיד מספר אי-זוגי בגלל האמצע'."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"המרצה הציגה את מודל תומס-קילמן (Thomas-Kilmann) כמפה על שני צירים. מנהל שמתואר כ'משתף פעולה מאוד אך לא אסרטיבי' ממוקם באיזה סגנון?",o:["תחרותיות (Competing) — גישת win-lose","התפשרות (Compromising) — גישת lose-lose זמנית","התחשבות (Accommodating) — היחסים קודמים","הימנעות (Avoiding) — נסיגה מהעימות"],c:2,e:"[85:12]-[86:06]: 'ציר אחד רמת שיתוף הפעולה, ציר שני רמת האסרטיביות… אנשים שהם סופר משתפים פעולה אבל פחות אסרטיביים'. שקף 39: Accommodating = unassertive and very cooperative. Competing הוא ההפך; Avoiding נמוך בשניהם."},
{l:9,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"משא ומתן (Negotiation) הוגדר בשקף כ:",o:["תהליך מיקוח (bargaining) במהלך עימות, המאפשר למעורבים להגיע לפתרון באופן שיטתי","תהליך שבו צד שלישי ניטרלי שומע את שני הצדדים ומכריע במחלוקת ביניהם באופן מחייב","סגנון ניהול קונפליקט שבו כל צד מוותר על חלק מדרישותיו כדי להגיע לפתרון מהיר","מנגנון פורמלי לחלוקת משאבים בארגון הנקבע מראש על ידי ההנהלה הבכירה"],c:0,e:"שקף 44: 'The bargaining process that often occurs during confrontation and enables the persons involved to systematically reach a solution'. שקף 45 מוסיף שכולם מנהלים מו\"מ והצדדים מחליטים מה ייתן וייקח כל אחד. הכרעת צד שלישי היא בוררות, לא מו\"מ."},
{l:9,t:"צוותים: נורמות ולכידות",s:"זום",q:"בדיון על בניית צוות שיווק בנטפליקס המרצה סיפרה על מיון רופאים ומנהלים ועל מחקרי אמי אדמונסון (Amy Edmondson). מה הייתה טענתה?",o:["במיון לתפקידים ניהוליים מסתכלים היום בעיקר על יכולת עבודת צוות — לפני הצד המקצועי","במיון לתפקידים ניהוליים הצד המקצועי הוא המכריע, ודינמיקה קבוצתית היא רק תוספת שולית","מבחני דינמיקה קבוצתית מתאימים רק לצבא ולמערכת הביטחון, ולא לחברות אזרחיות","טובי המוחות מצליחים תמיד גם בעבודת צוות, ולכן די למיין מועמדים לפי IQ"],c:0,e:"[34:23]-[35:45]: 'מבחני הדינמיקה הקבוצתית הם 90% מההבחנה… אדמונסון מראה עד כמה טובי המוחות נכשלים בעבודת צוות… כמעט בכל תפקיד מחפשים עבודת צוות לפני הפן המקצועי'. תואם את שאלת הדיון בשקף 9."},
]);

/* ===================== שיעור 10 — ניהול צוות (2) ===================== */
{l:10,t:"צוותים: נורמות ולכידות",s:"מצגת",q:"לפי שקף 3 של שיעור 10, מהם חמשת מאפייני הצוות (Team Characteristics) שמחקרים מציגים כמנבאים של צוות מצליח?",o:["נורמות, לכידות, מנהיגות, תקציב ותקשורת בין החברים","יעדים, תפקידים, נהלים, אמון ומחויבות לתוצאה","נורמות, לכידות, גודל, קונפליקט והתפתחות הצוות","גודל, גיוון, ותק, מבנה והיררכיה בתוך הצוות"],c:2,e:"שקף 3: Team norms, Team cohesiveness, Team size, Team conflict, Team development. המרצה [28:46]: 'חמשת המאפיינים שמחקרים מציגים לנו בצורה הטובה ביותר מהו צוות שיצליח' — לכל צוות, אם כי המדדים שונים לפי סוג הצוות."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"סטודנט הבין שקונפליקט מסוג A נקרא כך מהמילה effective. מה תיקנה המרצה?",o:["A בא מ-Active — קונפליקט פעיל שמתנהל בגלוי מול הצוות כולו","A בא מ-Affective — רגשי: הקונפליקט הפך לאישי ואינו קשור למשימה","A בא מ-Authority — קונפליקט על סמכויות חופפות בין מנהלים","A בא מ-Agreement — מחלוקת שמסתיימת לבסוף בהסכמה של שני הצדדים"],c:1,e:"המרצה [32:15-33:46]: 'A בא מהמילה אפקטיב = רגשי, לא effective = יעיל' — 'אני כבר יודע מה הוא רוצה להגיד, אני לא סובל אותו... דעה קדומה... הקונפליקט הופך להיות אישי, רגשי, לא קשור למשימה'. שקף 4: A-type conflict — 'emotional reactions that can occur when disagreements become personal rather than professional'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"לפי המרצה, מה הקשר הנפוץ בין קונפליקט רגשי (A-type) לבין קונפליקט מקצועי (C-type)?",o:["קונפליקט מקצועי נוצר תמיד מתוך קונפליקט רגשי ישן שלא נפתר","אין ביניהם קשר — הם מופיעים בצוותים מסוגים שונים לגמרי","קונפליקט רגשי הופך מעצמו למקצועי עם הזמן, בלי שום התערבות","קונפליקט רגשי נובע לרוב מקונפליקט מקצועי שלא טופל"],c:3,e:"המרצה [33:00-35:20]: 'הקונפליקט הרגשי הוא פחות בריא... והרבה פעמים הוא תוצאה של קונפליקט מקצועי שלא טופל כמו שצריך'; ולכן 'ברגע ש-C לא מטופל והפך ל-A — להחזיר את זה חזרה לפסים מקצועיים'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"לפי המרצה, מדוע קונפליקט קוגניטיבי (C-type) — למשל ויכוח אם להשיק מוצר באירופה או בדרום אמריקה — הוא 'הקונפליקט הרצוי'?",o:["כי הוא מסתיים תמיד בפשרה שבה כל צד מוותר על חלק מעמדתו","כי הוא מביא להפריה, לחדשנות ולהחלטות טובות יותר","כי הוא מאפשר למנהל לזהות מי מחברי הצוות אינו מתאים לתפקיד","כי הוא מקצר את זמן קבלת ההחלטות, שכן כל צד מציג עמדה ברורה, מנומקת ומבוססת"],c:1,e:"המרצה [33:47-34:46]: קונפליקט C הוא 'קוגניטיב = מקצועי' — 'הוא מביא להפריה, לחשיבה, לחדשנות, לרעיונות, לשיתוף פעולה, להיכרות טובה בצוות... החלטות שקולות יותר, טובות יותר'. לכן 'C נחשב קונסטרקטיב, A דסטרקטיב'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"בתרגיל 'איך הופכים קונפליקט דיספונקציונלי (שכבר רגשי) לפונקציונלי?' סיכמה המרצה שלושה עקרונות מהספרות. מהם?",o:["לפרק את הצוות, להחליף את המעורבים ולגייס עובדים חדשים","להכריע מיד לטובת הצד הבכיר, כדי לקצר את המחלוקת","להפריד בין האדם לבעיה, לתת זמן קצר להתקררות, ולשנות מקום","לדחות את הדיון בחודש, עד שהצדדים ישכחו את הוויכוח"],c:2,e:"המרצה [42:20-43:04]: 'להפריד בין האדם לבין הבעיה'; 'זמן התקררות — לא לעוד שבוע, לא לעוד חודש, כי קונפליקטים מקצועיים הם מהותיים'; 'להפריד במקום — במקום אחר, בזמן אחר'. ו'אף אחד לא הצטער על המילים שעוד לא אמר'. פירוק הצוות — רק בטווח הארוך, 'כשכבר אין ברירה'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"'אתם נכשלתם כמנהלים' — לפי המרצה, מתי?",o:["כשיש בצוות שלכם קונפליקטים מקצועיים שחוזרים על עצמם","כשהצוות אינו חברי ואינו נפגש גם מחוץ לשעות העבודה","כשאתם לא פופולריים בקרב כל חברי הצוות שלכם","כשאנשים באותו צוות אינם מדברים זה עם זה — חסר כבוד"],c:3,e:"המרצה [47:01-47:28]: 'אתם נכשלתם כמנהלים אם לא הצלחתם להגיע למצב שאנשים באותו צוות מדברים אחד עם השני; עזבו הרמוניה, עזבו חיבה, עזבו חברות — המילה היא רק כבוד'. ולכן המקום של המנהל הוא לפני שהקונפליקט הופך רגשי. היא גם אמרה ש'מנהל שמחפש רק את הפופולריות לא יצליח'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"שני עובדים מתווכחים, ואחד מהם מגייס לצידו עמית שלישי 'שיגיד לו שהוא צודק', במקום לפנות ישירות לעובד השני. מהו המצב הזה ומדוע הוא מסוכן, לפי השיעור?",o:["קונפליקט קוגניטיבי — הגורם השלישי מביא נקודת מבט מקצועית נוספת","בוררות — הגורם השלישי מכריע, וכך נחסך זמן לשני הצדדים","משולש קונפליקט — גורם שלישי הופך זאת ל'שניים על אחד'","חשיבת יחד — שני העובדים מתיישרים עם דעתו של הגורם השלישי"],c:2,e:"שקף 6: 'A conflict triangle occurs when two people are having a problem and, instead of addressing the problem directly with each other, one of them gets a third person involved'. המרצה [49:05-50:04]: 'זה הכי מסוכן, כי אז זה שניים על אחד'. החריג: גורם ניטרלי — מנהל הצוות או יועץ מקצועי."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"כשנשאלה מה הייתה עושה אחרת אחרי 20 שנות ניהול, דיברה המרצה על יועצים חיצוניים ואמרה 'זול זה יקר'. למה התכוונה?",o:["שהייתה מביאה יועצים הרבה קודם — מי שחוסך באיש מקצוע משלם בהחלטות שגויות","שיועצים חיצוניים יקרים מדי, ולכן עדיף לפתור כל קונפליקט בתוך הצוות עצמו","שיועץ חיצוני מעיד על כישלון המנהל, ולכן יש להימנע ממנו ככל האפשר","שכדאי תמיד לבחור ביועץ הזול ביותר, כי כולם מגיעים לאותן מסקנות"],c:0,e:"המרצה [51:25-53:57]: 'הרבה לפני — לוקחת יועצים חיצוניים. אנשים חושבים שיועץ חיצוני = נכשלתי — לא'; 'זול זה יקר — אתה חוסך איש מקצוע, אתה משלם בהחלטות לא נכונות'. זה מתאים 'למנהלים שיודעים לשים את האגו בצד'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"שני עובדים מתחככים, והמנהלת מחליטה 'לתת להם להתבשל לבד' ולא לפתוח את הבעיה שוב ושוב. לפי המרצה, מה נכון לגבי סגנון ההימנעות (Avoiding)?",o:["הוא תמיד שגוי, כי מנהל חייב להכריע מיד בכל קונפליקט בצוות","הוא הסגנון המומלץ לטווח ארוך, כי קונפליקטים נפתרים מעצמם","הוא מתאים רק למצבי חירום, כשאין זמן לדיון ולבירור","אינו אסטרטגיה לטווח ארוך, אבל בטווח הקצר יכול להתאים"],c:3,e:"שקף 8: Avoiding — 'Can create some space in an emotional environment. Not a good long-term strategy'. המרצה [54:34-55:56]: 'תנו להם להתבשל לבד... זה לא long-term strategy, אבל בטווח הקצר היא נכונה — נותן להם זמן לפתור, לדבר ביניהם'."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"לפי המרצה, מה העיקרון שמנחה את סגנון הוויתור (Accommodating), ומתי הוא מתאים?",o:["'היחסים קודם' — מתאים כשבוחרים על מה להילחם","'הניצחון קודם' — ומתאים כשהמנהל בטוח לגמרי שהוא צודק ושהזמן דוחק","'המשימה קודם' — ומתאים כשצריך לסיים את העבודה בכל מחיר","'הזמן קודם' — ומתאים כשצריך פתרון מהיר שמספק את שני הצדדים"],c:0,e:"המרצה [56:11-57:40]: Accommodating — 'relationship first... כשאתה יודע לשים את היחסים במקום הראשון אתה מוותר'; 'אתה צובר וצובר... גם אם אני חושבת שאני צודקת'; ומתי טוב: 'choose your battles — אני יודעת על מה אני נלחמת ועל מה לא'. שקף 9: יעיל גם כשלצד השני יש תוכנית טובה יותר."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"זום",q:"המרצה ביקשה 'לזכור את הסיפור' על שתי אימהות שרבו על לימון אחד — ואז התברר שילד אחד זקוק למיץ והשני לקליפה, וכך שניהם ניצלו. מה הנמשל?",o:["פשרה: כל אחת מקבלת חצי לימון, וכך אף אחת אינה יוצאת מפסידה","ויתור: אחת האימהות מוותרת על הלימון כדי לשמור על היחסים","שיתוף פעולה: בירור הצרכים האמיתיים מביא לפתרון win-win","תחרות: מי שהילד שלה חולה יותר מקבלת את הלימון כולו"],c:2,e:"המרצה [60:41-62:53]: 'לא תמיד אחד מנצח ואחד מפסיד... לחשוב איך שיתוף הפעולה מביא להגדלה, לתוספת, לרווחיות גבוהה יותר לשני הצדדים. זה הסגנון שבדרך כלל מוביל להצלחה' — אף שלא תמיד אפשר להגיע אליו. שקף 12: Collaborating — 'Seek a win-win outcome; Identify underlying concerns'. חצי לימון לכל אחת היה דווקא פשרה (lose-lose)."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"צוות של שבעה אנשים עובד היטב; הוסיפו לו עוד שניים, והביצועים לא השתפרו. לפי המרצה, מה מסביר זאת?",o:["חוק פארטו — 20% מהעובדים מבצעים תמיד 80% מהעבודה בצוות","אפקט פיגמליון — הציפיות מהעובדים החדשים נמוכות מדי מלכתחילה","חשיבת יחד — צוות גדול מסכים על כל דבר מהר מדי ובלי ביקורת","חוק התפוקה השולית הפוחתת — בצוות גדול יש יותר 'טרמפיסטים'"],c:3,e:"המרצה [63:33-64:47]: 'מכירים את חוק התפוקה השולית הפוחתת? יש שבעה אנשים בצוות, הוספנו עוד שניים — במקום שהביצועים ישתפרו...'; במשיכת חבל עם שישה בכל צד 'אחד או שניים לא כל כך בא להם' — פרי ריידר, טרמפיסט. צוות גדול מדי גם מתפצל לתת-קבוצות ודורש זמן ומשאבים רבים."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"לפי המחקרים שהציגה המרצה, מהו גודל הצוות האופטימלי, ומה משפיע עליו?",o:["2-3 אנשים — כך אין בכלל טרמפיסטים, וההחלטות מהירות","5-7 אנשים — תלוי בסוג הצוות, במקצועיות, בענף ובדחיפות ההחלטות","10-12 אנשים — כך יש מספיק גיוון, ידע ורעיונות לכל משימה בצוות","אין גודל אופטימלי — כל צוות יעיל באותה מידה, בכל גודל"],c:1,e:"המרצה [65:48-67:06]: 'המחקרים מראים פלוס-מינוס 5 עד 7 אנשים — תלוי בסוג הצוות, רמת המקצועיות, הרקע, הגילאים, מנהל הצוות, הענף, מידת הדחיפות' (צוות פיתוח מוצר קטן מצוות במוקד טלפוני). תפקיד ראש הצוות 'להגיד מתי עברנו את הפיק'. צוות קטן מדי — 'אין מספיק גיוון, רעיונות ויצירתיות'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"מהו הסדר של ארבעת שלבי ההתפתחות של צוות (Tuckman) שנלמדו בשיעור?",o:["Forming, Norming, Storming, Performing","Storming, Forming, Norming, Performing","Forming, Storming, Norming, Performing","Norming, Forming, Storming, Performing"],c:2,e:"שקף 14: Forming, Storming, Norming, Performing (בגרף מופיעים אחריהם גם שלבי הדעיכה, שהמרצה אמרה שאינם נלמדים בקורס). המרצה [67:42]: 'אי אפשר לדלג' על שלבים — 'אני לא יכולה להיות סבתא בלי שהייתי בגיל ההתבגרות'. שימו לב: הסערה באה לפני הנורמות."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"לפי המרצה, מדוע חשוב שכל ראש צוות ידע באיזה שלב התפתחות נמצא הצוות שלו?",o:["כי תפקידו — חניכה, שיתוף או החלטה לבד — משתנה לפי השלב","כי בכל שלב צריך להחליף את חברי הצוות כדי להתקדם לשלב הבא","כי השלב קובע את גודל הצוות האופטימלי ואת התקציב שלו","כי ראש צוות טוב יודע לדלג על השלבים הקשים ולחסוך בכך זמן יקר לצוות"],c:0,e:"המרצה [67:42-68:37]: 'כל אחד צריך לדעת איפה הוא נמצא, כי תפקיד ראש הצוות משתנה לפי השלב — צוות חדש מנהלים אחרת מצוות ותיק: רמת החניכה, רמת שיתוף הפעולה, רמת קבלת ההחלטות לבד — משתנים'. ואי אפשר לדלג על שלבים."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"צוות חדש נפגש לראשונה: כולם מנומסים, אופטימיים ומנסים לעשות רושם טוב, וראש הצוות קובע כללי יסוד ומבנה ראשוני. באיזה שלב מדובר?",o:["Norming — שלב שבו חברי הצוות מתמקמים בתפקידים ונוצרות חברויות","Forming — שלב ההיכרות, שבו נקבעים הנורמות והחוקים הראשונים","Performing — שלב שבו הצוות מתפקד במלואו ומחויב לתוצאה","Storming — שלב שבו חברי הצוות נעשים אסרטיביים ומתווכחים"],c:1,e:"שקף 15: Forming — 'the initial stage of team development (getting acquainted stage)'; נקבעות נורמות, וראשי הצוות קובעים כללי יסוד ומבנה ראשוני. המרצה [69:32-71:42]: 'שלב אופטימי, אידיאלי... כמו בדייט... המנהלים קובעים את החוקים — זה עדיין לא חברויות'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"שאלת דיון בשקף 16: 'איך צוות יכול לבנות אמון כבר בשלב ה-Forming?'. מה הדגישה המרצה?",o:["להמתין עם בניית האמון עד שלב ה-Norming, כשהנורמות כבר ברורות","למנות סגן מבין חברי הצוות שהמנהל כבר מכיר וסומך עליו","ראש הצוות בא 'נקי', בלי דעות קדומות ובלי 'פייבוריטים'","לקבוע יעדים מאתגרים כבר בשבוע הראשון, כדי לבדוק מי עומד בהם"],c:2,e:"המרצה [71:44-73:42]: 'אתה בא נקי כראש צוות — בלי דעות קדומות, בלי יש לי פייבוריט — וזה מעיד מראש שהעובדים יכולים לתת לך אמון'; ו'לתת לכל אחד מקום להביע דעה'. 'שיתוף פעולה, אמון, שקיפות, הדדיות, פתיחות — בלעדיו לא עולים לשלב הבא'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"אחרי כמה שבועות 'המסכות יורדות' בצוות: הבדלי אישיות מתנגשים, יש ויכוחים, והביצועים עדיין נמוכים. לפי השיעור, איך מכונה השלב, ומה משמעותו?",o:["Forming — שלב ההיכרות, שבו כולם עדיין מנסים לעשות רושם טוב","Norming — שלב שבו מגבשים כללים, ערכים ודפוסי עבודה משותפים","Performing — שלב שבו הצוות כבר יודע להתגבר על קונפליקטים לבד","Storming — 'גיל ההתבגרות של הצוות', שקובע אם יתפרק או יצליח"],c:3,e:"שקף 17: Storming — קונפליקטים ומחלוקות, התנגשות אישיויות וסגנונות, החברים אסרטיביים יותר והביצועים עדיין נמוכים. המרצה [73:46-78:05]: 'גיל ההתבגרות של הצוות... כל המסכות יורדות'; 'זה מה שקובע אם הצוות יתפרק או יעלה למעלה ויצליח' — 'מפה אתה עולה או נופל'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"לפי הדיון בכיתה (שקף 18), איך מנווטים הבדלי אישיות בשלב ה-Storming?",o:["מחליפים מיד את מי שמתווכח, כדי שהצוות יתגבש מהר ככל האפשר","נותנים לכל אחד מקום, ואז מחלקים תפקידים, גבולות ופרוצדורות","נמנעים מכל התערבות, כדי שהצוות יעבור את השלב בכוחות עצמו","מדלגים ישר לשלב הביצועים באמצעות יעדים מאתגרים במיוחד"],c:1,e:"המרצה [75:15-76:15]: 'לתת לכל אחד מקום — זה אמון; ואחרי האמון: כל אחד מקבל את התפקיד שלו, האחריות שלו — חלוקת תפקידים, הגדרת גבולות, פרוצדורות — מצוין'. היא הוסיפה שמנהל טוב מוצא דרך עבודה שמנתבת גם את מי 'שבא לריב', בלי לפרק את הצוות."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"'שאלה שיכולה להופיע במבחן: איך אנחנו יודעים שעברנו משלב ה-Storming לשלב ה-Norming?'. איזה מהבאים הוא סימן לכך, לפי המרצה?",o:["המסכות יורדות ומתחילים ויכוחים גלויים בין חברי הצוות","חברי הצוות מנומסים ומנסים לעשות רושם ראשוני טוב זה על זה","הרעש יורד, יש שיתוף פעולה והמנהל נדרש פחות","חברי הצוות מתחילים לזלזל בנורמות, ואחדים מהם עוזבים את הצוות"],c:2,e:"המרצה [80:38-81:14]: 'שאלה שיכולה להופיע במבחן... שקט — הרעש מתחיל לרדת; יש שיתוף פעולה; הגרפים עולים; פחות המנהל; הדברים מתגבשים; החלטות יותר טובות; משך הזמן מתקצר — כל הסימנים שעוזרים לראות שהצוות עלה'. מסכות שיורדות — Storming; רושם ראשוני — Forming; זלזול בנורמות — שלבי הדעיכה."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"לפי שקף 20, מה מאפיין את שלב ה-Norming?",o:["חברי הצוות נפגשים לראשונה, וראש הצוות קובע כללי יסוד ומבנה ראשוני","חברי הצוות נעשים אסרטיביים, והבדלי אישיות וסגנונות עבודה מתנגשים","החברים מתמקמים בתפקידים, נוצרות נורמות חיוביות, והביצועים עולים","הצוות מתפרק בהדרגה, כי חבריו עוזבים ומזלזלים בנורמות שנקבעו"],c:2,e:"שקף 20: Norming — 'team members begin to settle their roles'; 'Positive team norms develop'; 'Teammates know what to expect from each other'; 'Friendships develop'; 'Increase in performance'. המרצה [79:00]: 'בונים נורמות, בונים כללים, בונים ערכים, מגבשים דפוסי עבודה'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"לפי שקף 22, מה מאפיין את שלב ה-Performing?",o:["צוות שעדיין מגבש כללים וערכים, וחבריו לומדים למה לצפות זה מזה","צוות שבו מתחילים קונפליקטים, והביצועים עדיין נמוכים יחסית","צוות שחבריו מנומסים ואופטימיים, אך עוד אינם מכירים זה את זה","צוות שמתפקד במלואו; חבריו נאמנים זה לזה וחשים אחריות הדדית"],c:3,e:"שקף 22: Performing — 'performance improves; Fully functioning team; Members are fully committed to the team; Members are fully loyal to one another and feel mutual accountability for team successes and failures'. המרצה: 'השלב שאליו אנחנו שואפים להגיע'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"לפי שקף 25, מה מאפיין צוות רב-תחומי (Cross-Functional team)?",o:["עובדים מאותה מחלקה עם רקע זהה, שמתמחים יחד בתחום אחד","עובדים מתחומים שונים, שתוקפים בעיות מכמה זוויות","צוות זמני שמוקם לפרויקט חד-פעמי ומתפרק בסיומו","עובדים מפוזרים גיאוגרפית, שעובדים יחד רק באמצעות טכנולוגיה"],c:1,e:"שקף 25: 'Employees from different functional areas... different functional backgrounds, education and experience; Attack problems from multiple perspectives; Generate more ideas and alternative solutions; Often used in conjunction with matrix and product organizational structures'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"צוות רב-תחומי מפתח קומקום חשמלי: מעצב, מהנדס חשמל, איש בטיחות, איש שיווק ואיש מכירות. לפי המרצה, מה החיסרון של צוות כזה?",o:["כולם באים מאותו רקע מקצועי, ולכן חסר בו גיוון של נקודות מבט ורעיונות","הוא מתפרק בסיום כל פרויקט, ולכן אין לו המשכיות ארגונית","כל אחד רואה בתחומו את העיקר, ואם מומחה חסר — הפרויקט נתקע","הוא עובד רק באמצעים טכנולוגיים, ולכן חסרה בו תקשורת לא מילולית"],c:2,e:"המרצה [85:36-89:55]: היתרון — הרבה רקע, ניסיון ונקודות מבט ('יצא המוצר הטוב יותר'); החסרונות — 'כל אחד תופס שהתחום שלו הכי חשוב', ו'מספיק שאחד לא נמצא — לא יכולים להתקדם עם הפרויקט, החלטות מתעכבות'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"איזו מהדוגמאות הבאות הוצגה בשקפים כדוגמה לצוות רב-תחומי (Cross-Functional)?",o:["GitLab — עובדים מרחוק ברחבי העולם, בלי משרדים פיזיים","Spotify — Squads שנתמכים בידי Tribes, Chapters ו-Guilds","W.L. Gore — צוותים קטנים שבהם כל אחד בוחר את הפרויקט שלו","Alexa של אמזון — חוקרי AI, מהנדסי חומרה, מעצבי UX ואנשי אסטרטגיה"],c:3,e:"שקף 26: 'Amazon's innovation in Alexa involved cross-functional teams of AI researchers, hardware development, UX designers, and business strategists'. דוגמאות נוספות: P&G Connect + Development ותוכן המקור של נטפליקס (Stranger Things). GitLab — מבנה וירטואלי; Spotify — מבנה מעגלי; Gore — שליטה ואחריותיות ללא שכבות ניהול (שיעור 6)."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"לפי שקף 29, מה נכון לגבי צוות פרויקט (Project team)?",o:["מוקם לפרויקט חד-פעמי בזמן מוגבל ומצמצם מחסומי תקשורת","קבוע לאורך שנים, וחבריו מתמחים יחד בתחום מקצועי אחד ויחיד בארגון","מורכב מעובדים מפוזרים גיאוגרפית שנפגשים רק באמצעים טכנולוגיים","מחליף את המחלקות הפונקציונליות בארגון ומבטל את ההיררכיה"],c:0,e:"שקף 29: 'Teams created to achieve one-time specific projects within a limited time; Often used to develop new products, improve existing products or create new ideas; Usually reduce or eliminate communication barriers; Promote flexibility'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"לפי המרצה, מהם החסרונות של צוות פרויקט (צוות אד-הוק)?",o:["הוא איטי מאוד בהתגבשות, כי אין לו תאריך יעד מוגדר לסיום העבודה","יש לו 'תאריך תפוגה', והמחויבות נמוכה כשהוא 'נוסף על תפקידך'","חבריו מגיעים מאותה מחלקה, ולכן חסרים בו ידע ורקע מגוונים","הוא יקר מאוד, כי חייבים לגייס לו עובדים חדשים מחוץ לארגון"],c:1,e:"המרצה [90:13-94:48]: 'תמיד לצוות פרויקטלי יש תאריך תפוגה' — בסיום 'כל אחד הולך לכיוונו', ויש בעיית המשכיות; 'אם זה נוסף על תפקידך אתה לא תמיד מחויב', ו'אין צד חברתי'. מנגד, הוא ממוקד, מתגבש מהר ('יש תאריך') ומקדם גמישות ארגונית — מביאים אנשים ממחלקות קיימות במקום לגייס."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"לפי שקף 30, מה מאפיין צוות וירטואלי (Virtual team)?",o:["עובדים מאותו משרד שנפגשים פנים אל פנים בכל יום עבודה","צוות קבוע שדורש מחבריו זמן מחויבות גבוה מצוות רגיל","עובדים מפוזרים שעובדים בעזרת טכנולוגיות מידע; לרוב צוות זמני","צוות שמורכב רק מעובדים ממדינות שונות, ולכן הוא תמיד גלובלי"],c:2,e:"שקף 30: 'Groups of geographically and/or organizationally dispersed coworkers; Use a combination of information technologies to accomplish the task; Often temporary teams; Require smaller time of commitment than traditional teams'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"לפי המרצה, מה נכון לגבי הקשר בין צוות וירטואלי לבין צוות גלובלי?",o:["כל צוות וירטואלי הוא בהכרח גלובלי, כי חבריו נמצאים במדינות שונות","כל צוות גלובלי הוא בהכרח וירטואלי, כי אין דרך אחרת לעבוד יחד","צוות וירטואלי וצוות גלובלי הם שני שמות לאותו סוג בדיוק של צוות","לא כל וירטואלי גלובלי ולהפך — גם צוות מאותו אזור עובד לפעמים מרחוק"],c:3,e:"המרצה [95:00]: 'לא כל צוות וירטואלי הוא צוות גלובלי, ולא כל צוות גלובלי הוא צוות וירטואלי... יכול להיות שכולנו ברמת השרון, תל אביב, גוש דן — ועדיין 99% מהאינטראקציה באמצעים טכנולוגיים'. היתרון: חיסכון בזמן ובכסף."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"זום",q:"'אף אחד מכם לא אמר את הדבר החשוב ביותר' — לפי המרצה, מהו החיסרון הגדול ביותר של צוות וירטואלי?",o:["היעדר תקשורת בין-אישית לא מילולית, שגורם לטעויות בהבנת מסרים","התלות בטכנולוגיה, שכל תקלה בה משביתה את עבודת הצוות","הקושי של המנהל לבקר את העובדים כשהוא אינו רואה אותם","העלויות הגבוהות של ציוד, תוכנות ורישיונות שצריך לרכוש לכל העובדים"],c:0,e:"המרצה [96:02-99:53]: אחרי שהסטודנטים מנו בקרה, תלות בטכנולוגיה והיעדר צד חברתי — 'אף אחד לא אמר את הדבר החשוב ביותר: אין תקשורת בין-אישית — non-verbal communication, שפת גוף, הבעות פנים... שוגים בהבנה של מסרים'. לכן מנהלים רבים מחזירים עובדים למשרדים — זה 'פוגע בתרבות הארגונית'."},
{l:10,t:"התפתחות צוות וסוגי צוותים",s:"מצגת",q:"השקף 'ביצועים מול גודל צוות' (Performance vs. Team Size) מציג גרף. מה הוא מבטא?",o:["הביצועים עולים באופן ליניארי ככל שמספר החברים בצוות גדל","הביצועים עולים עם הגודל עד נקודה מסוימת ואז יורדים כשהצוות גדול מדי","הביצועים הגבוהים ביותר מושגים תמיד בצוותים הקטנים ביותר, של שניים או שלושה חברים","אין כל קשר בין גודל הצוות לביצועיו; הביצועים תלויים במידת הלכידות בלבד"],c:1,e:"שקף 13 מציג עקומה של ביצועים כפונקציה של גודל (U הפוכה): צוות קטן מדי חסר משאבים וצוות גדול מדי סובל מתיאום לקוי, טרמפיסטים ודומיננטיות. המרצה (שיעור 9, [65:26]) ציינה ש'לפעמים צוות גדול מדי' ולכן מפצלים לתתי-צוותים."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בישיבת צוות מוצר אנשי הפיתוח והשיווק מתווכחים בלהט האם להשיק גרסה מוקדמת או להמתין לשיפורים. הוויכוח ענייני, ממוקד בבעיה, ואיש אינו נפגע אישית. איזה סוג קונפליקט זה, ומה יחסו של השקף אליו?",o:["קונפליקט מסוג C (Cognitive) — 'הסוג הנכון' של קונפליקט שצוות צריך לחוות","קונפליקט מסוג A (Affective) — רצוי, כי הוא מבטא מעורבות רגשית גבוהה של החברים","קונפליקט מסוג C (Cognitive) — יש להימנע ממנו כי הוא מעכב את קבלת ההחלטות","קונפליקט מסוג A (Affective) — יש לנהלו בזהירות כי המחלוקת המקצועית הפכה לאישית"],c:0,e:"שקף 4: C-type (קוגניטיבי) מתמקד בחילוקי דעות סביב הבעיה, ו'המפתח אינו להימנע מקונפליקט אלא לוודא שהצוות חווה את הסוג הנכון'. A-type הוא תגובה רגשית כשהמחלוקת הופכת אישית — לא המקרה כאן."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"לפי השקף 'Constructive & Destructive Conflict', קונפליקט בונה (Constructive) מאופיין ב:",o:["שימוש בהבדלים כקווי חלוקה וחשיבה דיכוטומית של 'צודק או טועה, חזק או חלש'","גישה משתפת של win/win, כוח משותף והתמקדות באינטרסים משותפים","גישה תחרותית של win/lose והתמקדות באינטרס העצמי, באווירה מאיימת","הימנעות ממחלוקות ושמירה על שקט כדי לא לפגוע ביחסים בין חברי הצוות"],c:1,e:"שקף 27 בשיעור 9: קונפליקט בונה 'affirms differences… participatory – win/win, shared power, focused on team common interests, safe'. תשובות א' ו-ג' מתארות קונפליקט הרסני; הימנעות אינה קונפליקט בונה."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"בזמן תקלה חמורה במערכת, כשכל דקה עולה כסף, מנהלת המשמרת מחליטה לבד, מורה לצוות מה לעשות ואינה פותחת דיון. לפי השקפים על סגנונות ניהול קונפליקט, איזה סגנון זה ומתי הוא מתאים?",o:["שיתוף פעולה (Collaborating) — גישת win-win המתאימה כשיש זמן ומאמץ משני הצדדים","תחרותיות (Competing) — גישת win-lose המתאימה למצבי חירום שבהם הזמן קריטי","התפשרות (Compromising) — פתרון זמני ומהיר שמספק חלקית את שני הצדדים","הימנעות (Avoiding) — יצירת מרחב בסביבה רגשית, אך לא אסטרטגיה לטווח ארוך"],c:1,e:"שקף 10: Competing — אסרטיבי ולא משתף פעולה, win-lose, 'may be appropriate for emergencies when time is important'. שקף 7 מוסיף שסגנונות שונים מתאימים למצבים שונים."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"שני ראשי צוותים חולקים על חלוקת תקציב; כדי לסיים מהר הם מסכימים שכל אחד יוותר על חלק, ואיש מהם אינו מרוצה לגמרי. לפי השקף, איזה סגנון זה ומהי תוצאתו?",o:["התחשבות (Accommodating) — צד אחד מוותר לגמרי לטובת שמירת היחסים","שיתוף פעולה (Collaborating) — win-win שמזהה את הצרכים העמוקים של שני הצדדים","התפשרות (Compromising) — גישת lose-lose ופתרון זמני שמספק חלקית את שניהם","תחרותיות (Competing) — win-lose שבו אחד הצדדים כופה את עמדתו על השני"],c:2,e:"שקף 11: Compromising — בינוני באסרטיביות ובשיתוף פעולה, 'results in a lose-lose approach… fast, mutually acceptable solutions that partially satisfy both parties… temporary'. ב-Accommodating רק צד אחד מוותר."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"לפי השקף על סגנון ההתחשבות (Accommodating), מתי הסגנון הזה אפקטיבי?",o:["כשהזמן קריטי ויש לקבל החלטה מיידית ללא דיון","כשלצד השני יש תוכנית או פתרון טובים יותר משלך","כשהסביבה טעונה רגשית ויש צורך ליצור מרחב","כשיש צורך בפתרון זמני שמספק חלקית את שני הצדדים"],c:1,e:"שקף 9: 'Effective when the other person/party has a better plan or solution'. חירום מתאים ל-Competing, יצירת מרחב רגשי ל-Avoiding, ופתרון זמני חלקי ל-Compromising."},
{l:10,t:"קונפליקט וסגנונות ניהולו",s:"מצגת",q:"מנהל פרויקט מקדיש שתי פגישות ארוכות כדי להבין מהם הצרכים העמוקים של כל צד במחלוקת, מזמין רעיונות רבים ומגיע לפתרון שבו שני הצדדים מרוויחים. איזה סגנון זה, ומה 'המחיר' שלו לפי השקף?",o:["התפשרות (Compromising) — המחיר הוא שאף צד אינו מסופק במלואו","שיתוף פעולה (Collaborating) — המחיר הוא זמן ומאמץ משני הצדדים","התחשבות (Accommodating) — המחיר הוא התעלמות מהסוגיות עצמן","הימנעות (Avoiding) — המחיר הוא דחיית התגובה ופגיעה בטווח הארוך"],c:1,e:"שקף 12: Collaborating — אסרטיבי ומשתף פעולה, win-win, מזהה 'underlying concerns', יוצר מקום לרעיונות רבים, ו'require time and effort from both parties'. Compromising היה מסתפק בפתרון חלקי ומהיר."},
]);

/* ===================== שיעור 11 — שינוי ותקשורת ===================== */
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"לפי שקף 2 בשיעור 11 (The Changing Work-Place), מה מרוויחים ארגונים שמצליחים להשתנות?",o:["יתרון תחרותי, כי חברות מצליחות ממשיכות לחדש ולהסתגל","פטור מחידושים נוספים, כי הסתגלות אחת מספיקה לשנים","יציבות מלאה בכוח האדם ובנהלים, בלי צורך להסתגל שוב","היעלמות של ההתנגדות, כי העובדים כבר התרגלו לשינויים"],c:0,e:"שקף 2: 'Organizations that change successfully can gain a competitive advantage'. לפי אותו שקף, ארגונים צריכים להסתגל כל הזמן למצבים חדשים, וחברות מצליחות ממשיכות לחדש. כלומר, השינוי אינו אירוע חד פעמי."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"לפי שקף 4 (Forces for Change), איזה מהבאים הוא כוח פנימי (Internal force) לשינוי?",o:["חקיקה ותקנות חדשות של הממשלה","שינויים בשוק העבודה ובזמינות העובדים","שינוי באסטרטגיה של הארגון עצמו","שינויים כלכליים, כמו מיתון או אינפלציה"],c:2,e:"שקף 4: הכוחות הפנימיים הם שינויים באסטרטגיה הארגונית, שינויים בכוח האדם, ציוד חדש ועמדות העובדים. הכוחות החיצוניים הם השוק, חוקים ותקנות של הממשלה, טכנולוגיה, שוק העבודה ושינויים כלכליים."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"בשקף 4 מופיעים גם 'טכנולוגיה' וגם 'ציוד חדש'. איך כל אחד מהם מסווג?",o:["שניהם כוחות חיצוניים, כי מקורם בספקים שמחוץ לארגון","טכנולוגיה היא כוח חיצוני, וציוד חדש כוח פנימי","טכנולוגיה היא כוח פנימי, וציוד חדש הוא כוח חיצוני","שניהם כוחות פנימיים, כי הארגון מחליט אם לאמץ אותם"],c:1,e:"שקף 4: Technology מופיעה תחת External forces, ו-New equipment תחת Internal forces. אפשר לזכור זאת כך: הטכנולוגיה מתפתחת בסביבה, ואילו ציוד חדש שהארגון מכניס משנה אותו מבפנים."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"לפי המודל בשקף 3 (Model of Change of Sequence Events), מה בא אחרי זיהוי הכוחות הסביבתיים והפנימיים?",o:["הקפאה מחדש של המצב החדש, כדי שיישאר קבוע","יצירת תחושת דחיפות וגיבוש קואליציה מובילה","יישום מיידי, ורק אחר כך בדיקה אם היה בו צורך","הערכת הצורך בשינוי והגדרת מה צריך לשנות"],c:3,e:"שקף 3: Environmental Forces ו-Internal Forces מובילים ל-Need for Change: הערכת בעיות והזדמנויות, והגדרת השינויים הנדרשים בטכנולוגיה, במוצרים, באנשים ובתרבות. רק אחר כך בא Implement Change. הקפאה מחדש שייכת למודל של לוין, ותחושת דחיפות לקוטר."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"לפי שקף 3, באילו כלים משתמשים בשלב יישום השינוי (Implement Change)?",o:["ניתוח שדה כוחות ודרכים להתגבר על התנגדות","ניתוח SWOT והצלבה של חוזקות מול הזדמנויות","מדדי ביצוע ובנצ'מרקינג בין יחידות מקבילות","סקר שביעות רצון ותוכנית תגמולים לעובדים"],c:0,e:"שקף 3: 'Use force-field analysis, tactics for overcoming resistance'. ניתוח שדה הכוחות מופיע גם בשקף 5: כוחות שינוי מול כוחות התנגדות."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"מה הרעיון של שקף 5 (Managing Change)?",o:["קודם פועלים כוחות ההתנגדות, ורק אחריהם כוחות השינוי","כוחות ההתנגדות פועלים רק מחוץ לארגון, אצל המתחרים","כוחות שינוי דוחפים את השינוי, וכוחות התנגדות בולמים אותו","כוחות השינוי וההתנגדות הם אותו כוח, בעיני מנהלים שונים"],c:2,e:"שקף 5: Change Forces מלמעלה ו-Resistance Forces מלמטה פועלים על השינוי באותו זמן. זה הבסיס לניתוח שדה כוחות (שקף 3): כדי שהשינוי יקרה, מחזקים את כוחות השינוי או מחלישים את ההתנגדות."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"לפי שקף 6 (Why Do People Resist Change?), איזו מהבאות אינה סיבה להתנגדות לשינוי?",o:["העמימות וחוסר הוודאות שהשינוי מביא איתו","הנוחות של ההרגלים הישנים ושל שגרת העבודה","חשש מאובדן אישי של מעמד, כסף, סמכות או חברויות","ציפייה שהשינוי ישפר את המעמד והשכר שלהם"],c:3,e:"שקף 6 מונה ארבע סיבות: העמימות ואי הוודאות שהשינוי מביא, הנוחות של הרגלים ישנים, חשש מאובדן אישי (מעמד, כסף, סמכות, חברויות ונוחות אישית), והתפיסה שהשינוי אינו מתיישב עם המטרות והאינטרסים של הארגון. ציפייה לרווח אישי היא סיבה לתמוך בשינוי, לא להתנגד לו."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"עובד ותיק משוכנע שהשינוי יפגע בארגון עצמו, ולא רק בו. לפי שקף 6, לאיזו סיבה להתנגדות זה מתאים?",o:["הנוחות של ההרגלים הישנים ושל שגרת העבודה","התפיסה שהשינוי סותר את מטרות הארגון","חשש מאובדן אישי של מעמד, כסף או סמכות","חוסר ודאות, כי לא ברור מה יקרה אחרי השינוי"],c:1,e:"שקף 6: 'The perception that change is incompatible with the goals and interest of the organization'. כאן העובד לא חושש לעצמו, אלא מעריך שהשינוי רע לארגון."},
{l:11,t:"שינוי ארגוני והתנגדות",s:"מצגת",q:"מנהלת מחלקה מתנגדת לשינוי, כי לפי הניתוח שלה העלויות שלו גבוהות מהתועלת לארגון. איזו סיבה מתוך שקף 7 (Resistance to Change) מתארת זאת?",o:["הערכות ומטרות שונות: היא מעריכה אחרת","אינטרס אישי: היא חוששת לאבד כוח או מעמד","חוסר הבנה ואמון: היא לא מבינה את מטרת השינוי","אי ודאות: היא חוששת מהלא נודע שאחרי השינוי"],c:0,e:"שקף 7 מונה ארבע סיבות: Self Interest, Lack of understanding and Trust, Uncertainty, Different assessments and goals. כשמנהל מעריך את העלות והתועלת של השינוי אחרת מיוזמיו, זו הערכה שונה, ולא אינטרס אישי."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"מהו הסדר הנכון של שלושת השלבים במודל השינוי של קורט לוין (שקף 11)?",o:["Movement, Unfreezing, Refreezing","Unfreezing, Refreezing, Movement","Unfreezing, Movement, Refreezing","Refreezing, Movement, Unfreezing"],c:2,e:"שקף 11: 1. Unfreezing, הפשרה של המצב הקיים. 2. Movement, תנועה למצב הרצוי. 3. Refreezing, הקפאה מחדש של השינוי כדי שיהיה קבוע."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"מה תפקיד שלב ה-Refreezing אצל לוין, ומה עלול לקרות בלעדיו (שקף 12)?",o:["מקפיא את התקציב; בלעדיו השינוי יעלה יותר מהמתוכנן","עוצר שינויים נוספים; בלעדיו יבואו שינויים בלי הפסקה","מבטל את ההתנגדות; בלעדיו אי אפשר להתחיל את התנועה","מקבע את השינוי; בלעדיו חוזרים להרגלים הישנים"],c:3,e:"שקף 11: 'Refreezing the new change to make it permanent'. שקף 12 שואל מה קורה כשארגון מיישם שינוי ולא 'מקפיא' מחדש את התהליכים. בלי קיבוע, השינוי לא נעשה חלק מהשגרה, והארגון עלול לחזור לדרכים הישנות."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"מהו הצעד הראשון בשמונת הצעדים של קוטר (Kotter) לשינוי ארגוני?",o:["גיבוש קואליציה מובילה וחזקה","יצירת תחושת דחיפות לשינוי","יצירת חזון ותקשור שלו","השגת ניצחונות קצרי טווח"],c:1,e:"שקף 13: 1. Establishing a sense of urgency. 2. Forming a powerful guiding coalition. 3. Creating a vision. 4. Communicating the vision. 5. Empowering others to act on the vision. 6. Planning for and creating short-term wins. 7. Consolidating improvements and producing still more change. 8. Institutionalizing new approaches."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"מהו הצעד האחרון, השמיני, במודל של קוטר?",o:["מיסוד הגישות החדשות בארגון","השגת ניצחונות קצרי טווח","העצמת אחרים לפעול לפי החזון","הקפאה מחדש של המצב החדש"],c:0,e:"שקף 13: הצעד השמיני הוא Institutionalizing new approaches, כלומר מיסוד הגישות החדשות. ניצחונות קצרי טווח הם הצעד השישי, והעצמת אחרים היא החמישי. 'הקפאה מחדש' היא השלב השלישי במודל של לוין, לא של קוטר."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"ג'ון קוטר (Kotter) מופיע בקורס פעמיים. במה עוסק כל אחד מהמודלים שלו?",o:["בשיעור 11: שלושה שלבי שינוי; בשיעור 2: שמונה צעדים לשינוי ארגוני","בשיעור 11: סדר היום של המנהל הכללי; בשיעור 2: שמונה צעדים לשינוי","בשיעור 11: שמונה צעדים לשינוי; בשיעור 2: סדר היום של המנהל הכללי","בשיעור 11: שמונה צעדים לשינוי; בשיעור 2: שלבי ההפשרה וההקפאה מחדש"],c:2,e:"שקף 13 בשיעור 11: שמונת הצעדים של קוטר לשינוי ארגוני. בשיעור 2 (שקף 15): סדר היום של המנהל הכללי לפי קוטר, בשלושה טווחים: קצר (עד שנה), בינוני (עד חמש שנים) וארוך. שלושת השלבים, הפשרה, תנועה והקפאה מחדש, הם של לוין."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"המנכ״ל מגייס קבוצה של מנהלים בכירים ובעלי השפעה, שיובילו יחד את השינוי. איזה צעד של קוטר זה?",o:["העצמת אחרים לפעול לפי החזון","תקשור החזון לכל הארגון","מיסוד הגישות החדשות בארגון","גיבוש קואליציה מובילה וחזקה"],c:3,e:"שקף 13, הצעד השני: Forming a powerful guiding coalition, קבוצה חזקה שמובילה את השינוי. העצמת אחרים (הצעד החמישי) פירושה לאפשר לעובדים לפעול לפי החזון, אחרי שהוא נוצר ותוקשר."},
{l:11,t:"מודלים לשינוי: לוין וקוטר",s:"מצגת",q:"אחרי חודשיים, צוות השינוי מציג הצלחה ראשונה ומדידה ומפרסם אותה בארגון. איזה צעד של קוטר זה?",o:["ביסוס השיפורים והמשך השינוי","תכנון ויצירה של ניצחונות קצרי טווח","יצירת תחושת דחיפות בקרב העובדים","מיסוד הגישות החדשות בכל הארגון"],c:1,e:"שקף 13, הצעד השישי: Planning for and creating short-term wins. הצלחות מוקדמות ומדידות מראות שהשינוי עובד. אחריהן בא הצעד השביעי: Consolidating improvements and producing still more change."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"איך מוגדרת תקשורת (Communication) בשקף 15?",o:["יצירה של משמעות משותפת, או זהה, אצל אדם אחר","העברת מידע מהמנהל לעובדים, בכתב או בעל פה","היכולת לתקשר ביעילות במצבים מסוימים","כל מסר שנשלח בלי מילים, כמו לבוש ומרחק"],c:0,e:"שקף 15: 'Communication is the evoking of a shared or common meaning in another person', כלומר יצירה של משמעות משותפת, או זהה, אצל אדם אחר. שתיים מהתשובות האחרות מגדירות מושגים אחרים מאותו שקף: כשירות תקשורתית (Communication Competence) ותקשורת לא מילולית (Nonverbal communication)."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"מהנדסת בחטיבת הייצור פונה ישירות לסגן מנהל השיווק, שנמצא בדרג גבוה ממנה ובמחלקה אחרת. איזה סוג תקשורת זה לפי שקף 15?",o:["תקשורת לא מילולית, שנשענת על שפת הגוף","כשירות תקשורתית, כלומר יכולת לתקשר ביעילות","תקשורת אלכסונית, חוצת פונקציות ודרגים","תקשורת אנכית כלפי מטה, מהמנהל לכפיף"],c:2,e:"שקף 15: 'Diagonal Communication is communication that cuts across functions and levels in an organization'. כאן הפנייה חוצה גם מחלקה (מייצור לשיווק) וגם דרג."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"במודל התקשורת בשקף 16, מי מקודד (Encodes) את המסר ומי מפענח (Decodes) אותו?",o:["המקבל מקודד את המסר, והמנהל מפענח אותו לפני השליחה","המנהל מקודד, המקבל מפענח, ואז חוזר משוב למנהל","הערוץ מקודד את המסר, והרעש מפענח אותו בדרך למקבל","המנהל גם מקודד וגם מפענח, והמקבל רק מאשר שקיבל"],c:1,e:"שקף 16: Leader Encodes Message, ואז Channel, ואז Receiver Decodes Message, ולבסוף Return Message Encoded and Sent, כלומר משוב (Feedback). לאורך הדרך יש Potential Noise and Distortion. שקף 17: הקידוד מתרגם את הרעיון של המוען למערכת סמלים, לשפה."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"לפי שקף 18, מהו 'רעש' (Noise) בתהליך התקשורת, והיכן הוא יכול להופיע?",o:["רעש פיזי בחדר, ולכן הוא קיים רק בשיחה פנים אל פנים","תגובה שלילית של המקבל, ולכן הוא מופיע רק בשלב המשוב","מסר לא מילולי, ולכן הוא מופיע רק כשאין מילים בכלל","גורמים שמעוותים את המסר, והם יכולים להופיע בכל רכיב"],c:3,e:"שקף 18: 'Noise refers to those factors that distort the intended message. Noise may occur in each of the elements of communication'. כלומר רעש אינו רק רעש פיזי, והוא יכול להופיע אצל המוען, בקידוד, במדיום, בפענוח ובמשוב."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"שני עובדים שמעו מהמנהל אותו מסר, באותה ישיבה, והבינו אותו אחרת. לפי שקף 18, איזה רכיב בתקשורת מסביר זאת?",o:["המדיום: כל עובד קיבל את המסר בערוץ אחר ובזמן אחר","הקידוד: המנהל קידד את המסר מחדש לכל עובד בנפרד","הפענוח: כל מקבל מפרש לפי הניסיון ומסגרת ההתייחסות שלו","המשוב: העובדים לא החזירו משוב, ולכן המסר עצמו השתנה"],c:2,e:"שקף 18: 'Decoding involves interpretation. Receivers interpret (decode) the message in light of their own previous experiences and frames of reference'. אותו מסר, באותו ערוץ, יכול להתפרש אחרת אצל כל מקבל."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"לפי רצף עושר הערוצים (Continuum of Channel Richness) בשקף 20, מה הסדר מהערוץ העשיר ביותר לדל ביותר?",o:["פנים אל פנים, טלפון, דואר אלקטרוני, מזכרים ומכתבים, דוח רשמי","טלפון, פנים אל פנים, דוח רשמי, דואר אלקטרוני, מזכרים ומכתבים","דוח רשמי, מזכרים ומכתבים, דואר אלקטרוני, טלפון, פנים אל פנים","פנים אל פנים, דואר אלקטרוני, טלפון, דוח רשמי, מזכרים ומכתבים"],c:0,e:"שקף 20, משמאל (דל) לימין (עשיר): Formal Report, Memos/Letters, Email/IM/Web, Telephone, Face-to-face verbal. התשובה שמתחילה בדוח רשמי מציגה את אותו סדר, אבל מהדל לעשיר, הפוך ממה שנשאל."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"מנהל רוצה להעביר מדיניות חדשה לכל העובדים, ושיישאר ממנה תיעוד. לפי שקף 20, מה היתרונות של ערוץ דל, כמו דוח רשמי או מזכר?",o:["המסר אישי, דו כיווני, והמשוב מגיע מהר","אין תיעוד, המסר ספונטני, וההפצה קשה","המסר לא אישי, חד כיווני, והמשוב איטי","יש תיעוד, מתוכנן מראש, וקל להפיץ אותו"],c:3,e:"שקף 20: לערוץ דל יש יתרונות (Provide record, Premeditated, Easily disseminated) וחסרונות (Impersonal, One-way, Slow feedback). בערוץ עשיר, כמו שיחה פנים אל פנים, זה הפוך: אישי, דו כיווני ומשוב מהיר, אבל בלי תיעוד, ספונטני וקשה להפצה."},
{l:11,t:"תקשורת בארגון",s:"מצגת",q:"איזה מהבאים אינו אחד הצעדים של 'המנהיג כאלוף תקשורת' (The Leader as Communication Champion) בשקף 21?",o:["לבסס אמינות מול השומעים","להכתיב החלטה בלי להסביר אותה","לבנות יעדים על בסיס משותף","ליצור חיבור רגשי עם השומעים"],c:1,e:"שקף 21: Establish credibility, Build goals on common ground, Make your position compelling to others, Connect emotionally. המנהיג משכנע ומחבר את השומעים לעמדה שלו, ולא מכתיב אותה."},
{l:11,t:"תקשורת לא מילולית והקשבה",s:"מצגת",q:"לפי שקף 22 (How We Really Communicate), איך מתחלק מה שאנחנו מעבירים בתקשורת?",o:["מילים 55%, טון הקול 38%, התנהגות לא מילולית 7%","מילים 38%, טון הקול 7%, התנהגות לא מילולית 55%","מילים 7%, טון הקול 38%, התנהגות לא מילולית 55%","מילים 7%, טון הקול 55%, התנהגות לא מילולית 38%"],c:2,e:"שקף 22: 7% מבוסס על אוצר המילים (vocabulary), 38% על האינטונציה של הקול (voice inflections), ו-55% על התנהגות לא מילולית (nonverbal behavior)."},

{l:11,t:"תקשורת לא מילולית והקשבה",s:"מצגת",q:"לפי שקף 28, מה עושה 'מנהל מיידע' (Informative Manager) עם כמות גדולה של מידע שמגיעה אליו?",o:["מעביר את כל המידע לכל העובדים, בלי סינון","שומר את המידע לעצמו, כדי לשמור על הסמכות","מסנן אותו, ומפיץ לעובדים באופן סלקטיבי","מעביר רק מידע בכתב, ולא בעל פה, לתיעוד"],c:2,e:"שקף 28: מנהלים טובים 'keep those who work for them well informed and appropriately and selectively disseminate information'. התפקיד כולל קבלה של הרבה מידע, בערוצים רבים, וסינון שלו לפני ההפצה."},

(function(){
"use strict";
var LET=["א","ב","ג","ד"];
/* מקורות השאלות — צבע התווית ליד כל שאלה */
var SRC_META={
